<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Positioning · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.44">
<style>
body { background: var(--bg); }

.content { padding: 12px 14px 80px; max-width: 1280px; margin: 0 auto; }

/* ---- Picker bar ---- */
.picker {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 14px;
}
.picker .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.picker label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted);
}
.picker select, .picker input {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-soft); border-radius: 8px;
  padding: 8px 10px; font-size: 13px; font-variant-numeric: tabular-nums;
}
.picker .now-btn {
  align-self: end;
  background: rgba(59,130,246,0.18); color: #93c5fd;
  border: 1px solid rgba(59,130,246,0.4);
  border-radius: 8px; padding: 8px 14px;
  font-weight: 600; font-size: 12px; cursor: pointer;
  transition: background 0.15s;
}
.picker .now-btn:hover { background: rgba(59,130,246,0.28); }

/* ---- Context strip ---- */
.context {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 14px; align-items: center;
}
.ctx-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 6px 12px; font-size: 12px;
  color: var(--text-dim);
}
.ctx-pill strong { color: var(--text); font-weight: 600; }
.ctx-pill .dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted);
}
.ctx-pill .dot.day   { background: var(--warning); }
.ctx-pill .dot.night { background: #6366f1; }

/* ---- Totals row ---- */
.totals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.tot-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 12px 14px;
  border-top: 3px solid var(--info);
}
.tot-card.units  { border-top-color: var(--success); }
.tot-card.paras  { border-top-color: var(--info); }
.tot-card.ambs   { border-top-color: var(--warning); }
.tot-num {
  font-size: 24px; font-weight: 700;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.tot-label {
  margin-top: 4px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted);
}

/* ---- Station grid ---- */
.station-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.station-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.station-card.empty { opacity: 0.55; }
.sc-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; margin-bottom: 2px;
}
.sc-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.sc-zone {
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.sc-mainrow {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; align-items: end;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-soft);
}
.sc-stat { display: flex; flex-direction: column; min-width: 0; }
.sc-stat-num {
  font-size: 22px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
.sc-stat-lbl {
  margin-top: 2px;
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted);
}
.sc-types {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 4px;
}
.type-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface-2); border-radius: 6px;
  padding: 3px 8px; font-size: 11px;
  color: var(--text-dim);
}
.type-chip strong { color: var(--text); font-weight: 600; }
.type-chip.medical    { border-left: 2px solid #22c55e; }
.type-chip.ambulance  { border-left: 2px solid #f59e0b; }
.type-chip.foot       { border-left: 2px solid #3b82f6; }
.type-chip.doctor     { border-left: 2px solid #ec4899; }
.type-chip.other      { border-left: 2px solid #94a3b8; }

.empty-banner {
  background: var(--surface); border: 1px dashed var(--border-soft);
  border-radius: var(--radius); padding: 24px; text-align: center;
  color: var(--text-muted); font-size: 13px;
}
</style>
</head>
<body>
<script src="assets/version.js?v=0.2.44"></script>
<script src="assets/config.js?v=0.2.44"></script>
<script src="assets/auth.js?v=0.2.44"></script>
<script src="assets/topbar.js?v=0.2.44"></script>

<div class="content">
  <div class="picker">
    <div class="field">
      <label for="pickZone">Zone</label>
      <select id="pickZone">
        <option value="all">All zones</option>
        <option value="arafat">Arafat</option>
        <option value="muzdalifah">Muzdalifah</option>
        <option value="mina">Mina</option>
        <option value="occ">OCC / Depot</option>
      </select>
    </div>
    <div class="field">
      <label for="pickDH">Hajj day</label>
      <select id="pickDH"></select>
    </div>
    <div class="field">
      <label for="pickHour">Hour</label>
      <select id="pickHour"></select>
    </div>
    <div class="field">
      <label for="pickMvt">Movement filter</label>
      <select id="pickMvt"><option value="">Any movement</option></select>
    </div>
    <button class="now-btn" id="btnNow">Now</button>
  </div>

  <div class="context" id="contextStrip"></div>

  <div class="totals" id="totals"></div>

  <div id="grid" class="station-grid"></div>
</div>

<script>
(function () {
  HAJJ.requireSession();
  CADTopbar.render({ title: "Positioning", subtitle: "schedule view" });

  const ZONE_OF = {
    ARF1:'Arafat',ARF2:'Arafat',ARF3:'Arafat',
    MUZ1:'Muzdalifah',MUZ2:'Muzdalifah',MUZ3:'Muzdalifah',
    MIN1:'Mina',MIN2:'Mina',MIN3:'Mina',
    OCC:'OCC'
  };
  const TYPE_CSS = {
    'Medical':'medical','Ambulance':'ambulance','Foot-Runner':'foot',
    'Doctor':'doctor','Training':'other','Dispatch OCC':'other',
    'PM':'other','Deputy PM':'other','Admin Lead':'other',
    'Med Direction Lead':'other','Chief Paramedic':'other','Deputy Chief Paramedic':'other'
  };

  let _meta = null;

  document.getElementById('pickZone').addEventListener('change', refresh);
  document.getElementById('pickDH').addEventListener('change', refresh);
  document.getElementById('pickHour').addEventListener('change', refresh);
  document.getElementById('pickMvt').addEventListener('change', refresh);
  document.getElementById('btnNow').addEventListener('click', jumpToNow);

  // First call with defaults to populate dropdowns + paint
  refresh();

  async function refresh() {
    const zone = document.getElementById('pickZone').value || 'all';
    const dh   = document.getElementById('pickDH').value  || '9';
    const hour = document.getElementById('pickHour').value || '08:00';
    const mvt  = document.getElementById('pickMvt').value || '';
    const r = await HAJJ.authedCall('positioning_at', { zone, dh, hour, mvt });
    if (!r || !r.ok) { renderEmpty('Sync failed'); return; }

    // Populate dropdowns on first response (preserves current selections)
    if (r.meta && !_meta) {
      _meta = r.meta;
      populateDropdown('pickDH', r.meta.dh_days, dh);
      populateDropdown('pickHour', r.meta.hours, hour);
      populateDropdown('pickMvt', [''].concat(r.meta.movements), mvt, true);
    }

    paintContext(r);
    paintTotals(r);
    paintGrid(r);
  }

  function populateDropdown(id, values, current, includeAnyOption) {
    const el = document.getElementById(id);
    el.innerHTML = values.map(function(v) {
      const label = (id === 'pickMvt' && !v) ? 'Any movement' : (id === 'pickDH' ? ('DH ' + v) : v);
      const sel = (String(v) === String(current)) ? ' selected' : '';
      return '<option value="' + v + '"' + sel + '>' + label + '</option>';
    }).join('');
  }

  function jumpToNow() {
    // Hajj DH1 = 2026-05-27 (Arabia Standard Time, UTC+3) — adjust if calendar shifts
    const DH1 = new Date('2026-05-27T00:00:00+03:00');
    const now = new Date();
    const days = Math.floor((now - DH1) / 86400000) + 1;
    const dh = String(Math.max(4, Math.min(14, days)));
    const h  = String(now.getHours()).padStart(2,'0') + ':00';
    document.getElementById('pickDH').value = dh;
    document.getElementById('pickHour').value = h;
    refresh();
  }

  function paintContext(r) {
    const strip = document.getElementById('contextStrip');
    const isDay = r.slot === 'slot1';
    const parts = [
      '<span class="ctx-pill"><span class="dot ' + (isDay ? 'day' : 'night') + '"></span><strong>' + (r.dh || '—') + ' · ' + (r.hour || '—') + '</strong></span>',
      '<span class="ctx-pill">Shift: <strong>' + (r.shift || (isDay?'DAY':'NIGHT')) + '</strong></span>'
    ];
    if (r.mvt)  parts.push('<span class="ctx-pill">Movement: <strong>' + r.mvt + '</strong></span>');
    if (r.zone && r.zone !== 'all') parts.push('<span class="ctx-pill">Zone: <strong>' + r.zone.charAt(0).toUpperCase() + r.zone.slice(1) + '</strong></span>');
    strip.innerHTML = parts.join('');
  }

  function paintTotals(r) {
    const t = r.totals || {};
    const types = t.by_type || {};
    const typeBits = Object.entries(types)
      .sort(function(a,b){ return b[1]-a[1]; })
      .map(function(kv){ return '<span class="type-chip ' + (TYPE_CSS[kv[0]]||'other') + '">' + kv[0] + ' <strong>' + kv[1] + '</strong></span>'; })
      .join('');
    document.getElementById('totals').innerHTML =
      '<div class="tot-card units"><div class="tot-num">' + (t.units||0) + '</div><div class="tot-label">Units active</div></div>' +
      '<div class="tot-card paras"><div class="tot-num">' + (t.paras||0) + '</div><div class="tot-label">Paramedics + GPs</div></div>' +
      '<div class="tot-card ambs"><div class="tot-num">' + (t.ambulances||0) + '</div><div class="tot-label">Ambulances</div></div>' +
      (typeBits ? '<div class="tot-card" style="grid-column: span 2;"><div class="sc-types">' + typeBits + '</div><div class="tot-label" style="margin-top:6px;">By unit type</div></div>' : '');
  }

  function paintGrid(r) {
    const stations = r.by_station || [];
    if (!stations.length || !r.found) {
      document.getElementById('grid').innerHTML =
        '<div class="empty-banner" style="grid-column: 1/-1;">' +
        (r.reason === 'mvt_mismatch'
           ? 'This hour does not fall in movement <strong>' + (document.getElementById('pickMvt').value || '—') + '</strong>. Try a different movement or set to <em>Any</em>.'
           : 'No schedule entry found for this hour. Try a different DH day or hour.') +
        '</div>';
      return;
    }
    document.getElementById('grid').innerHTML = stations.map(function(s) {
      const isEmpty = !s.units && !s.paras && !s.ambulances;
      const typeBits = Object.entries(s.by_type || {})
        .sort(function(a,b){ return b[1]-a[1]; })
        .map(function(kv){ return '<span class="type-chip ' + (TYPE_CSS[kv[0]]||'other') + '">' + kv[0] + ' <strong>' + kv[1] + '</strong></span>'; })
        .join('');
      return '<div class="station-card ' + (isEmpty ? 'empty' : '') + '">'
        + '<div class="sc-head"><div class="sc-name">' + s.station + '</div><div class="sc-zone">' + (ZONE_OF[s.station]||'') + '</div></div>'
        + '<div class="sc-mainrow">'
        +   '<div class="sc-stat"><div class="sc-stat-num">' + s.units + '</div><div class="sc-stat-lbl">Units</div></div>'
        +   '<div class="sc-stat"><div class="sc-stat-num">' + s.paras + '</div><div class="sc-stat-lbl">Paras</div></div>'
        +   '<div class="sc-stat"><div class="sc-stat-num">' + s.ambulances + '</div><div class="sc-stat-lbl">Ambs</div></div>'
        + '</div>'
        + (typeBits ? '<div class="sc-types">' + typeBits + '</div>' : '<div class="sc-types"><span class="type-chip other">— off-duty —</span></div>')
        + '</div>';
    }).join('');
  }

  function renderEmpty(msg) {
    document.getElementById('grid').innerHTML =
      '<div class="empty-banner" style="grid-column: 1/-1;">' + msg + '</div>';
  }
})();
</script>

</body>
</html>
