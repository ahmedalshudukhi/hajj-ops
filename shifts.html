<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shifts</title><link rel="stylesheet" href="assets/style.css?v=0.2.38"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.sh-shell { max-width:1200px; margin:0 auto; padding:20px; }.sh-banner { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 22px; display:flex; justify-content:space-between; align-items:center; margin:14px 0 18px; }.sh-banner h2 { margin:0; font-size:18px; color:#cdf1ff; }.sh-banner .sub { font-size:12px; color:#93a4cd; margin-top:4px; }.sh-banner .stat { font-size:42px; font-weight:800; color:#67e8f9; line-height:1; }.sh-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }@media (max-width:900px) { .sh-grid { grid-template-columns:1fr; } }.sh-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 20px; }.sh-card h3 { margin:0 0 12px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }.sh-staff-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:6px; max-height:280px; overflow-y:auto; }.sh-staff { background:rgba(34,197,94,0.10); border:1px solid rgba(34,197,94,0.25); border-radius:6px; padding:7px 10px; font-size:12px; color:#86efac; }.sh-handoff { background:rgba(15,23,42,0.5); border-left:3px solid #fcd34d; border-radius:7px; padding:10px 14px; margin-bottom:8px; }.sh-handoff .head { display:flex; justify-content:space-between; font-size:11px; color:#93a4cd; margin-bottom:5px; }.sh-handoff .auth { color:#fcd34d; font-weight:600; }.sh-handoff .body { color:#e7ecf7; font-size:13px; line-height:1.5; white-space:pre-wrap; }.sh-form label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:10px 0 5px; }.sh-form select, .sh-form textarea { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; font-family:inherit; }.sh-form textarea { min-height:120px; resize:vertical; }.sh-form button { padding:11px 22px; background:rgba(56,189,248,0.22); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:7px; cursor:pointer; font-weight:700; margin-top:14px; }</style></head><body><div id="topbar"></div><div class="sh-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Shifts &amp; Handoff</h1><p style="color:#93a4cd; margin:0 0 4px;">Who is currently on shift (last 60min of activity) + outstanding shift handoff notes.</p><div class="sh-banner"><div><h2 id="shTitle">Loading...</h2><div class="sub" id="shSub"></div></div><div style="text-align:right;"><div class="stat" id="shCount">--</div><div style="font-size:11px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase;">on shift now</div></div></div><div class="sh-grid"><div class="sh-card"><h3>On Shift Now</h3><div class="sh-staff-grid" id="shStaff"></div></div><div class="sh-card"><h3>Pending Handoff Notes</h3><div id="shPending"><div style="color:#6b7d9e;">Loading...</div></div></div></div><div class="sh-card" style="margin-top:14px;"><h3>Leave a Handoff Note</h3><div class="sh-form"><label>Period</label><select id="shPeriod"><option value="day">Day -> Night</option><option value="night">Night -> Day</option></select><label>Station (optional)</label><select id="shStation"><option value="">All stations</option><option>ARF1</option><option>ARF2</option><option>ARF3</option><option>MUZ1</option><option>MUZ2</option><option>MUZ3</option><option>MIN1</option><option>MIN2</option><option>MIN3</option><option>OCC</option></select><label>Note <button type="button" data-voice-target="shContent" style="margin-left:8px; background:rgba(168,85,247,0.16); color:#d8b4fe; border:1px solid rgba(168,85,247,0.35); padding:2px 8px; border-radius:5px; font-size:10px; cursor:pointer;">Dictate</button></label><textarea id="shContent" placeholder="e.g. ARF2 short staffed afternoon, watch supply at MIN1 cooling kit ran low"></textarea><button id="shSave">Save Handoff Note</button></div></div></div><script src="assets/auth.js?v=0.2.38"></script><script src="assets/shortcuts.js?v=0.2.38"></script><script src="assets/voice.js?v=0.2.38"></script><script src="assets/topbar.js?v=0.2.38"></script><script src="assets/version.js?v=0.2.38"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Shifts" });
  async function refresh() {
    const r = await HAJJ.authedCall('shifts_today', {});
    if (!r || !r.ok) { document.getElementById('shPending').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    document.getElementById('shTitle').textContent = (r.current_shift === 'day' ? 'Day' : 'Night') + ' shift in progress';
    document.getElementById('shSub').textContent = r.date + ' (KSA)';
    document.getElementById('shCount').textContent = r.on_shift_count;
    if (r.on_shift.length === 0) {
      document.getElementById('shStaff').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No one currently active</div>';
    } else {
      document.getElementById('shStaff').innerHTML = r.on_shift.map(function(s) {
        return '<div class="sh-staff">' + (s.name || s.nid) + '</div>';
      }).join('');
    }
    if (r.pending_handoffs.length === 0) {
      document.getElementById('shPending').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No outstanding handoff notes</div>';
    } else {
      document.getElementById('shPending').innerHTML = r.pending_handoffs.map(function(h) {
        return '<div class="sh-handoff">' +
          '<div class="head"><span class="auth">' + (h.author_name || h.author_nid || '--') + '</span><span>' + (h.station || 'all') + ' · ' + h.shift_period + '</span></div>' +
          '<div class="body">' + (h.content || '') + '</div>' +
          '<div style="font-size:10px; color:#6b7d9e; margin-top:6px;">' + new Date(h.created_at * 1000).toLocaleString() + '</div>' +
        '</div>';
      }).join('');
    }
  }
  document.getElementById('shSave').addEventListener('click', async function() {
    const content = document.getElementById('shContent').value.trim();
    if (!content) return alert('Write a note first');
    const data = {
      shift_period: document.getElementById('shPeriod').value,
      station: document.getElementById('shStation').value,
      content: content
    };
    const r = await HAJJ.authedCall('shifts_handoff_save', data);
    if (r && r.ok) {
      alert('Handoff saved: ' + r.id);
      document.getElementById('shContent').value = '';
      refresh();
    } else alert('Failed: ' + ((r && r.error) || 'unknown'));
  });
  refresh();
  setInterval(refresh, 15000);
})();
</script></body></html>
