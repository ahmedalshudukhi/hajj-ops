<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Page</title><link rel="stylesheet" href="assets/style.css?v=0.2.53"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.me-shell { max-width:1100px; margin:0 auto; padding:20px; }.me-banner { background:linear-gradient(135deg,rgba(56,189,248,0.15),rgba(168,85,247,0.10)); border:1px solid rgba(99,179,237,0.3); border-radius:14px; padding:24px 28px; margin:14px 0 18px; }.me-banner h2 { margin:0; font-size:28px; color:#cdf1ff; }.me-banner .role { display:inline-block; padding:3px 10px; background:rgba(67,232,249,0.18); color:#67e8f9; border-radius:5px; font-size:11px; letter-spacing:0.13em; text-transform:uppercase; margin-top:6px; }.me-banner .sub { color:#93a4cd; font-size:13px; margin-top:8px; }.me-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:14px; }.me-tile { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:16px 18px; }.me-tile .l { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }.me-tile .v { font-size:34px; font-weight:800; line-height:1; margin-top:5px; color:#e8f1ff; font-variant-numeric:tabular-nums; }.me-tile.unread .v { color:#fcd34d; }.me-tile.dispatches .v { color:#67e8f9; }.me-tile.pcrs .v { color:#86efac; }.me-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }@media (max-width:900px) { .me-grid { grid-template-columns:1fr; } }.me-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 22px; }.me-card h3 { margin:0 0 12px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.me-row { padding:10px 14px; background:rgba(15,23,42,0.5); border-radius:7px; margin-bottom:6px; display:flex; justify-content:space-between; gap:10px; align-items:start; font-size:13px; }.me-row .name { color:#cdf1ff; font-weight:600; }.me-row .sub { color:#93a4cd; font-size:11px; }.me-row .badge { font-size:10px; padding:2px 8px; border-radius:4px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }.me-row .badge.red { background:rgba(239,68,68,0.20); color:#fca5a5; }.me-row .badge.yellow { background:rgba(245,158,11,0.18); color:#fcd34d; }.me-row .badge.green { background:rgba(34,197,94,0.18); color:#86efac; }.me-row .badge.draft { background:rgba(245,158,11,0.18); color:#fcd34d; }.me-row .badge.signed { background:rgba(34,197,94,0.18); color:#86efac; }.me-quick { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:12px; }.me-quick a { background:rgba(56,189,248,0.18); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); padding:12px 14px; border-radius:9px; text-decoration:none; text-align:center; font-weight:600; font-size:13px; transition:all 0.12s; }.me-quick a:hover { background:rgba(56,189,248,0.28); transform:translateY(-1px); }.me-quick a.danger { background:rgba(239,68,68,0.18); color:#fca5a5; border-color:rgba(239,68,68,0.4); }.me-quick a.warn { background:rgba(245,158,11,0.18); color:#fcd34d; border-color:rgba(245,158,11,0.4); }.me-quick a.good { background:rgba(34,197,94,0.18); color:#86efac; border-color:rgba(34,197,94,0.4); }</style></head><body><div id="topbar"></div><div class="me-shell"><div class="me-banner"><h2 id="meName">Loading...</h2><div class="role" id="meRole">--</div><div class="sub" id="meSub"></div></div><div class="me-tiles" id="meTiles"></div><div class="me-card" style="margin-bottom:14px;"><h3>Quick Actions</h3><div class="me-quick"><a href="/dispatch" class="warn">New Dispatch</a><a href="/code" class="danger">Code Blue</a><a href="/triage" class="warn">Triage Tag</a><a href="/pcr">My PCRs</a><a href="/messages">Messages</a><a href="/runbook">Runbook</a><a href="/protocols">Protocols</a><a href="/equipment">Equipment</a><a href="/translator">Translator</a><a href="/checklists">Checklists</a><a href="/heat" class="good">Heat Watch</a><a href="/shifts">Shifts</a></div></div><div class="me-grid"><div class="me-card"><h3>My Dispatches Today</h3><div id="meDispatches"><div style="color:#6b7d9e;">Loading...</div></div></div><div class="me-card"><h3>My Recent PCRs</h3><div id="mePcrs"><div style="color:#6b7d9e;">Loading...</div></div></div></div></div><script src="assets/auth.js?v=0.2.53"></script><script src="assets/shortcuts.js?v=0.2.53"></script><script src="assets/topbar.js?v=0.2.53"></script><script src="assets/version.js?v=0.2.53"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "My Page" });
  async function refresh() {
    const r = await HAJJ.authedCall('me_summary', {});
    if (!r || !r.ok) { document.getElementById('meName').textContent = 'Error loading'; return; }
    const u = r.user;
    document.getElementById('meName').textContent = u.name || u.nid;
    document.getElementById('meRole').textContent = u.role || '--';
    const lastSeen = r.last_presence ? new Date(r.last_presence * 1000).toLocaleString() : 'never';
    document.getElementById('meSub').textContent = 'Today: ' + r.today + ' (KSA) · last activity: ' + lastSeen;
    document.getElementById('meTiles').innerHTML =
      '<div class="me-tile dispatches"><div class="l">Dispatches today</div><div class="v">' + r.my_dispatches_count + '</div></div>' +
      '<div class="me-tile pcrs"><div class="l">PCRs (all-time)</div><div class="v">' + r.my_pcrs_count + '</div></div>' +
      '<div class="me-tile unread"><div class="l">Unread messages</div><div class="v">' + r.unread_messages + '</div></div>';
    if (!r.my_dispatches_today.length) {
      document.getElementById('meDispatches').innerHTML = '<div style="color:#6b7d9e; padding:14px;">None yet today</div>';
    } else {
      document.getElementById('meDispatches').innerHTML = r.my_dispatches_today.map(function(d) {
        return '<div class="me-row"><div><div class="name">' + d.incident_id + '</div><div class="sub">' + (d.station || '--') + ' · ' + (d.complaint || '--').slice(0, 40) + '</div></div><div><span class="badge ' + (d.triage || '') + '">' + (d.triage || '--').toUpperCase() + '</span></div></div>';
      }).join('');
    }
    if (!r.my_pcrs.length) {
      document.getElementById('mePcrs').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No PCRs yet — head to <a href="/pcr" style="color:#67e8f9;">PCR</a> to start one</div>';
    } else {
      document.getElementById('mePcrs').innerHTML = r.my_pcrs.map(function(p) {
        const updated = p.updated_at ? new Date(p.updated_at * 1000).toLocaleString() : '--';
        return '<div class="me-row"><div><div class="name">' + p.incident_id + '</div><div class="sub">' + (p.chief_complaint || 'no complaint').slice(0, 40) + '<br>' + updated + '</div></div><div><span class="badge ' + (p.status || 'draft') + '">' + (p.status || 'draft') + '</span></div></div>';
      }).join('');
    }
  }
  refresh();
  setInterval(refresh, 30000);
})();
</script></body></html>
