<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse</title><link rel="stylesheet" href="assets/style.css?v=0.2.45"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.pl-shell { max-width:980px; margin:0 auto; padding:20px; }.pl-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }.pl-head h1 { margin:0; font-size:28px; color:#cdf1ff; }.pl-controls { display:flex; gap:10px; align-items:center; }.pl-controls select { padding:8px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:13px; }.pl-controls .pulse-dot { width:10px; height:10px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,0.7); animation:pulse 2s infinite; }@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }.pl-feed { display:flex; flex-direction:column; gap:6px; }.pl-event { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-left:3px solid #67e8f9; border-radius:10px; padding:11px 16px; }.pl-event.dispatch { border-left-color:#f59e0b; }.pl-event.closed { border-left-color:#6b7280; }.pl-event.event_on_scene { border-left-color:#a855f7; }.pl-event.event_transporting { border-left-color:#22c55e; }.pl-event.event_en_route { border-left-color:#0ea5e9; }.pl-event.broadcast_warn { border-left-color:#f59e0b; background:rgba(245,158,11,0.06); }.pl-event.broadcast_critical { border-left-color:#ef4444; background:rgba(239,68,68,0.08); }.pl-event.code_arrest_start { border-left-color:#ef4444; background:rgba(239,68,68,0.10); }.pl-event.code_rosc { border-left-color:#22c55e; background:rgba(34,197,94,0.10); }.pl-event.code_termination { border-left-color:#374151; background:rgba(55,65,81,0.20); }.pl-event.mci { border-left-color:#ef4444; background:rgba(239,68,68,0.10); }.pl-event.cardiac { background:rgba(239,68,68,0.10); }.pl-event .top { display:flex; justify-content:space-between; font-size:11px; color:#93a4cd; margin-bottom:4px; }.pl-event .kind { font-weight:700; letter-spacing:0.04em; text-transform:uppercase; font-size:10px; }.pl-event.dispatch .kind { color:#fcd34d; }.pl-event.closed .kind { color:#cbd5e1; }.pl-event.event_on_scene .kind { color:#d8b4fe; }.pl-event.event_transporting .kind { color:#86efac; }.pl-event.event_en_route .kind { color:#7dd3fc; }.pl-event.broadcast_warn .kind, .pl-event.broadcast_critical .kind { color:#fcd34d; }.pl-event.code_arrest_start .kind, .pl-event.code_termination .kind, .pl-event.mci .kind { color:#fca5a5; }.pl-event.code_rosc .kind { color:#86efac; }.pl-event .text { color:#e7ecf7; font-size:13px; line-height:1.5; }.pl-event .ago { color:#67e8f9; font-family:ui-monospace,Menlo,monospace; }.pl-event .triage-pill { display:inline-block; padding:1px 6px; border-radius:3px; font-size:9px; font-weight:700; text-transform:uppercase; margin-left:5px; }.pl-event .triage-pill.red { background:rgba(239,68,68,0.22); color:#fca5a5; }.pl-event .triage-pill.yellow { background:rgba(245,158,11,0.20); color:#fcd34d; }.pl-event .triage-pill.green { background:rgba(34,197,94,0.18); color:#86efac; }</style></head><body><div id="topbar"></div><div class="pl-shell"><div class="pl-head"><h1>Live Pulse</h1><div class="pl-controls"><span class="pulse-dot"></span><select id="plRange"><option value="30">Last 30 min</option><option value="60" selected>Last 1 hour</option><option value="180">Last 3 hours</option><option value="360">Last 6 hours</option></select></div></div><p style="color:#93a4cd; margin:0 0 14px;">Real-time operational activity. Auto-refreshes every 10s. Newest first.</p><div id="plFeed" class="pl-feed"><div style="color:#6b7d9e; padding:30px; text-align:center;">Loading...</div></div></div><script src="assets/auth.js?v=0.2.45"></script><script src="assets/shortcuts.js?v=0.2.45"></script><script src="assets/topbar.js?v=0.2.45"></script><script src="assets/version.js?v=0.2.45"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Pulse" });
  function fmtAgo(ts, now) {
    const sec = now - ts;
    if (sec < 60) return sec + 's ago';
    if (sec < 3600) return Math.floor(sec/60) + 'm ago';
    return Math.floor(sec/3600) + 'h ago';
  }
  async function refresh() {
    const minutes = parseInt(document.getElementById('plRange').value);
    const r = await HAJJ.authedCall('pulse_feed', { lookback_minutes: minutes });
    if (!r || !r.ok) { document.getElementById('plFeed').innerHTML = '<div style="color:#fca5a5; padding:14px;">Error</div>'; return; }
    if (!r.events.length) {
      document.getElementById('plFeed').innerHTML = '<div style="color:#6b7d9e; padding:30px; text-align:center;">No activity in this window</div>';
      return;
    }
    const now = r.server_now;
    document.getElementById('plFeed').innerHTML = r.events.map(function(e) {
      const cls = e.kind + (e.cardiac ? ' cardiac' : '');
      const triage = e.triage ? '<span class="triage-pill ' + e.triage + '">' + e.triage + '</span>' : '';
      return '<div class="pl-event ' + cls + '">' +
        '<div class="top"><span class="kind">' + e.kind.replace(/_/g, ' ') + (e.station ? ' · ' + e.station : '') + '</span><span class="ago">' + fmtAgo(e.ts, now) + '</span></div>' +
        '<div class="text">' + e.text + triage + '</div>' +
      '</div>';
    }).join('');
  }
  document.getElementById('plRange').addEventListener('change', refresh);
  refresh();
  setInterval(refresh, 10000);
})();
</script></body></html>
