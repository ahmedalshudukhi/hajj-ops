<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Dispatch · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.1">

<style>
  body { background: var(--bg); }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border-soft);
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .topbar .who { font-size: 13px; color: var(--text-dim); }
  .topbar .who strong { color: var(--text); font-weight: 600; }
  .topbar .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
  .nav-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border-soft);
    color: var(--text-dim); text-decoration: none;
    font-size: 12px; font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .nav-pill:hover { background: var(--surface-3); color: var(--text); }
  .nav-strip { display: flex; gap: 6px; flex-wrap: wrap; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border-soft);
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 8px 10px; text-align: center;
  }
  .stat-num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-top: 2px; }
  .stat--red    .stat-num { color: #fca5a5; }
  .stat--amber  .stat-num { color: #fcd34d; }
  .stat--green  .stat-num { color: #86efac; }
  .stat--blue   .stat-num { color: #93c5fd; }

  .form-card {
    margin: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px;
  }
  .form-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
  .form-card .input, .form-card .select { padding: 10px 12px; font-size: 14px; min-height: 42px; }

  .cards-area { padding: 0 14px 80px; }
  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px;
  }

  .inc-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px;
    border-left-width: 4px; border-left-style: solid;
  }
  .inc-card.cat-red    { border-left-color: var(--danger); }
  .inc-card.cat-yellow { border-left-color: var(--warning); }
  .inc-card.cat-green  { border-left-color: var(--success); }
  .inc-card.cat-black  { border-left-color: var(--text-muted); }
  .inc-card.is-closed  { opacity: 0.55; }

  .inc-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 10px;
  }
  .inc-head .id-line { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .inc-head .where {
    margin-top: 2px; font-size: 16px; font-weight: 700; line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .inc-head .timer {
    font-variant-numeric: tabular-nums;
    font-size: 14px; font-weight: 600; color: var(--text-dim);
  }

  .inc-meta {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
    font-size: 13px; margin-bottom: 12px;
  }
  .inc-meta dt { color: var(--text-muted); }
  .inc-meta dd { margin: 0; color: var(--text); }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .btn-row .btn {
    width: auto; flex: 1; min-width: 0;
    min-height: 36px; padding: 6px 8px;
    font-size: 13px; font-weight: 500;
  }
  .btn-row .btn--small-ghost {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-row .btn--small-ghost.is-done { background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.4); color: #86efac; }

  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin: 12px 0 6px;
  }

  .timeline {
    font-size: 11px; color: var(--text-dim);
    background: var(--surface-2); padding: 8px 10px; border-radius: 6px;
    max-height: 100px; overflow-y: auto;
  }
  .timeline-row { display: flex; justify-content: space-between; gap: 8px; }
  .timeline-row .ev { color: var(--text-dim); }
  .timeline-row .at { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .empty-cards { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 20px; }

  .floater {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--surface-2); padding: 6px 10px; border-radius: 999px;
    font-size: 11px; color: var(--text-muted);
    border: 1px solid var(--border-soft); z-index: 5;
  }
  .floater .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); margin-right: 6px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>

<div id="topbar"></div>

<div class="stats">
  <div class="stat stat--red">
    <div class="stat-num" id="statOpen">0</div>
    <div class="stat-label">Open</div>
  </div>
  <div class="stat stat--amber">
    <div class="stat-num" id="statResus">0</div>
    <div class="stat-label">Red</div>
  </div>
  <div class="stat stat--blue">
    <div class="stat-num" id="statTransfer">0</div>
    <div class="stat-label">In transfer</div>
  </div>
  <div class="stat stat--green">
    <div class="stat-num" id="statClosed">0</div>
    <div class="stat-label">Closed today</div>
  </div>
</div>

<div class="form-card" style="margin-bottom:12px; border:1px solid rgba(168, 85, 247, 0.3); background: rgba(168, 85, 247, 0.05);">
  <div class="card-title" style="color:#c4b5fd; display:flex; justify-content:space-between; align-items:center;">
    <span>⚡ Relocate unit</span>
    <span class="meta" style="font-size:11px; color: #9ca3af;">applies immediately</span>
  </div>
  <div style="display:grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap:8px;">
    <select class="select" id="relocUnit"><option value="">Unit</option></select>
    <select class="select" id="relocStation">
      <option value="">To station</option>
      <option value="ARF1">ARF1</option><option value="ARF2">ARF2</option><option value="ARF3">ARF3</option>
      <option value="MUZ1">MUZ1</option><option value="MUZ2">MUZ2</option><option value="MUZ3">MUZ3</option>
      <option value="MIN1">MIN1</option><option value="MIN2">MIN2</option><option value="MIN3">MIN3</option>
      <option value="DEPOT">DEPOT</option>
    </select>
    <input type="text" class="input" id="relocReason" placeholder="Reason (optional)">
    <button class="btn" id="relocBtn" style="background:#a855f7;">Relocate</button>
  </div>
  <div id="relocMsg" style="margin-top:6px; font-size:12px;"></div>
</div>

<div class="form-card">
  <div class="card-title">New incident</div>
  <div class="form-grid">
    <select class="select" id="region">
      <option value="">Region</option>
      <option>Mina</option>
      <option>Arafat</option>
      <option>Muzdalifah</option>
      <option>OCC</option>
    </select>
    <select class="select" id="zone">
      <option value="">Zone / Station</option>
    </select>
    <select class="select" id="source">
      <option value="">Source</option>
      <option value="Phone">Phone (911 / hotline)</option>
      <option value="Walk-in">Walk-in</option>
      <option value="Radio">Radio</option>
      <option value="Internal">Internal request</option>
      <option value="Field crew">Field crew</option>
      <option value="Station">Station call</option>
      <option value="Ambulance">Ambulance handoff</option>
      <option value="Other">Other</option>
    </select>
    <select class="select" id="subLocation"><option value="">Sub-location (pick station first)</option></select>
    <select class="select" id="caseField">
      <option value="">Chief complaint</option>
      <optgroup label="Cardiac / Resp">
        <option value="Chest pain">Chest pain</option>
        <option value="Shortness of breath">Shortness of breath</option>
        <option value="Cardiac arrest">Cardiac arrest</option>
        <option value="Palpitations">Palpitations</option>
        <option value="Syncope">Syncope / fainting</option>
      </optgroup>
      <optgroup label="Trauma">
        <option value="Fall">Fall</option>
        <option value="Trauma — minor">Trauma — minor</option>
        <option value="Trauma — major">Trauma — major</option>
        <option value="Crush / stampede">Crush / stampede</option>
        <option value="Laceration">Laceration / bleeding</option>
        <option value="Fracture">Fracture suspected</option>
        <option value="Head injury">Head injury</option>
      </optgroup>
      <optgroup label="Heat / Environmental">
        <option value="Heat exhaustion">Heat exhaustion</option>
        <option value="Heat stroke">Heat stroke</option>
        <option value="Dehydration">Dehydration</option>
        <option value="Sunburn">Sunburn</option>
      </optgroup>
      <optgroup label="GI / Abdominal">
        <option value="Abdominal pain">Abdominal pain</option>
        <option value="Vomiting">Vomiting</option>
        <option value="Diarrhea">Diarrhea</option>
        <option value="GI bleed">GI bleed</option>
      </optgroup>
      <optgroup label="Neuro">
        <option value="Stroke (CVA)">Stroke / CVA suspected</option>
        <option value="Seizure">Seizure</option>
        <option value="Altered mental status">Altered mental status</option>
        <option value="Headache">Headache severe</option>
      </optgroup>
      <optgroup label="Other">
        <option value="Allergic reaction">Allergic reaction</option>
        <option value="Diabetic emergency">Diabetic emergency</option>
        <option value="Psychiatric">Psychiatric</option>
        <option value="OB/Gyn">OB / Gyn emergency</option>
        <option value="Lost / separated">Lost / separated person</option>
        <option value="Welfare check">Welfare check</option>
        <option value="Refusal of care">Refusal of care</option>
        <option value="Other medical">Other medical</option>
      </optgroup>
    </select>
    <select class="select full" id="unit">
      <option value="">Loading units…</option>
    </select>
    <select class="select full" id="category">
      <option value="red">🔴 Red — Resuscitation</option>
      <option value="yellow" selected>🟡 Yellow — Urgent</option>
      <option value="green">🟢 Green — Less Urgent</option>
      <option value="black">⚫ Black — DOA</option>
    </select>
    <label class="cardiac-arrest-label" id="cardiacArrestLabel" style="display:none; align-items:center; gap:6px; margin-top:-4px; padding:6px 10px; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.3); border-radius:6px; cursor:pointer;">
      <input type="checkbox" id="cardiacArrest" style="margin:0; width:16px; height:16px; accent-color:#ef4444;">
      <span style="color:#fca5a5; font-size:13px; font-weight:500;">⚡ Cardiac arrest in progress</span>
    </label>
    <button class="btn full" id="createBtn">Dispatch</button>
  </div>
  <div id="createMsg" style="margin-top:8px;"></div>
</div>

<div class="cards-area">
  <div class="section-label" id="dateLabel" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
    <span>Active &amp; recent</span>
    <div class="date-toggle" style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500;">
      <button type="button" id="datePrev" title="Previous day" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#e5e7eb; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1;">‹</button>
      <input type="date" id="dateInput" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#e5e7eb; padding:4px 8px; border-radius:6px; font-size:13px; color-scheme:dark;">
      <button type="button" id="dateNext" title="Next day" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#e5e7eb; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1;">›</button>
      <button type="button" id="dateToday" title="Today" style="background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.4); color:#93c5fd; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">TODAY</button>
    </div>
  </div>
  <div class="cards-grid" id="cards"></div>
  <div class="empty-cards" id="emptyState" hidden>No incidents on this day.</div>
</div>

<div class="floater"><span class="dot"></span><span id="syncStatus">Live · syncing every 5s</span></div>

<script src="assets/config.js?v=0.2.1"></script>
<script src="assets/tempo.js?v=0.2.1"></script>
<script src="assets/auth.js?v=0.2.1"></script>
<script src="assets/sublocations.js?v=0.2.1"></script>
<script src="assets/topbar.js?v=0.2.1"></script>
<script>
(function () {

  if (!HAJJ.requireRole(['dispatcher', 'leadership', 'admin'])) return;
  CADTopbar.render({ title: "Dispatch", subtitle: "incident control" });


  // Load units list (cached for instant first paint)
  let UNITS_BY_CODE = {};
  (async function loadUnits() {
    const sel = document.getElementById('unit');
    const relocSel = document.getElementById('relocUnit');
    sel.innerHTML = '<option value="">Loading units…</option>';

    // Try cached
    try {
      const cached = localStorage.getItem('hajj_units_avail_cache');
      if (cached) {
        const r = JSON.parse(cached);
        if (r && r.units) renderAvail(r);
      }
    } catch (_) {}

    const dash = await HAJJ.authedCallSWR('dashboard_dispatch'); const r = (dash && dash.units) || { ok:false };
    if (!r || !r.ok) {
      // Fallback to plain units_list
      const r2 = await HAJJ.authedCall('units_list');
      if (r2 && r2.ok && Array.isArray(r2.units)) {
        renderAvail({ units: r2.units.map(function(u) { return Object.assign({state:'unknown', open_incidents:0}, u); }), summary:{} });
      } else {
        sel.innerHTML = '<option value="">(units unavailable — redeploy backend?)</option>';
      }
      return;
    }
    if (!r.units || !r.units.length) {
      sel.innerHTML = '<option value="">(no units in Mob Sheet → Units tab)</option>';
      return;
    }
    try { localStorage.setItem('hajj_units_avail_cache', JSON.stringify(r)); } catch (_) {}
    renderAvail(r);

    function stateBadge(state, open) {
      if (state === 'available') return '🟢';
      if (state === 'busy')      return '🟡(' + open + ')';
      if (state === 'off_duty')  return '⚫';
      if (state === 'oos')       return '🔴';
      if (state === 'maintenance') return '🛠';
      return '·';
    }

    function renderAvail(r) {
      const units = r.units.slice();
      // Sort: available first, then busy, then off_duty, then oos
      const order = { available:0, busy:1, off_duty:2, maintenance:3, oos:4, unknown:5 };
      units.sort(function(a, b) {
        const oa = order[a.state] !== undefined ? order[a.state] : 9;
        const ob = order[b.state] !== undefined ? order[b.state] : 9;
        if (oa !== ob) return oa - ob;
        return String(a.code).localeCompare(String(b.code));
      });

      UNITS_BY_CODE = {};
      units.forEach(function(u) { UNITS_BY_CODE[u.code] = u; });

      // Build incident-create dropdown — group by state
      const groups = { available: [], busy: [], off_duty: [], maintenance: [], oos: [], unknown: [] };
      units.forEach(function(u) { (groups[u.state] || groups.unknown).push(u); });
      const sum = r.summary || {};

      let opts = '<option value="">Select unit · ' + (sum.available || 0) + ' available, ' + (sum.busy || 0) + ' busy</option>';

      // AVAILABLE first
      ['available','busy','off_duty','maintenance','oos'].forEach(function(state) {
        const grp = groups[state];
        if (!grp.length) return;
        const label = ({ available:'🟢 Available', busy:'🟡 Busy (on call)', off_duty:'⚫ Off duty', maintenance:'🛠 Maintenance', oos:'🔴 Out of service' })[state];
        opts += '<optgroup label="' + label + ' · ' + grp.length + '">';
        grp.forEach(function(u) {
          const station = u.current_station || u.home_station || '';
          const badge = stateBadge(u.state, u.open_incidents);
          opts += '<option value="' + u.code + '"' + (state !== 'available' && state !== 'busy' ? ' style="color:#6b7280;"' : '') + '>'
                + badge + ' ' + u.code + (station ? ' · ' + station : '')
                + (u.open_incidents > 0 ? ' (busy on ' + u.open_incidents + ')' : '')
                + '</option>';
        });
        opts += '</optgroup>';
      });
      sel.innerHTML = opts;

      // Also populate relocUnit dropdown (all units, no state filter)
      if (relocSel) {
        let relOpts = '<option value="">Unit (' + units.length + ')</option>';
        units.forEach(function(u) {
          const station = u.current_station || u.home_station || '';
          relOpts += '<option value="' + u.code + '">' + stateBadge(u.state, u.open_incidents) + ' ' + u.code + (station ? ' · ' + station : '') + '</option>';
        });
        relocSel.innerHTML = relOpts;
      }
    }
  })();

  function unitTypeFor(code) {
    if (!code) return '';
    const u = UNITS_BY_CODE[code];
    if (u && u.type) return u.type;
    const prefix = code.split('-')[0];
    return prefix;
  }
  function currentShift() {
    const h = new Date().getHours();
    return (h >= 6 && h < 18) ? 'Day' : 'Night';
  }


  const user = HAJJ.getUser() || {};
  document.getElementById('dispName').textContent = user.name || '—';
  const rb = document.getElementById('dispRole');
  rb.textContent = String(user.role || '').replace(/_/g, ' ');
  rb.className = 'badge ' + (user.role === 'admin' || user.role === 'leadership' ? 'badge--blue' : 'badge--amber');
  document.getElementById('logoutBtn').addEventListener('click', HAJJ.logout);

  // Nav visibility — leadership/admin can see lobby + active; dispatcher just gets My schedule
  if (user.role === 'leadership' || user.role === 'admin') {
    document.getElementById('navLobby').hidden = false;
    document.getElementById('navActive').hidden = false;
  }

  // ============ Clock ============
  function tickClock() {
    const d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0') + ':' +
      String(d.getSeconds()).padStart(2,'0');
  }
  tickClock(); setInterval(tickClock, 1000);

  // ============ Region → zone ============
  // Values are station CODES (matching D1 STATIONS list); labels are human-readable.
  const ZONES = {
    Mina:       [['MIN1','Mina 1 (MIN1)'], ['MIN2','Mina 2 (MIN2)'], ['MIN3','Mina 3 (MIN3)']],
    Arafat:     [['ARF1','Arafat 1 (ARF1)'], ['ARF2','Arafat 2 (ARF2)'], ['ARF3','Arafat 3 (ARF3)']],
    Muzdalifah: [['MUZ1','Muzdalifah 1 (MUZ1)'], ['MUZ2','Muzdalifah 2 (MUZ2)'], ['MUZ3','Muzdalifah 3 (MUZ3)']],
    OCC:        [['ARF1','OCC / Depot (ARF1 fallback)']]   // OCC routes to ARF1 since OCC isn't a dispatch station
  };
  const regionEl = document.getElementById('region');
  const zoneEl   = document.getElementById('zone');
  regionEl.addEventListener('change', function () {
    const list = ZONES[regionEl.value] || [];
    zoneEl.innerHTML = '<option value="">Zone / Station</option>' +
      list.map(z => '<option value="' + z[0] + '">' + z[1] + '</option>').join('');
  });

  // ============ Create incident ============
  const createBtn = document.getElementById('createBtn');
  const createMsg = document.getElementById('createMsg');

  createBtn.addEventListener('click', async function () {
    createMsg.innerHTML = '';
    const region = regionEl.value, zone = zoneEl.value;
    const source = val('source'), location = val('location'), caseField = val('caseField');
    const unit = val('unit'), type = unitTypeFor(unit), shift = currentShift();
    const subLocation = val('subLocation');
    const category = val('category');

    if (!region || !zone) { showCreateErr('Pick region and zone.'); return; }
    if (!source)          { showCreateErr('Pick a source.'); return; }
    if (!caseField)       { showCreateErr('Pick a chief complaint.'); return; }

    createBtn.disabled = true;
    createBtn.innerHTML = '<span class="spinner"></span>&nbsp;&nbsp;Dispatching…';

    const r = await HAJJ.authedCall('dispatch_create', {
      sub_location: subLocation,
      region: region, zone: zone, station: zone,
      source: source, location: location, case_field: caseField,
      unit: unit, type: type, shift: shift, category: category,
      cardiac_arrest: document.getElementById('cardiacArrest').checked
    });

    createBtn.disabled = false;
    createBtn.innerHTML = 'Dispatch';

    if (!r || !r.ok) { showCreateErr('Failed to dispatch. ' + (r && r.error || '')); return; }
    ['source','location','caseField','unit'].forEach(id => document.getElementById(id).value = '');
    regionEl.value = ''; zoneEl.innerHTML = '<option value="">Zone / Station</option>';
    refresh();
  });


  // Show cardiac arrest checkbox only when category = red
  const categoryEl = document.getElementById('category');
  const cardiacLabel = document.getElementById('cardiacArrestLabel');
  if (categoryEl && cardiacLabel) {
    function syncCardiacVisibility() {
      cardiacLabel.style.display = (categoryEl.value === 'red') ? 'inline-flex' : 'none';
      if (categoryEl.value !== 'red') document.getElementById('cardiacArrest').checked = false;
    }
    categoryEl.addEventListener('change', syncCardiacVisibility);
    syncCardiacVisibility();
  }

  function val(id) { return document.getElementById(id).value.trim(); }
  function showCreateErr(text) {
    createMsg.innerHTML = '<div class="notice notice--error">' + text + '</div>';
  }

  // ============ Live sync ============
  const incidentsById = {};
  // Selected date — Riyadh local day; defaults to today, can toggle
  function todayLocalISO() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }
  let _selectedDate = todayLocalISO();
  function isToday() { return _selectedDate === todayLocalISO(); }

  // Wire date toggle UI
  function initDateToggle() {
    const inp = document.getElementById('dateInput');
    const prev = document.getElementById('datePrev');
    const next = document.getElementById('dateNext');
    const today = document.getElementById('dateToday');
    if (!inp) return;
    inp.value = _selectedDate;
    inp.max = todayLocalISO();
    inp.addEventListener('change', () => {
      _selectedDate = inp.value || todayLocalISO();
      // Clear current incidents when switching days
      Object.keys(incidentsById).forEach(k => delete incidentsById[k]);
      refresh();
      updateDateUI();
    });
    function shiftDay(delta) {
      const d = new Date(_selectedDate + 'T12:00:00');
      d.setDate(d.getDate() + delta);
      const yyyy = d.getFullYear(), mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
      _selectedDate = `${yyyy}-${mm}-${dd}`;
      inp.value = _selectedDate;
      Object.keys(incidentsById).forEach(k => delete incidentsById[k]);
      refresh();
      updateDateUI();
    }
    prev.addEventListener('click', () => shiftDay(-1));
    next.addEventListener('click', () => shiftDay(1));
    today.addEventListener('click', () => {
      _selectedDate = todayLocalISO();
      inp.value = _selectedDate;
      Object.keys(incidentsById).forEach(k => delete incidentsById[k]);
      refresh();
      updateDateUI();
    });
    updateDateUI();
  }
  function updateDateUI() {
    const today = document.getElementById('dateToday');
    const next = document.getElementById('dateNext');
    if (today) today.style.opacity = isToday() ? '0.5' : '1';
    if (next) next.disabled = isToday();
    if (next) next.style.opacity = isToday() ? '0.4' : '1';
    // Update create form visibility — can't create incidents in the past
    const createPanel = document.querySelector('.create-panel') || document.getElementById('createBtn')?.closest('.dispatch-card, .panel, div');
    // Don't hide; instead disable/warn
    const btn = document.getElementById('createBtn');
    if (btn) {
      if (!isToday()) {
        btn.disabled = true;
        btn.title = 'Viewing historical day — switch to TODAY to dispatch';
        btn.style.opacity = '0.4';
      } else {
        btn.disabled = false;
        btn.title = '';
        btn.style.opacity = '';
      }
    }
    const sync = document.getElementById('syncStatus');
    if (sync) {
      sync.textContent = isToday()
        ? 'Live · syncing every 5s'
        : `Viewing ${_selectedDate} (read-only)`;
    }
  }

  async function refresh() {
    const params = { date: _selectedDate, with_days: '1' };
    const r = await HAJJ.authedCall('dispatch_list', params);
    if (!r || !r.ok) return;
    const list = r.incidents || [];
    list.sort((a, b) => new Date(b.Created_At) - new Date(a.Created_At));
    // For historical days: just display server data (no merge, no preserve)
    if (!isToday()) {
      Object.keys(incidentsById).forEach(k => delete incidentsById[k]);
      list.forEach(serverInc => { incidentsById[serverInc.Incident_ID] = serverInc; });
      renderCards();
      renderStats();
      return;
    }
    // For today: MERGE — preserve optimistic local state when server hasn't yet caught up.
    const PRESERVE = ['En_Route_At','On_Scene_At','Patient_Contact_At','Transfer_Start',
                      'Hospital_Arrival','Handover','Closed_At','Decision','Q_PCR_ID','Long_PCR_URL'];
    list.forEach(serverInc => {
      const local = incidentsById[serverInc.Incident_ID];
      if (local) {
        PRESERVE.forEach(f => {
          if (local[f] && !serverInc[f]) serverInc[f] = local[f];
        });
        // Status: if locally closed but server still open, keep closed
        if (local.Status === 'closed' && serverInc.Status !== 'closed') {
          serverInc.Status = 'closed';
        }
      }
      incidentsById[serverInc.Incident_ID] = serverInc;
    });
    // Cache for next page load
    try { localStorage.setItem('hajj_dispatch_cache', JSON.stringify(incidentsById)); } catch (_) {}
    renderCards();
    renderStats();
  }
  // Dynamic tempo — refresh interval changes with Hajj phase
  let _tempoTimer = null;
  function scheduleNextRefresh() {
    if (_tempoTimer) clearTimeout(_tempoTimer);
    const ms = (window.HAJJ_TEMPO && window.HAJJ_TEMPO.intervalMs()) || 5000;
    _tempoTimer = setTimeout(async function tick() {
      await refresh();
      scheduleNextRefresh();
    }, ms);
  }
  // Render cached incidents instantly while first refresh is in flight
  try {
    const cachedRaw = localStorage.getItem('hajj_dispatch_cache');
    if (cachedRaw) {
      const cached = JSON.parse(cachedRaw);
      if (cached && typeof cached === 'object') {
        Object.assign(incidentsById, cached);
        renderCards();
        renderStats();
      }
    }
  } catch (_) {}

  initDateToggle();
  refresh();
  scheduleNextRefresh();

  // ============ Render ============
  function renderCards() {
    const grid = document.getElementById('cards');
    grid.innerHTML = '';
    const items = Object.values(incidentsById)
      .sort((a, b) => new Date(b.Created_At) - new Date(a.Created_At));
    if (!items.length) { document.getElementById('emptyState').hidden = false; return; }
    document.getElementById('emptyState').hidden = true;
    items.forEach(inc => grid.appendChild(buildCard(inc)));
  }

  function renderStats() {
    const items = Object.values(incidentsById);
    const today = new Date(); today.setHours(0,0,0,0);
    let open = 0, closedToday = 0, red = 0, inTransfer = 0;
    items.forEach(i => {
      if (i.Status === 'open') open++;
      if (i.Status === 'closed' && i.Closed_At && new Date(i.Closed_At) >= today) closedToday++;
      if ((i.Category || '').toLowerCase() === 'red' && i.Status === 'open') red++;
      if (i.Status === 'open' && i.Transfer_Start && !i.Closed_At) inTransfer++;
    });
    document.getElementById('statOpen').textContent = open;
    document.getElementById('statResus').textContent = red;
    document.getElementById('statTransfer').textContent = inTransfer;
    document.getElementById('statClosed').textContent = closedToday;
  }

  function buildCard(inc) {
    const card = document.createElement('div');
    const cat = (inc.Category || 'yellow').toLowerCase();
    card.className = 'inc-card cat-' + cat + (inc.Status === 'closed' ? ' is-closed' : '');
    card.dataset.id = inc.Incident_ID;

    const idShort = (inc.Incident_ID || '').replace(/^INC-/, '').slice(0, 18);
    const where = (inc.Region || '—') + ' · ' + (inc.Station || '—');
    const startMs = new Date(inc.Created_At).getTime();

    const statusBtn = (label, key, doneAt) => {
      const done = !!doneAt;
      return '<button class="btn btn--small-ghost ' + (done ? 'is-done' : '') + '" '
        + 'data-event="' + key + '">' + label + (done ? ' ✓' : '') + '</button>';
    };

    const isClosed = inc.Status === 'closed';
    const inTransfer = !!inc.Transfer_Start && !isClosed;

    let decisionHtml;
    if (isClosed) {
      decisionHtml = '<div class="section-label">Closed: ' + (inc.Decision || '—') + '</div>';
    } else if (inTransfer) {
      decisionHtml = '<div class="section-label">Transfer in progress</div>'
        + '<div class="btn-row">'
        +   statusBtn('Hospital arrival', 'hospital_arrival', inc.Hospital_Arrival)
        +   statusBtn('Handover',          'handover',         inc.Handover)
        + '</div>'
        + '<div class="btn-row">'
        +   '<button class="btn btn--small" data-decide="Transfer">Complete transfer</button>'
        + '</div>';
    } else {
      decisionHtml = '<div class="section-label">Disposition</div>'
        + '<div class="btn-row">'
        +   '<button class="btn btn--small" data-decide="Treat">Treat</button>'
        +   '<button class="btn btn--blue btn--small" data-transfer="1">Transfer</button>'
        +   '<button class="btn btn--red btn--small" data-decide="Refusal">Refusal</button>'
        + '</div>';
    }

    const tlRows = [];
    if (inc.Created_At)         tlRows.push(['Dispatched', inc.Created_At]);
    if (inc.En_Route_At)        tlRows.push(['En route', inc.En_Route_At]);
    if (inc.On_Scene_At)        tlRows.push(['On scene', inc.On_Scene_At]);
    if (inc.Patient_Contact_At) tlRows.push(['Patient contact', inc.Patient_Contact_At]);
    if (inc.Transfer_Start)     tlRows.push(['Transfer start', inc.Transfer_Start]);
    if (inc.Hospital_Arrival)   tlRows.push(['Hospital arrival', inc.Hospital_Arrival]);
    if (inc.Handover)           tlRows.push(['Handover', inc.Handover]);
    if (inc.Closed_At)          tlRows.push(['Closed', inc.Closed_At]);

    card.innerHTML =
      '<div class="inc-head">'
      +   '<div>'
      +     '<div class="id-line">' + idShort + '</div>'
      +     '<div class="where">' + where + '</div>'
      +     '<div style="font-size:12px; color:var(--text-muted);">'
      +       (inc.Unit || '—') + (inc.Type ? ' · ' + inc.Type : '')
      +     '</div>'
      +   '</div>'
      +   '<div class="timer" data-start="' + startMs + '">⏱ 0:00</div>'
      + '</div>'
      + '<dl class="inc-meta">'
      +   '<dt>Category</dt><dd>' + (inc.Category || '—') + '</dd>'
      +   '<dt>Case</dt><dd>' + (inc.Case || '—') + '</dd>'
      +   '<dt>Location</dt><dd>' + (inc.Location || inc.Zone || '—') + '</dd>'
      +   (inc.Source ? '<dt>Source</dt><dd>' + inc.Source + '</dd>' : '')
      + '</dl>'
      + (isClosed ? '' :
          '<div class="section-label">Status</div>'
        + '<div class="btn-row">'
        +   statusBtn('En route', 'en_route', inc.En_Route_At)
        +   statusBtn('On scene', 'on_scene', inc.On_Scene_At)
        +   statusBtn('Pt contact', 'patient_contact', inc.Patient_Contact_At)
        + '</div>')
      + decisionHtml
      + (tlRows.length ?
          '<div class="section-label">Timeline</div>'
        + '<div class="timeline">'
        + tlRows.map(r => '<div class="timeline-row"><span class="ev">' + r[0] + '</span><span class="at">' + formatTimeShort(r[1]) + '</span></div>').join('')
        + '</div>' : '')
      // File PCR button — opens DCH form with incident context
      + (window.PCR_URL ? buildPcrButton(inc) : '');

    card.querySelectorAll('[data-event]').forEach(btn => {
      btn.addEventListener('click', () => recordEvent(inc.Incident_ID, btn.dataset.event));
    });
    card.querySelectorAll('[data-decide]').forEach(btn => {
      btn.addEventListener('click', () => closeIncident(inc.Incident_ID, btn.dataset.decide));
    });
    card.querySelectorAll('[data-transfer]').forEach(btn => {
      btn.addEventListener('click', () => recordEvent(inc.Incident_ID, 'transfer_start'));
    });

    return card;
  }

  function buildPcrButton(inc) {
    const params = new URLSearchParams();
    if (inc.Incident_ID) params.set('incident_id', inc.Incident_ID);
    if (inc.Station)     params.set('prefill_station', inc.Station);
    if (inc.Unit)        params.set('prefill_unit', inc.Unit);
    const url = window.PCR_URL + '?' + params.toString();
    const label = inc.Q_PCR_ID
      ? '📄 PCR filed (' + inc.Q_PCR_ID + ')'
      : (inc.Long_PCR_URL ? '📄 View PCR' : '📋 File PCR');
    return '<div class="section-label">PCR</div>'
      + '<div class="btn-row">'
      + '<a href="' + url + '" target="_blank" rel="noopener" class="btn btn--small btn--blue" style="text-decoration:none; display:inline-flex; align-items:center;">' + label + '</a>'
      + '</div>';
  }

  function formatTimeShort(t) {
    if (!t) return '—';
    const d = new Date(t);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  setInterval(() => {
    document.querySelectorAll('.timer[data-start]').forEach(el => {
      const start = parseInt(el.dataset.start, 10);
      if (!start) return;
      const ms = Date.now() - start;
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      el.textContent = '⏱ ' + m + ':' + String(s).padStart(2,'0');
    });
  }, 1000);

  async function recordEvent(incidentId, eventType) {
    // OPTIMISTIC UPDATE — patch local state immediately
    const inc = incidentsById[incidentId];
    if (inc) {
      const colMap = {
        'en_route':'En_Route_At', 'on_scene':'On_Scene_At',
        'patient_contact':'Patient_Contact_At', 'transfer_start':'Transfer_Start',
        'hospital_arrival':'Hospital_Arrival', 'handover':'Handover'
      };
      const col = colMap[eventType];
      if (col && !inc[col]) {
        inc[col] = new Date().toISOString();
        renderCards();
        renderStats();
      }
    }
    // Background sync
    const r = await HAJJ.authedCall('dispatch_event', {
      incident_id: incidentId, event_type: eventType
    });
    if (!r || !r.ok) {
      // Revert on failure
      if (inc) {
        const col = ({'en_route':'En_Route_At','on_scene':'On_Scene_At','patient_contact':'Patient_Contact_At',
                      'transfer_start':'Transfer_Start','hospital_arrival':'Hospital_Arrival','handover':'Handover'})[eventType];
        if (col) delete inc[col];
        renderCards();
        renderStats();
      }
      alert('Sync failed for ' + eventType + '. Please retry.');
    }
  }

  async function closeIncident(incidentId, decision) {
    // OPTIMISTIC UPDATE
    const inc = incidentsById[incidentId];
    const prevState = inc ? { Status: inc.Status, Closed_At: inc.Closed_At, Decision: inc.Decision } : null;
    if (inc) {
      inc.Status = 'closed';
      inc.Closed_At = new Date().toISOString();
      inc.Decision = decision;
      renderCards();
      renderStats();
    }
    const r = await HAJJ.authedCall('dispatch_close', {
      incident_id: incidentId, decision: decision
    });
    if (!r || !r.ok) {
      if (inc && prevState) {
        Object.assign(inc, prevState);
        renderCards();
        renderStats();
      }
      alert('Close failed. Please retry.');
    }
  }


  // Sub-location dropdown wired to station selection
  (function() {
    const zoneSel = document.getElementById('zone');
    const subSel  = document.getElementById('subLocation');
    if (!zoneSel || !subSel) return;
    function refresh() {
      const station = zoneSel.value;
      if (!station) {
        subSel.innerHTML = '<option value="">Sub-location (pick station first)</option>';
        return;
      }
      window.CADSubLocations && CADSubLocations.populateSelect(subSel, station, true);
    }
    zoneSel.addEventListener('change', refresh);
    // Run once for initial state
    setTimeout(refresh, 100);
  })();



  // Relocate Unit (dispatcher discretion — applies immediately)
  (function() {
    function populateUnits() {
      const sel = document.getElementById('relocUnit');
      if (!sel || !UNITS_BY_CODE) return;
      const codes = Object.keys(UNITS_BY_CODE).sort();
      if (!codes.length) return;
      const opts = ['<option value="">Unit</option>'];
      codes.forEach(c => {
        const u = UNITS_BY_CODE[c];
        opts.push('<option value="' + c + '">' + c + (u.home_station ? ' · ' + u.home_station : '') + '</option>');
      });
      sel.innerHTML = opts.join('');
    }
    setTimeout(populateUnits, 800);
    setTimeout(populateUnits, 2000);

    const btn = document.getElementById('relocBtn');
    if (btn) btn.addEventListener('click', async function() {
      const unit = document.getElementById('relocUnit').value;
      const toStation = document.getElementById('relocStation').value;
      const reason = document.getElementById('relocReason').value;
      const msg = document.getElementById('relocMsg');
      if (!unit || !toStation) { msg.innerHTML = '<span style="color:#fca5a5;">Pick a unit and target station.</span>'; return; }
      msg.innerHTML = '<span style="color:#9ca3af;">Relocating…</span>';
      const homeFrom = (UNITS_BY_CODE[unit] && UNITS_BY_CODE[unit].home_station) || '';
      const r = await HAJJ.authedCall('reposition_request', {
        unit_code: unit, from_station: homeFrom, to_station: toStation, reason: reason
      });
      if (!r || !r.ok) { msg.innerHTML = '<span style="color:#fca5a5;">Failed: ' + ((r && r.error) || 'unknown') + '</span>'; return; }
      msg.innerHTML = r.applied
        ? '<span style="color:#86efac;">✓ ' + unit + ' → ' + toStation + ' (applied at ' + new Date(r.at).toLocaleTimeString() + ')</span>'
        : '<span style="color:#fcd34d;">Pending review (request: ' + (r.request_id || '?') + ')</span>';
      document.getElementById('relocUnit').value = '';
      document.getElementById('relocStation').value = '';
      document.getElementById('relocReason').value = '';
    });
  })();


})();
</script>
