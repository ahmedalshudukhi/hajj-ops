<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Units · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.38">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; }
.un-shell { max-width:1280px; margin:0 auto; padding:20px; }
.un-tally { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:14px 0 18px; }
.un-tally .tile { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.15); border-radius:10px; padding:12px 16px; cursor:pointer; transition:transform 0.15s; }
.un-tally .tile:hover { transform:translateY(-2px); }
.un-tally .tile.active { border-color:rgba(56,189,248,0.5); background:rgba(56,189,248,0.13); }
.un-tally .tile .l { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }
.un-tally .tile .v { font-size:26px; font-weight:800; color:#e8f1ff; line-height:1; margin-top:4px; }
.un-tally .tile.avail .v { color:#6ee7b7; }
.un-tally .tile.busy .v { color:#fcd34d; }
.un-tally .tile.oos .v { color:#fca5a5; }
.un-tally .tile.stale .v { color:#fca5a5; }
.un-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:14px; }
.un-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:10px; padding:12px 14px; }
.un-card.available { border-left:3px solid #22c55e; }
.un-card.busy, .un-card.dispatched { border-left:3px solid #f59e0b; }
.un-card.oos, .un-card.maintenance { border-left:3px solid #ef4444; }
.un-card.break { border-left:3px solid #94a3b8; }
.un-card .code { font-size:14px; font-weight:700; color:#cdf1ff; }
.un-card .type { font-size:11px; color:#93a4cd; }
.un-card .row { display:flex; justify-content:space-between; margin-top:4px; font-size:11px; color:#cbd5e1; }
.un-card .stale { color:#fca5a5; font-weight:600; }
.un-card .actions { display:flex; gap:5px; margin-top:8px; }
.un-card .actions button { flex:1; font-size:10px; padding:5px 8px; border-radius:5px; background:rgba(99,179,237,0.13); color:#cdf1ff; border:1px solid rgba(99,179,237,0.25); cursor:pointer; }
.un-card .actions button:hover { background:rgba(99,179,237,0.22); }
.un-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center; padding:20px; }
.un-modal.visible { display:flex; }
.un-modal .box { background:linear-gradient(135deg,#0f1830,#06101e); border:1px solid rgba(99,179,237,0.25); border-radius:14px; padding:22px 26px; max-width:480px; width:100%; }
.un-modal h2 { margin:0 0 4px; }
.un-modal label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:14px 0 5px; }
.un-modal select, .un-modal input { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }
.un-modal .btnrow { display:flex; gap:10px; margin-top:16px; }
.un-modal .btnrow button { flex:1; padding:10px; border-radius:7px; cursor:pointer; font-weight:600; }
.un-modal .save { background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); }
.un-modal .cancel { background:transparent; color:#94a3b8; border:1px solid rgba(99,179,237,0.2); }
</style>
</head><body>
<div id="topbar"></div>
<div class="un-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Unit Roster</h1>
  <p style="color:#93a4cd; margin:0 0 4px;">Live status for all 25+ units. Click a unit to update status.</p>

  <div class="un-tally" id="unTally"></div>
  <div id="unGrid" class="un-grid"></div>
</div>

<div class="un-modal" id="unModal">
  <div class="box">
    <h2 id="umTitle">Update unit</h2>
    <label>Status</label>
    <select id="umStatus">
      <option value="available">Available</option>
      <option value="busy">Busy</option>
      <option value="dispatched">Dispatched</option>
      <option value="oos">Out of Service</option>
      <option value="maintenance">Maintenance</option>
      <option value="break">Break / Rest</option>
    </select>
    <label>Current Station</label>
    <select id="umStation">
      <option value="">— same as home —</option>
      <option>ARF1</option><option>ARF2</option><option>ARF3</option>
      <option>MUZ1</option><option>MUZ2</option><option>MUZ3</option>
      <option>MIN1</option><option>MIN2</option><option>MIN3</option>
    </select>
    <label>Note (optional)</label>
    <input type="text" id="umNote" placeholder="e.g. low O2, mechanical issue, return to home" />
    <div class="btnrow">
      <button class="cancel" onclick="document.getElementById('unModal').classList.remove('visible')">Cancel</button>
      <button class="save" id="umSave">Save check-in</button>
    </div>
  </div>
</div>

<script src="assets/auth.js?v=0.2.38"></script>
<script src="assets/shortcuts.js?v=0.2.38"></script>
<script src="assets/topbar.js?v=0.2.38"></script>
<script src="assets/version.js?v=0.2.38"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Units" });

  let activeFilter = null;
  let lastUnits = [];

  async function refresh() {
    const r = await HAJJ.authedCall('units_status_grid', {});
    if (!r || !r.ok) { document.getElementById('unGrid').innerHTML = '<div style="color:#6b7d9e; padding:30px;">Error</div>'; return; }
    lastUnits = r.units || [];
    const tally = r.tally || {};
    document.getElementById('unTally').innerHTML = `
      <div class="tile" data-status=""><div class="l">Total</div><div class="v">${tally.total||0}</div></div>
      <div class="tile avail" data-status="available"><div class="l">Available</div><div class="v">${tally.available||0}</div></div>
      <div class="tile busy" data-status="busy"><div class="l">Busy/Disp</div><div class="v">${(tally.busy||0)+(tally.dispatched||0)}</div></div>
      <div class="tile oos" data-status="oos"><div class="l">OOS/Maint</div><div class="v">${(tally.oos||0)+(tally.maintenance||0)}</div></div>
      <div class="tile" data-status="break"><div class="l">Break</div><div class="v">${tally.break||0}</div></div>
      <div class="tile stale" data-status="stale"><div class="l">Stale (&gt;30m)</div><div class="v">${tally.stale||0}</div></div>
    `;
    document.querySelectorAll('.un-tally .tile').forEach(t => {
      t.classList.toggle('active', t.dataset.status === (activeFilter||''));
      t.addEventListener('click', () => { activeFilter = (t.dataset.status === activeFilter) ? null : t.dataset.status; renderGrid(); refresh(); });
    });
    renderGrid();
  }

  function renderGrid() {
    let units = lastUnits;
    if (activeFilter === 'stale') units = units.filter(u => u.stale);
    else if (activeFilter === 'busy') units = units.filter(u => u.status === 'busy' || u.status === 'dispatched');
    else if (activeFilter === 'oos') units = units.filter(u => u.status === 'oos' || u.status === 'maintenance');
    else if (activeFilter) units = units.filter(u => u.status === activeFilter);

    if (!units.length) { document.getElementById('unGrid').innerHTML = '<div style="color:#6b7d9e; padding:30px; text-align:center;">No units match</div>'; return; }

    document.getElementById('unGrid').innerHTML = units.map(u => `
      <div class="un-card ${u.status}">
        <div style="display:flex; justify-content:space-between;">
          <div><div class="code">${u.unit_code}</div><div class="type">${u.type||''}</div></div>
          <div style="font-size:10px; padding:2px 7px; background:rgba(99,179,237,0.13); border-radius:4px; color:#cdf1ff;">${u.status.toUpperCase()}</div>
        </div>
        <div class="row"><span>Home</span><strong>${u.home_station||'?'}</strong></div>
        <div class="row"><span>At</span><strong>${u.current_station||u.home_station||'?'}</strong></div>
        <div class="row"><span>Last check</span><span class="${u.stale?'stale':''}">${u.minutes_since_check==null?'never':u.minutes_since_check+'m ago'}</span></div>
        ${u.last_note ? '<div style="font-size:10px; color:#93a4cd; margin-top:4px;">"'+u.last_note+'"</div>' : ''}
        <div class="actions">
          <button onclick="window.cadOpenCheckin('${u.unit_code}')">Update</button>
        </div>
      </div>
    `).join('');
  }

  window.cadOpenCheckin = (code) => {
    document.getElementById('umTitle').textContent = 'Check in ' + code;
    document.getElementById('umStatus').value = 'available';
    document.getElementById('umStation').value = '';
    document.getElementById('umNote').value = '';
    document.getElementById('umSave').dataset.unit = code;
    document.getElementById('unModal').classList.add('visible');
  };

  document.getElementById('umSave').addEventListener('click', async () => {
    const code = document.getElementById('umSave').dataset.unit;
    const status = document.getElementById('umStatus').value;
    const station = document.getElementById('umStation').value;
    const note = document.getElementById('umNote').value;
    const r = await HAJJ.authedCall('unit_checkin', { unit_code: code, status, station, note });
    if (r && r.ok) { document.getElementById('unModal').classList.remove('visible'); refresh(); }
    else alert('Save failed: ' + ((r && r.error)||'unknown'));
  });

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body></html>
