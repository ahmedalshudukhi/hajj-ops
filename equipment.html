<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment</title><link rel="stylesheet" href="assets/style.css?v=0.2.53"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.eq-shell { max-width:1280px; margin:0 auto; padding:20px; }.eq-tally { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:14px 0 18px; }.eq-tally .tile { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.15); border-radius:10px; padding:14px 16px; }.eq-tally .tile .l { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }.eq-tally .tile .v { font-size:28px; font-weight:800; line-height:1; margin-top:4px; }.eq-tally .tile.ok .v { color:#6ee7b7; } .eq-tally .tile.warn .v { color:#fcd34d; } .eq-tally .tile.crit .v { color:#fca5a5; } .eq-tally .tile.info .v { color:#e8f1ff; }.eq-controls { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }.eq-controls select { padding:8px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:13px; }.eq-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }.eq-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:10px; padding:13px 16px; }.eq-card.ok { border-left:3px solid #22c55e; } .eq-card.low { border-left:3px solid #f59e0b; } .eq-card.defective { border-left:3px solid #ef4444; } .eq-card.expired { border-left:3px solid #6b7280; }.eq-card .name { font-size:14px; font-weight:600; color:#cdf1ff; }.eq-card .meta { font-size:11px; color:#93a4cd; margin-top:3px; }.eq-card .row { display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#cbd5e1; }.eq-card .badge { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; }.eq-card .badge.ok { background:rgba(34,197,94,0.18); color:#86efac; }.eq-card .badge.low { background:rgba(245,158,11,0.18); color:#fcd34d; }.eq-card .badge.defective { background:rgba(239,68,68,0.22); color:#fca5a5; }.eq-card .badge.expired { background:rgba(107,114,128,0.18); color:#9ca3af; }.eq-card button { background:rgba(99,179,237,0.13); color:#cdf1ff; border:1px solid rgba(99,179,237,0.3); padding:5px 10px; border-radius:5px; font-size:11px; cursor:pointer; margin-top:8px; }.eq-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center; padding:20px; }.eq-modal.visible { display:flex; }.eq-modal .box { background:linear-gradient(135deg,#0f1830,#06101e); border:1px solid rgba(99,179,237,0.25); border-radius:14px; padding:22px 26px; max-width:480px; width:100%; }.eq-modal label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:12px 0 5px; }.eq-modal select, .eq-modal input { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }.eq-modal .btnrow { display:flex; gap:10px; margin-top:16px; }.eq-modal .btnrow button { flex:1; padding:10px; border-radius:7px; cursor:pointer; font-weight:600; }.eq-modal .save { background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); }.eq-modal .cancel { background:transparent; color:#94a3b8; border:1px solid rgba(99,179,237,0.2); }</style></head><body><div id="topbar"></div><div class="eq-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Equipment</h1><p style="color:#93a4cd; margin:0 0 4px;">Track ALS bags, defibrillators, oxygen, kits per station. Click to update status.</p><div class="eq-tally" id="eqTally"></div><div class="eq-controls"><select id="eqStation"><option value="">All stations</option><option>ARF1</option><option>ARF2</option><option>ARF3</option><option>MUZ1</option><option>MUZ2</option><option>MUZ3</option><option>MIN1</option><option>MIN2</option><option>MIN3</option></select><select id="eqStatus"><option value="">All statuses</option><option value="ok">OK</option><option value="low">Low</option><option value="defective">Defective</option><option value="expired">Expired</option></select></div><div id="eqGrid" class="eq-grid"><div style="color:#6b7d9e; padding:30px;">Loading...</div></div></div><div class="eq-modal" id="eqModal"><div class="box"><h2 id="emTitle" style="margin:0 0 4px;">Update</h2><div id="emSubtitle" style="color:#93a4cd; font-size:12px;"></div><label>Status</label><select id="emStatus"><option value="ok">OK / operational</option><option value="low">Low / running out</option><option value="defective">Defective</option><option value="expired">Expired</option><option value="restocked">Just restocked</option></select><label>Note (optional)</label><input type="text" id="emNote" placeholder="e.g. battery dead, needs charging" /><div class="btnrow"><button class="cancel" onclick="document.getElementById('eqModal').classList.remove('visible')">Cancel</button><button class="save" id="emSave">Update</button></div></div></div><script src="assets/auth.js?v=0.2.53"></script><script src="assets/shortcuts.js?v=0.2.53"></script><script src="assets/topbar.js?v=0.2.53"></script><script src="assets/version.js?v=0.2.53"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Equipment" });

  async function refresh() {
    const station = document.getElementById('eqStation').value;
    const r = await HAJJ.authedCall('equipment_list', { station });
    if (!r || !r.ok) { document.getElementById('eqGrid').innerHTML = '<div style="color:#fca5a5;">Error: ' + (r && r.error || 'unknown') + '</div>'; return; }
    const t = r.tally || {};
    document.getElementById('eqTally').innerHTML =
      '<div class="tile info"><div class="l">Total</div><div class="v">' + (t.total||0) + '</div></div>' +
      '<div class="tile ok"><div class="l">OK</div><div class="v">' + (t.ok||0) + '</div></div>' +
      '<div class="tile warn"><div class="l">Low</div><div class="v">' + (t.low||0) + '</div></div>' +
      '<div class="tile crit"><div class="l">Defective</div><div class="v">' + (t.defective||0) + '</div></div>' +
      '<div class="tile crit"><div class="l">Expired</div><div class="v">' + (t.expired||0) + '</div></div>';
    const statusF = document.getElementById('eqStatus').value;
    let items = r.equipment || [];
    if (statusF) items = items.filter(function(e) { return e.status === statusF; });
    if (!items.length) { document.getElementById('eqGrid').innerHTML = '<div style="color:#6b7d9e; padding:30px; text-align:center;">No items match</div>'; return; }
    document.getElementById('eqGrid').innerHTML = items.map(function(e) {
      const lastCheck = e.last_check_ts ? '<div class="row"><span>Last check</span><span>' + new Date(e.last_check_ts*1000).toLocaleString() + '</span></div>' : '';
      const lastBy = e.last_check_by ? '<div class="row"><span>By</span><span>' + e.last_check_by + '</span></div>' : '';
      const noteHtml = e.note ? '<div style="font-size:10px; color:#fcd34d; margin-top:4px;">' + e.note + '</div>' : '';
      const labelEsc = String(e.label).replace(/'/g, '&#39;');
      return '<div class="eq-card ' + e.status + '">' +
        '<div style="display:flex; justify-content:space-between; align-items:start;">' +
          '<div><div class="name">' + e.label + '</div><div class="meta">' + e.station + ' · ' + e.type + '</div></div>' +
          '<span class="badge ' + e.status + '">' + e.status.toUpperCase() + '</span>' +
        '</div>' +
        lastCheck + lastBy + noteHtml +
        '<button data-eqid="' + e.id + '" data-label="' + labelEsc + '" data-status="' + e.status + '">Update status</button>' +
      '</div>';
    }).join('');
    document.querySelectorAll('[data-eqid]').forEach(function(b) {
      b.addEventListener('click', function() {
        document.getElementById('emTitle').textContent = 'Update ' + b.dataset.label;
        document.getElementById('emSubtitle').textContent = b.dataset.eqid;
        document.getElementById('emStatus').value = b.dataset.status || 'ok';
        document.getElementById('emNote').value = '';
        document.getElementById('emSave').dataset.id = b.dataset.eqid;
        document.getElementById('eqModal').classList.add('visible');
      });
    });
  }

  document.getElementById('emSave').addEventListener('click', async function() {
    const id = document.getElementById('emSave').dataset.id;
    const status = document.getElementById('emStatus').value;
    const note = document.getElementById('emNote').value;
    const r = await HAJJ.authedCall('equipment_status_set', { id, status, note });
    if (r && r.ok) { document.getElementById('eqModal').classList.remove('visible'); refresh(); }
    else alert('Update failed: ' + (r && r.error || 'unknown'));
  });

  document.getElementById('eqStation').addEventListener('change', refresh);
  document.getElementById('eqStatus').addEventListener('change', refresh);
  refresh();
  setInterval(refresh, 30000);
})();
</script></body></html>
