<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incidents Library · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=1.0.13">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; }
.in-shell { max-width:1400px; margin:0 auto; padding:20px; }
.in-controls { background:rgba(20,28,50,0.6); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:14px 18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; align-items:end; margin:14px 0 18px; }
.in-controls label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:5px; }
.in-controls input, .in-controls select { width:100%; padding:9px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:13px; }
.in-btn { padding:9px 16px; background:rgba(56,189,248,0.18); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:7px; font-weight:600; cursor:pointer; font-size:13px; }
.in-results { background:rgba(20,28,50,0.4); border:1px solid rgba(99,179,237,0.15); border-radius:12px; overflow:hidden; }
.in-row { display:grid; grid-template-columns:140px 70px 90px 90px 1fr 100px 60px; gap:10px; padding:10px 14px; align-items:center; border-bottom:1px solid rgba(99,179,237,0.05); font-size:12px; cursor:pointer; transition:background 0.12s; }
.in-row:hover { background:rgba(56,189,248,0.07); }
.in-row.head { background:rgba(99,179,237,0.10); font-weight:700; color:#cdf1ff; cursor:default; letter-spacing:0.04em; text-transform:uppercase; font-size:10px; }
.in-row.head:hover { background:rgba(99,179,237,0.10); }
.in-row .id { color:#cdf1ff; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
.in-row .badge { display:inline-block; padding:1px 7px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
.in-row .badge.red { background:rgba(239,68,68,0.22); color:#fca5a5; }
.in-row .badge.yellow { background:rgba(245,158,11,0.22); color:#fcd34d; }
.in-row .badge.green { background:rgba(34,197,94,0.22); color:#86efac; }
.in-row .badge.black { background:rgba(107,114,128,0.22); color:#cbd5e1; }
.in-row .status { font-size:11px; color:#93a4cd; }
.in-row .status.open { color:#fcd34d; font-weight:700; }
.in-row .complaint { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#cbd5e1; }
.in-empty { padding:50px; text-align:center; color:#6b7d9e; }
@media (max-width:900px) { .in-row { grid-template-columns:1fr; gap:4px; padding:12px 14px; } }
</style>
</head><body>
<div id="topbar"></div>
<div class="in-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Incidents Library</h1>
  <p style="color:#93a4cd; margin:0 0 4px;">Search and review the full incident history.</p>

  <div class="in-controls">
    <div><label>Search</label><input type="text" id="inQ" placeholder="ID, complaint, location" /></div>
    <div><label>Zone</label><select id="inCluster"><option value="">All zones</option>
      <option value="arafat">Arafat</option>
      <option value="muzdalifah">Muzdalifah</option>
      <option value="mina">Mina</option>
    </select></div>
    <div><label>Station</label><select id="inStation"><option value="">All</option>
      <option>ARF1</option><option>ARF2</option><option>ARF3</option>
      <option>MUZ1</option><option>MUZ2</option><option>MUZ3</option>
      <option>MIN1</option><option>MIN2</option><option>MIN3</option>
    </select></div>
    <div><label>Triage</label><select id="inTriage"><option value="">All</option>
      <option value="red">Red</option><option value="yellow">Yellow</option>
      <option value="green">Green</option><option value="black">Black</option>
    </select></div>
    <div><label>Status</label><select id="inStatus"><option value="">All</option>
      <option value="open">Open</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option>
    </select></div>
    <div><label>From</label><input type="date" id="inFrom" /></div>
    <div><label>To</label><input type="date" id="inTo" /></div>
    <div><label>Drills</label><select id="inDrills"><option value="0">Hide</option><option value="1">Include</option></select></div>
    <button class="in-btn" id="inSearch">Search</button>
  </div>

  <div style="color:#93a4cd; font-size:12px; margin-bottom:8px;" id="inMeta"></div>

  <div class="in-results">
    <div class="in-row head">
      <div>Incident</div><div>Triage</div><div>Status</div><div>Station</div><div>Complaint</div><div>Time</div><div>—</div>
    </div>
    <div id="inBody"><div class="in-empty">Use the search above</div></div>
  </div>
</div>

<script src="assets/auth.js?v=1.0.13"></script>
<script src="assets/shortcuts.js?v=1.0.13"></script>
<script src="assets/topbar.js?v=1.0.13"></script>
<script src="assets/version.js?v=1.0.13"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['cluster_supervisor','dispatcher','leadership','admin'])) return;
  CADTopbar.render({ title: "Incidents" });

  async function search() {
    const params = {
      q: document.getElementById('inQ').value,
      cluster: document.getElementById('inCluster').value,
      station: document.getElementById('inStation').value,
      triage: document.getElementById('inTriage').value,
      status: document.getElementById('inStatus').value,
      include_drills: document.getElementById('inDrills').value
    };
    const fromD = document.getElementById('inFrom').value;
    const toD = document.getElementById('inTo').value;
    if (fromD) params.from_ts = Math.floor(new Date(fromD + 'T00:00:00+03:00').getTime() / 1000);
    if (toD) params.to_ts = Math.floor(new Date(toD + 'T23:59:59+03:00').getTime() / 1000);
    const r = await HAJJ.authedCall('incidents_search', params);
    if (!r || !r.ok) { document.getElementById('inBody').innerHTML = '<div class="in-empty">Error: ' + ((r && r.error)||'unknown') + '</div>'; return; }
    document.getElementById('inMeta').textContent = r.count + ' results';
    if (!r.results.length) { document.getElementById('inBody').innerHTML = '<div class="in-empty">No incidents match</div>'; return; }
    document.getElementById('inBody').innerHTML = r.results.map(i => {
      const open = !i.closed_at && !['complete','closed','cancelled'].includes(i.status);
      const time = new Date(i.ts * 1000).toLocaleString();
      const drillFlag = i.is_drill ? '<span style="color:#d8b4fe; font-size:9px; padding:1px 5px; background:rgba(168,85,247,0.18); border-radius:3px;">DRILL</span> ' : '';
      const cardiacFlag = i.cardiac_arrest ? '<span title="Cardiac arrest" style="color:#fca5a5;">⚠ </span>' : '';
      return `<div class="in-row" onclick="window.location.href='/dispatch?incident=${i.incident_id}'">
        <div class="id">${drillFlag}${cardiacFlag}${i.incident_id}</div>
        <div><span class="badge ${i.triage||'green'}">${i.triage||'?'}</span></div>
        <div class="status ${open?'open':''}">${open ? 'OPEN' : (i.status||'closed')}</div>
        <div>${i.station||'?'}${i.sub_location?' / '+i.sub_location:''}</div>
        <div class="complaint">${(i.complaint||'').replace(/</g, '&lt;')}</div>
        <div style="font-size:11px; color:#93a4cd;">${time}</div>
        <div>${i.unit_assigned||'—'}</div>
      </div>`;
    }).join('');
  }

  // Auto-narrow Station dropdown when Zone changes — keeps station/zone consistent
  document.getElementById('inCluster').addEventListener('change', function() {
    const cluster = this.value;
    const stationSel = document.getElementById('inStation');
    const prefix = cluster === 'arafat' ? 'ARF' : cluster === 'muzdalifah' ? 'MUZ' : cluster === 'mina' ? 'MIN' : '';
    Array.from(stationSel.options).forEach(opt => {
      if (!opt.value) { opt.style.display = ''; return; }
      opt.style.display = (!prefix || opt.value.startsWith(prefix)) ? '' : 'none';
    });
    // If selected station no longer matches the zone, clear it
    if (prefix && stationSel.value && !stationSel.value.startsWith(prefix)) {
      stationSel.value = '';
    }
  });
  document.getElementById('inSearch').addEventListener('click', search);
  document.getElementById('inQ').addEventListener('keypress', e => { if (e.key === 'Enter') search(); });
  ['inStation','inTriage','inStatus','inDrills'].forEach(id => document.getElementById(id).addEventListener('change', search));
  search();
})();
</script>
</body></html>
