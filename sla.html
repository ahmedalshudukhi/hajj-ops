<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLA Dashboard</title><link rel="stylesheet" href="assets/style.css?v=0.2.53"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.sla-shell { max-width:1280px; margin:0 auto; padding:20px; }.sla-head { display:flex; justify-content:space-between; align-items:end; margin:14px 0 18px; flex-wrap:wrap; gap:14px; }.sla-head h1 { margin:0; font-size:28px; color:#cdf1ff; }.sla-head .meta { color:#93a4cd; font-size:12px; }.sla-controls select { padding:8px 14px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:13px; }.sla-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:14px; }.sla-metric { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 22px; }.sla-metric .name { font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px; }.sla-metric .compliance { font-size:42px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }.sla-metric.green .compliance { color:#86efac; }.sla-metric.yellow .compliance { color:#fcd34d; }.sla-metric.red .compliance { color:#fca5a5; }.sla-metric .target { font-size:11px; color:#93a4cd; margin-top:8px; }.sla-metric .stats { display:flex; gap:14px; margin-top:10px; font-size:11px; color:#cbd5e1; font-family:ui-monospace,Menlo,monospace; }.sla-metric .stats span { flex:1; }.sla-metric .stats .l { display:block; color:#6b7d9e; font-size:9px; letter-spacing:0.10em; text-transform:uppercase; }.sla-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 22px; margin-bottom:14px; }.sla-card h2 { margin:0 0 12px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.sla-by-station { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }.sla-st { padding:14px 16px; background:rgba(15,23,42,0.5); border-radius:9px; border-left:3px solid #67e8f9; }.sla-st.green { border-left-color:#22c55e; }.sla-st.yellow { border-left-color:#f59e0b; }.sla-st.red { border-left-color:#ef4444; }.sla-st .name { color:#cdf1ff; font-weight:700; font-size:13px; }.sla-st .stats { display:flex; justify-content:space-between; font-size:11px; color:#cbd5e1; margin-top:5px; }.sla-st .breach-rate { font-weight:700; }.sla-st.red .breach-rate { color:#fca5a5; }.sla-st.yellow .breach-rate { color:#fcd34d; }.sla-st.green .breach-rate { color:#86efac; }</style></head><body><div id="topbar"></div><div class="sla-shell"><div class="sla-head"><div><h1>SLA Dashboard</h1><div class="meta" id="slaMeta">Loading...</div></div><div class="sla-controls"><select id="slaWin"><option value="6">Last 6h</option><option value="12">Last 12h</option><option value="24" selected>Last 24h</option><option value="72">Last 3 days</option></select></div></div><p style="color:#93a4cd; margin:0 0 14px;">Compliance with response-time targets. Updates every 30s.</p><div class="sla-metrics" id="slaMetrics"></div><div class="sla-card"><h2>By Station (breach rate)</h2><div class="sla-by-station" id="slaStations"></div></div></div><script src="assets/auth.js?v=0.2.61"></script><script src="assets/shortcuts.js?v=0.2.53"></script><script src="assets/topbar.js?v=0.2.53"></script><script src="assets/version.js?v=0.2.53"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "SLA" });
  function fmt(sec) {
    if (sec == null) return '--';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m > 0 ? m + 'm ' + s + 's' : s + 's';
  }
  const METRIC_NAMES = {
    dispatch_to_enroute: 'Dispatch → En Route',
    dispatch_to_on_scene: 'Dispatch → On Scene',
    on_scene_time: 'On-scene Duration',
    dispatch_to_close: 'Dispatch → Closed'
  };
  function classifyCompliance(c) {
    if (c == null) return 'gray';
    if (c >= 90) return 'green';
    if (c >= 75) return 'yellow';
    return 'red';
  }
  async function refresh() {
    const hours = parseInt(document.getElementById('slaWin').value);
    const r = await HAJJ.authedCall('sla_summary', { lookback_hours: hours });
    if (!r || !r.ok) { document.getElementById('slaMetrics').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    document.getElementById('slaMeta').textContent = 'Last ' + hours + 'h · ' + r.total_incidents + ' incidents · updated ' + new Date().toLocaleTimeString();
    document.getElementById('slaMetrics').innerHTML = Object.keys(r.metrics).map(function(k) {
      const m = r.metrics[k];
      const cls = classifyCompliance(parseFloat(m.compliance));
      return '<div class="sla-metric ' + cls + '">' +
        '<div class="name">' + METRIC_NAMES[k] + '</div>' +
        '<div class="compliance">' + (m.compliance != null ? m.compliance + '%' : '--') + '</div>' +
        '<div class="target">Target: ≤ ' + fmt(m.target) + ' · breaches: ' + (m.breaches != null ? m.breaches : 0) + '/' + (m.n != null ? m.n : 0) + '</div>' +
        '<div class="stats">' +
          '<span><span class="l">avg</span>' + (m.avg != null ? fmt(m.avg) : '--') + '</span>' +
          '<span><span class="l">median</span>' + (m.median != null ? fmt(m.median) : '--') + '</span>' +
          '<span><span class="l">p90</span>' + (m.p90 != null ? fmt(m.p90) : '--') + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
    const stations = Object.keys(r.by_station).sort();
    if (stations.length === 0) {
      document.getElementById('slaStations').innerHTML = '<div style="color:#6b7d9e; padding:14px; text-align:center;">No data</div>';
    } else {
      document.getElementById('slaStations').innerHTML = stations.map(function(s) {
        const bs = r.by_station[s];
        const rate = bs.n > 0 ? Math.round((bs.breach / bs.n) * 100) : 0;
        const cls = rate < 10 ? 'green' : rate < 25 ? 'yellow' : 'red';
        return '<div class="sla-st ' + cls + '">' +
          '<div class="name">' + (s || 'unspec') + '</div>' +
          '<div class="stats"><span>' + bs.n + ' incidents</span><span class="breach-rate">' + rate + '% breach</span></div>' +
        '</div>';
      }).join('');
    }
  }
  document.getElementById('slaWin').addEventListener('change', refresh);
  refresh();
  setInterval(refresh, 30000);
})();
</script></body></html>
