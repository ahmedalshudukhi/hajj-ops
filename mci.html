<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCI Command</title><link rel="stylesheet" href="assets/style.css?v=0.2.37"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.mci-shell { max-width:1400px; margin:0 auto; padding:20px; }.mci-banner { background:linear-gradient(90deg,rgba(239,68,68,0.20),rgba(220,38,38,0.20)); border:2px solid rgba(239,68,68,0.45); border-radius:12px; padding:14px 22px; margin:14px 0 18px; display:flex; justify-content:space-between; align-items:center; }.mci-banner.inactive { background:linear-gradient(90deg,rgba(34,197,94,0.10),rgba(22,163,74,0.10)); border-color:rgba(34,197,94,0.30); }.mci-banner h2 { margin:0; font-size:18px; color:#fca5a5; }.mci-banner.inactive h2 { color:#86efac; }.mci-banner .sub { font-size:12px; color:#fcd34d; margin-top:4px; }.mci-banner.inactive .sub { color:#94a3b8; }.mci-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }@media (max-width:900px) { .mci-grid { grid-template-columns:1fr; } }.mci-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 20px; }.mci-card h3 { margin:0 0 14px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.tri-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }.tri-cell { padding:18px 14px; border-radius:10px; text-align:center; }.tri-cell.red { background:rgba(239,68,68,0.18); border:1px solid rgba(239,68,68,0.5); }.tri-cell.yellow { background:rgba(245,158,11,0.18); border:1px solid rgba(245,158,11,0.5); }.tri-cell.green { background:rgba(34,197,94,0.18); border:1px solid rgba(34,197,94,0.5); }.tri-cell.black { background:rgba(31,41,55,0.45); border:1px solid rgba(107,114,128,0.5); }.tri-cell .lbl { font-size:11px; color:#cbd5e1; letter-spacing:0.13em; text-transform:uppercase; }.tri-cell.red .lbl { color:#fca5a5; } .tri-cell.yellow .lbl { color:#fcd34d; } .tri-cell.green .lbl { color:#86efac; } .tri-cell.black .lbl { color:#9ca3af; }.tri-cell .num { font-size:44px; font-weight:800; line-height:1; margin:6px 0; font-variant-numeric:tabular-nums; color:#e8f1ff; }.unit-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }.unit-cell { padding:14px; border-radius:10px; text-align:center; background:rgba(15,23,42,0.5); border:1px solid rgba(99,179,237,0.12); }.unit-cell .lbl { font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; }.unit-cell .num { font-size:30px; font-weight:800; line-height:1; margin-top:4px; color:#e8f1ff; font-variant-numeric:tabular-nums; }.unit-cell.avail .num { color:#86efac; } .unit-cell.busy .num { color:#fcd34d; } .unit-cell.oos .num { color:#fca5a5; }.hosp-list { display:flex; flex-direction:column; gap:8px; }.hosp-row { padding:10px 14px; background:rgba(15,23,42,0.5); border-radius:7px; display:grid; grid-template-columns:1fr 90px 60px; gap:10px; align-items:center; font-size:12px; }.hosp-row .name { color:#cdf1ff; font-weight:600; }.hosp-row .name .ar { color:#93a4cd; font-size:11px; direction:rtl; margin-top:2px; }.hosp-row .status { padding:3px 9px; border-radius:5px; font-size:10px; font-weight:700; text-align:center; text-transform:uppercase; }.hosp-row .status.normal { background:rgba(34,197,94,0.18); color:#86efac; }.hosp-row .status.busy { background:rgba(245,158,11,0.18); color:#fcd34d; }.hosp-row .status.divert { background:rgba(239,68,68,0.20); color:#fca5a5; }.hosp-row .status.closed { background:rgba(107,114,128,0.18); color:#9ca3af; }.hosp-row .cap { color:#cbd5e1; font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }.st-row { padding:8px 14px; background:rgba(15,23,42,0.5); border-radius:6px; display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; }.st-row .name { color:#cdf1ff; font-weight:600; }.st-row .n { color:#fcd34d; font-weight:700; font-variant-numeric:tabular-nums; }.st-row.surge { background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.30); }.st-row.critical { background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.30); }.st-row.critical .n { color:#fca5a5; }.declare-btn { background:rgba(239,68,68,0.22); color:#fca5a5; border:1px solid rgba(239,68,68,0.5); padding:10px 22px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }.stand-down-btn { background:rgba(34,197,94,0.18); color:#86efac; border:1px solid rgba(34,197,94,0.4); padding:10px 22px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }</style></head><body><div id="topbar"></div><div class="mci-shell"><h1 style="font-size:28px; margin:16px 0 4px;">MCI Command Center</h1><p style="color:#93a4cd; margin:0 0 4px;">Mass Casualty Incident dashboard. All critical operational data in one view.</p><div class="mci-banner inactive" id="mciBanner"><div><h2 id="mciTitle">No MCI declared</h2><div class="sub" id="mciSub">Normal operations</div></div><div id="mciAction"></div></div><div class="mci-grid"><div class="mci-card"><h3>Live Triage Counts (last 6h, non-drill)</h3><div class="tri-grid" id="mciTriage"></div></div><div class="mci-card"><h3>MCI Triage Tags (last 24h)</h3><div class="tri-grid" id="mciTags"></div><div style="margin-top:14px; text-align:center;"><a href="/triage" style="font-size:12px; color:#67e8f9; text-decoration:none;">Assign new tag &rarr;</a></div></div><div class="mci-card"><h3>Unit Availability</h3><div class="unit-row" id="mciUnits"></div></div><div class="mci-card"><h3>Hospital ED Status</h3><div class="hosp-list" id="mciHospitals"></div></div><div class="mci-card" style="grid-column:1/-1;"><h3>Open Incidents by Station</h3><div id="mciStations"></div></div></div></div><script src="assets/auth.js?v=0.2.37"></script><script src="assets/shortcuts.js?v=0.2.37"></script><script src="assets/topbar.js?v=0.2.37"></script><script src="assets/version.js?v=0.2.37"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['cluster_supervisor','dispatcher','leadership','admin'])) return;
  CADTopbar.render({ title: "MCI Command" });
  const me = await HAJJ.whoami();
  const canDeclare = me && me.user && ['leadership','admin'].includes(me.user.role);
  async function refresh() {
    const r = await HAJJ.authedCall('mci_command_summary', {});
    if (!r || !r.ok) { document.getElementById('mciTriage').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    const banner = document.getElementById('mciBanner');
    if (r.mci.active) {
      banner.classList.remove('inactive');
      document.getElementById('mciTitle').textContent = 'MCI ACTIVE';
      document.getElementById('mciSub').textContent = 'Declared by ' + (r.mci.declared_by || '?') + (r.mci.location ? ' at ' + r.mci.location : '') + (r.mci.declared_at ? ' · ' + new Date(r.mci.declared_at * 1000).toLocaleString() : '');
      if (canDeclare) document.getElementById('mciAction').innerHTML = '<button class="stand-down-btn" onclick="window.mciStandDown()">Stand Down</button>';
    } else {
      banner.classList.add('inactive');
      document.getElementById('mciTitle').textContent = 'No MCI declared';
      document.getElementById('mciSub').textContent = 'Normal operations';
      if (canDeclare) document.getElementById('mciAction').innerHTML = '<button class="declare-btn" onclick="window.mciDeclare()">Declare MCI</button>';
    }
    document.getElementById('mciTriage').innerHTML = ['red','yellow','green','black'].map(function(c) {
      return '<div class="tri-cell ' + c + '"><div class="lbl">' + c + '</div><div class="num">' + (r.triage_counts[c] || 0) + '</div></div>';
    }).join('');
    document.getElementById('mciTags').innerHTML = ['red','yellow','green','black'].map(function(c) {
      return '<div class="tri-cell ' + c + '"><div class="lbl">' + c + '</div><div class="num">' + (r.tag_counts[c] || 0) + '</div></div>';
    }).join('');
    document.getElementById('mciUnits').innerHTML =
      '<div class="unit-cell avail"><div class="lbl">Available</div><div class="num">' + (r.unit_counts.available || 0) + '</div></div>' +
      '<div class="unit-cell busy"><div class="lbl">Busy</div><div class="num">' + (r.unit_counts.busy || 0) + '</div></div>' +
      '<div class="unit-cell oos"><div class="lbl">Out of svc</div><div class="num">' + (r.unit_counts.oos || 0) + '</div></div>';
    if (!r.hospitals.length) {
      document.getElementById('mciHospitals').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No hospital data</div>';
    } else {
      document.getElementById('mciHospitals').innerHTML = r.hospitals.map(function(h) {
        return '<div class="hosp-row">' +
          '<div><div class="name">' + (h.name || '--') + '</div>' + (h.name_ar ? '<div class="ar">' + h.name_ar + '</div>' : '') + '</div>' +
          '<div class="status ' + (h.ed_status || 'normal') + '">' + (h.ed_status || 'normal') + '</div>' +
          '<div class="cap">' + (h.ed_capacity_pct != null ? h.ed_capacity_pct + '%' : '--') + '</div>' +
        '</div>';
      }).join('');
    }
    if (!r.open_by_station.length) {
      document.getElementById('mciStations').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No open incidents</div>';
    } else {
      document.getElementById('mciStations').innerHTML = r.open_by_station.map(function(s) {
        const cl = s.n >= 5 ? 'critical' : s.n >= 3 ? 'surge' : '';
        return '<div class="st-row ' + cl + '"><span class="name">' + s.station + '</span><span class="n">' + s.n + '</span></div>';
      }).join('');
    }
  }
  window.mciDeclare = async function() {
    const location = prompt('Where is the MCI? (e.g. ARF1 platform 3)');
    if (!location) return;
    if (!confirm('Declare MCI at "' + location + '"? This is broadcast to all users.')) return;
    const r = await HAJJ.authedCall('mci_set', { active: true, location });
    if (r && r.ok) refresh();
    else alert('Failed: ' + ((r && r.error) || 'unknown'));
  };
  window.mciStandDown = async function() {
    if (!confirm('Stand down MCI?')) return;
    const r = await HAJJ.authedCall('mci_set', { active: false });
    if (r && r.ok) refresh();
    else alert('Failed: ' + ((r && r.error) || 'unknown'));
  };
  refresh();
  setInterval(refresh, 8000);
})();
</script></body></html>
