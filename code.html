<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Blue</title><link rel="stylesheet" href="assets/style.css?v=0.2.47"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.cb-shell { max-width:1280px; margin:0 auto; padding:20px; }.cb-stage { background:linear-gradient(135deg,rgba(139,0,0,0.18),rgba(220,38,38,0.08)); border:2px solid rgba(239,68,68,0.4); border-radius:14px; padding:24px 28px; margin:14px 0; position:relative; }.cb-stage.idle { background:rgba(20,28,50,0.5); border-color:rgba(99,179,237,0.2); }.cb-stage h2 { margin:0 0 4px; font-size:24px; color:#fca5a5; letter-spacing:0.04em; }.cb-stage.idle h2 { color:#cdf1ff; }.cb-stage .sub { font-size:12px; color:#fcd34d; }.cb-stage.idle .sub { color:#93a4cd; }.cb-timers { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:16px; }.cb-timer { background:rgba(15,23,42,0.65); border:1px solid rgba(99,179,237,0.2); border-radius:10px; padding:16px 18px; text-align:center; }.cb-timer.alarm { background:rgba(239,68,68,0.18); border-color:rgba(239,68,68,0.5); animation:flash 1s infinite; }@keyframes flash { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow:0 0 0 12px rgba(239,68,68,0); } }.cb-timer .lbl { font-size:11px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }.cb-timer .v { font-family:ui-monospace,Menlo,monospace; font-size:38px; font-weight:800; line-height:1; margin:6px 0 2px; color:#e8f1ff; font-variant-numeric:tabular-nums; }.cb-timer.elapsed .v { color:#fcd34d; }.cb-timer.epi .v { color:#fca5a5; }.cb-timer.rhythm .v { color:#67e8f9; }.cb-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }@media (max-width:900px) { .cb-grid { grid-template-columns:1fr; } }.cb-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 20px; }.cb-card h3 { margin:0 0 12px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.cb-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }.cb-btn { background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); padding:14px 12px; border-radius:9px; cursor:pointer; font-weight:700; font-size:13px; text-align:center; transition:all 0.12s; }.cb-btn:hover { background:rgba(56,189,248,0.32); transform:translateY(-1px); }.cb-btn.epi { background:rgba(239,68,68,0.20); color:#fca5a5; border-color:rgba(239,68,68,0.4); }.cb-btn.shock { background:rgba(245,158,11,0.22); color:#fcd34d; border-color:rgba(245,158,11,0.45); }.cb-btn.rhythm { background:rgba(168,85,247,0.20); color:#d8b4fe; border-color:rgba(168,85,247,0.4); }.cb-btn.success { background:rgba(34,197,94,0.22); color:#86efac; border-color:rgba(34,197,94,0.45); }.cb-log { max-height:300px; overflow-y:auto; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.6; }.cb-log .row { padding:6px 0; border-bottom:1px solid rgba(99,179,237,0.06); display:flex; gap:14px; }.cb-log .t { color:#67e8f9; font-weight:600; min-width:60px; }.cb-log .ev { color:#e8f1ff; flex:1; }.cb-log .row.epi .ev { color:#fca5a5; font-weight:700; }.cb-log .row.shock .ev { color:#fcd34d; font-weight:700; }.cb-log .row.rhythm .ev { color:#d8b4fe; }.cb-log .row.rosc .ev { color:#86efac; font-weight:700; }.cb-incident { display:flex; gap:10px; align-items:end; margin-bottom:14px; }.cb-incident input { flex:1; padding:11px 14px; border-radius:8px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }.cb-start-btn { background:rgba(239,68,68,0.30); color:#fca5a5; border:2px solid rgba(239,68,68,0.55); padding:14px 28px; border-radius:9px; font-weight:800; cursor:pointer; font-size:14px; letter-spacing:0.04em; text-transform:uppercase; }.cb-end-btn { background:rgba(34,197,94,0.22); color:#86efac; border:1px solid rgba(34,197,94,0.5); padding:14px 28px; border-radius:9px; font-weight:700; cursor:pointer; font-size:14px; }.cb-cpr-rate { display:flex; align-items:center; gap:14px; padding:10px 14px; background:rgba(15,23,42,0.5); border-radius:8px; margin-bottom:10px; }.cb-cpr-rate .dot { width:14px; height:14px; border-radius:50%; background:#22c55e; }.cb-cpr-rate .dot.metro { animation:bpm 0.5s infinite; }@keyframes bpm { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.4); opacity:0.6; } }.cb-cpr-rate button { margin-left:auto; background:rgba(34,197,94,0.18); color:#86efac; border:1px solid rgba(34,197,94,0.4); padding:6px 14px; border-radius:7px; cursor:pointer; font-size:12px; font-weight:600; }</style></head><body><div id="topbar"></div><div class="cb-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Code Blue Mode</h1><p style="color:#93a4cd; margin:0 0 4px;">Cardiac arrest run timer. Tracks arrest start, epinephrine intervals (3-5 min), rhythm checks (2 min), shocks, and ROSC.</p><div class="cb-stage idle" id="cbStage"><h2 id="cbTitle">No active code</h2><div class="sub" id="cbSub">Start a code to begin timing</div><div id="cbStart" style="margin-top:14px;"><div class="cb-incident"><input type="text" id="cbInc" placeholder="Incident ID (e.g. DSP-...)" /></div><button class="cb-start-btn" id="cbStartBtn">Start Code Blue</button></div><div id="cbActive" style="display:none;"><div class="cb-timers" id="cbTimers"></div><div class="cb-cpr-rate"><span class="dot metro" id="cbMetro"></span><span style="color:#86efac; font-weight:600;">CPR Metronome: 110 BPM (push hard, push fast)</span><button id="cbMetroBtn">Toggle sound</button></div><div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;"><button class="cb-end-btn" id="cbRoscBtn">ROSC Achieved</button><button class="cb-end-btn" style="background:rgba(107,114,128,0.25); color:#cbd5e1; border-color:rgba(107,114,128,0.45);" id="cbDeadBtn">Termination of Resuscitation</button></div></div></div><div class="cb-grid"><div class="cb-card"><h3>Log Event</h3><div class="cb-actions"><button class="cb-btn epi" data-ev="epinephrine" data-detail="1mg IV/IO">Epinephrine 1mg</button><button class="cb-btn shock" data-ev="shock" data-detail="200J">Shock 200J</button><button class="cb-btn rhythm" data-ev="rhythm_check">Rhythm Check</button><button class="cb-btn" data-ev="cpr_resumed">CPR Resumed</button><button class="cb-btn" data-ev="amiodarone" data-detail="300mg IV/IO">Amiodarone 300mg</button><button class="cb-btn" data-ev="airway" data-detail="intubated">Airway Secured</button><button class="cb-btn" data-ev="iv_access">IV/IO Access</button><button class="cb-btn" data-ev="defib_pads">Defib Pads On</button></div></div><div class="cb-card"><h3>Event Log</h3><div class="cb-log" id="cbLog"><div style="color:#6b7d9e; padding:14px;">No events yet</div></div></div></div></div><script src="assets/auth.js?v=0.2.47"></script><script src="assets/shortcuts.js?v=0.2.47"></script><script src="assets/topbar.js?v=0.2.47"></script><script src="assets/version.js?v=0.2.47"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin'])) return;
  CADTopbar.render({ title: "Code Blue" });

  let codeState = { active: false, incident_id: null, start_ts: null, last_epi_ts: null, last_rhythm_ts: null, last_shock_ts: null, events: [], roscAchieved: false };

  // Persist state to localStorage so a refresh doesn't lose the code
  const SKEY = 'cad_code_blue_state_v1';
  try { const saved = JSON.parse(localStorage.getItem(SKEY)); if (saved && saved.active) codeState = saved; } catch (_) {}

  function saveState() { localStorage.setItem(SKEY, JSON.stringify(codeState)); }
  function clearState() { localStorage.removeItem(SKEY); }

  // Web Audio alarm
  let audioCtx = null, metroOsc = null, metroOn = false;
  function ctx() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {} } return audioCtx; }
  function chime(freq, dur) {
    const c = ctx(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    const osc = c.createOscillator(), gain = c.createGain();
    osc.frequency.value = freq; osc.type = 'sine';
    const t = c.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function alarm(kind) {
    if (kind === 'epi') { chime(660, 0.2); setTimeout(function(){chime(880, 0.2);}, 200); }
    else if (kind === 'rhythm') { chime(440, 0.15); setTimeout(function(){chime(550, 0.15);}, 150); setTimeout(function(){chime(660, 0.15);}, 300); }
  }

  // CPR metronome — 110 BPM = 545ms between beats
  let metroInterval = null;
  function startMetronome() {
    if (metroInterval) return;
    metroOn = true;
    metroInterval = setInterval(function() {
      if (!metroOn) return;
      chime(800, 0.04);
    }, 545);
  }
  function stopMetronome() {
    if (metroInterval) clearInterval(metroInterval);
    metroInterval = null;
    metroOn = false;
  }
  document.getElementById('cbMetroBtn').addEventListener('click', function() {
    if (metroOn) stopMetronome(); else startMetronome();
    this.textContent = metroOn ? 'Mute' : 'Sound on';
  });

  function fmt(secs) {
    if (secs == null || secs < 0) return '--:--';
    const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function render() {
    const stage = document.getElementById('cbStage');
    if (codeState.active) {
      stage.classList.remove('idle');
      document.getElementById('cbTitle').textContent = 'CODE BLUE — ' + (codeState.incident_id || '(no incident ID)');
      document.getElementById('cbSub').textContent = 'Started ' + new Date(codeState.start_ts * 1000).toLocaleTimeString();
      document.getElementById('cbStart').style.display = 'none';
      document.getElementById('cbActive').style.display = '';

      const now = Math.floor(Date.now() / 1000);
      const elapsed = now - codeState.start_ts;
      const sinceEpi = codeState.last_epi_ts ? now - codeState.last_epi_ts : null;
      const sinceRhythm = codeState.last_rhythm_ts ? now - codeState.last_rhythm_ts : null;

      const epiAlarm = sinceEpi != null && sinceEpi >= 180;  // 3min
      const rhythmAlarm = sinceRhythm != null && sinceRhythm >= 120;  // 2min

      document.getElementById('cbTimers').innerHTML =
        '<div class="cb-timer elapsed"><div class="lbl">Total elapsed</div><div class="v">' + fmt(elapsed) + '</div></div>' +
        '<div class="cb-timer epi ' + (epiAlarm ? 'alarm' : '') + '"><div class="lbl">Since last EPI</div><div class="v">' + (sinceEpi != null ? fmt(sinceEpi) : '--:--') + '</div></div>' +
        '<div class="cb-timer rhythm ' + (rhythmAlarm ? 'alarm' : '') + '"><div class="lbl">Since rhythm check</div><div class="v">' + (sinceRhythm != null ? fmt(sinceRhythm) : '--:--') + '</div></div>' +
        '<div class="cb-timer"><div class="lbl">Events logged</div><div class="v">' + codeState.events.length + '</div></div>';

      // Render log
      if (codeState.events.length === 0) {
        document.getElementById('cbLog').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No events yet</div>';
      } else {
        document.getElementById('cbLog').innerHTML = codeState.events.slice().reverse().map(function(e) {
          const sinceStart = e.ts - codeState.start_ts;
          const cls = e.event_type === 'epinephrine' ? 'epi' : e.event_type === 'shock' ? 'shock' : e.event_type === 'rhythm_check' ? 'rhythm' : e.event_type === 'rosc' ? 'rosc' : '';
          return '<div class="row ' + cls + '"><span class="t">+' + fmt(sinceStart) + '</span><span class="ev">' + e.event_type.replace(/_/g, ' ').toUpperCase() + (e.detail ? ' · ' + e.detail : '') + '</span></div>';
        }).join('');
      }

      // Fire alarm chime when crossing threshold (only once per crossing)
      if (epiAlarm && !codeState._epiAlarmFired) { alarm('epi'); codeState._epiAlarmFired = true; saveState(); }
      if (rhythmAlarm && !codeState._rhythmAlarmFired) { alarm('rhythm'); codeState._rhythmAlarmFired = true; saveState(); }
    } else {
      stage.classList.add('idle');
      document.getElementById('cbTitle').textContent = 'No active code';
      document.getElementById('cbSub').textContent = 'Start a code to begin timing';
      document.getElementById('cbStart').style.display = '';
      document.getElementById('cbActive').style.display = 'none';
    }
  }

  async function logEvent(eventType, detail) {
    if (!codeState.active) { alert('Start a code first'); return; }
    const ts = Math.floor(Date.now() / 1000);
    codeState.events.push({ event_type: eventType, detail: detail || '', ts });
    if (eventType === 'epinephrine') { codeState.last_epi_ts = ts; codeState._epiAlarmFired = false; }
    if (eventType === 'rhythm_check') { codeState.last_rhythm_ts = ts; codeState._rhythmAlarmFired = false; }
    if (eventType === 'shock') codeState.last_shock_ts = ts;
    saveState();
    render();
    // Persist to server
    await HAJJ.authedCall('code_blue_event', { incident_id: codeState.incident_id || '', event_type: eventType, detail: detail || '', ts });
  }

  document.getElementById('cbStartBtn').addEventListener('click', async function() {
    const inc = document.getElementById('cbInc').value.trim();
    if (!inc) { if (!confirm('No incident ID. Start anyway?')) return; }
    const ts = Math.floor(Date.now() / 1000);
    codeState = { active: true, incident_id: inc, start_ts: ts, last_epi_ts: null, last_rhythm_ts: null, last_shock_ts: null, events: [{ event_type: 'arrest_start', ts }], roscAchieved: false };
    saveState();
    render();
    startMetronome();
    document.getElementById('cbMetroBtn').textContent = 'Mute';
    await HAJJ.authedCall('code_blue_event', { incident_id: inc, event_type: 'arrest_start', ts });
  });

  document.querySelectorAll('.cb-actions [data-ev]').forEach(function(b) {
    b.addEventListener('click', function() {
      logEvent(b.dataset.ev, b.dataset.detail || '');
    });
  });

  document.getElementById('cbRoscBtn').addEventListener('click', async function() {
    if (!confirm('Mark ROSC achieved? This will end the code.')) return;
    await logEvent('rosc', 'ROSC achieved');
    stopMetronome();
    codeState.roscAchieved = true;
    codeState.active = false;
    clearState();
    render();
  });
  document.getElementById('cbDeadBtn').addEventListener('click', async function() {
    if (!confirm('Terminate resuscitation? This will end the code.')) return;
    await logEvent('termination', 'Resuscitation terminated');
    stopMetronome();
    codeState.active = false;
    clearState();
    render();
  });

  render();
  setInterval(render, 1000);
})();
</script></body></html>
