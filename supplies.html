<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplies</title><link rel="stylesheet" href="assets/style.css?v=0.2.53"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.sp-shell { max-width:1280px; margin:0 auto; padding:20px; }.sp-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }@media (max-width:900px) { .sp-grid { grid-template-columns:1fr; } }.sp-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }.sp-tile { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:14px 18px; }.sp-tile .l { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }.sp-tile .v { font-size:30px; font-weight:800; line-height:1; margin-top:4px; }.sp-tile.open .v { color:#fcd34d; }.sp-tile.progress .v { color:#67e8f9; }.sp-tile.done .v { color:#86efac; }.sp-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 22px; }.sp-card h2 { margin:0 0 12px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.sp-form label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:10px 0 5px; }.sp-form select, .sp-form input, .sp-form textarea { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }.sp-form button { padding:12px 22px; background:rgba(56,189,248,0.22); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:7px; cursor:pointer; font-weight:700; margin-top:14px; }.sp-req { background:rgba(15,23,42,0.5); border-radius:8px; padding:12px 16px; margin-bottom:8px; border-left:3px solid #6b7280; }.sp-req.urgent { border-left-color:#ef4444; background:rgba(239,68,68,0.07); }.sp-req.normal { border-left-color:#67e8f9; }.sp-req .top { display:flex; justify-content:space-between; gap:10px; align-items:start; margin-bottom:5px; }.sp-req .item { color:#cdf1ff; font-weight:700; font-size:13px; }.sp-req .meta { color:#93a4cd; font-size:11px; }.sp-req .status-pill { padding:3px 10px; border-radius:5px; font-size:10px; font-weight:700; text-transform:uppercase; }.sp-req .status-pill.open { background:rgba(245,158,11,0.18); color:#fcd34d; }.sp-req .status-pill.in_progress { background:rgba(56,189,248,0.18); color:#67e8f9; }.sp-req .status-pill.fulfilled { background:rgba(34,197,94,0.18); color:#86efac; }.sp-req .status-pill.cancelled { background:rgba(107,114,128,0.18); color:#9ca3af; }.sp-req .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }.sp-req .actions button { padding:4px 9px; border-radius:5px; font-size:11px; cursor:pointer; font-weight:600; }.sp-req .actions .progress { background:rgba(56,189,248,0.18); color:#67e8f9; border:1px solid rgba(56,189,248,0.4); }.sp-req .actions .fulfill { background:rgba(34,197,94,0.18); color:#86efac; border:1px solid rgba(34,197,94,0.4); }.sp-req .actions .cancel { background:rgba(239,68,68,0.18); color:#fca5a5; border:1px solid rgba(239,68,68,0.4); }</style></head><body><div id="topbar"></div><div class="sp-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Supply Requests</h1><p style="color:#93a4cd; margin:0 0 4px;">Request supplies from logistics. Cluster Sups + leadership/admin can update status.</p><div class="sp-tiles" id="spTiles"></div><div class="sp-grid"><div class="sp-card"><h2>New Request</h2><div class="sp-form"><label>Station</label><select id="spSt"><option value="">--</option><option>ARF1</option><option>ARF2</option><option>ARF3</option><option>MUZ1</option><option>MUZ2</option><option>MUZ3</option><option>MIN1</option><option>MIN2</option><option>MIN3</option><option>OCC</option></select><label>Item</label><input type="text" id="spItem" placeholder="e.g. IV start kit, O2 portable tank, cooling kit" /><label>Quantity</label><input type="text" id="spQty" placeholder="e.g. 5, 1 box" /><label>Urgency</label><select id="spUrg"><option value="normal">Normal</option><option value="urgent">Urgent (within 30 min)</option><option value="routine">Routine (next shift)</option></select><label>Reason / notes</label><textarea id="spReason" rows="2" placeholder="e.g. ran out during last cardiac arrest call"></textarea><button id="spSubmit">Submit Request</button></div></div><div class="sp-card"><h2>Active Requests</h2><div id="spList"><div style="color:#6b7d9e; padding:14px;">Loading...</div></div></div></div></div><script src="assets/auth.js?v=0.2.61"></script><script src="assets/shortcuts.js?v=0.2.53"></script><script src="assets/topbar.js?v=0.2.53"></script><script src="assets/version.js?v=0.2.53"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Supplies" });
  const me = await HAJJ.whoami();
  const canManage = me && me.user && ['cluster_supervisor','leadership','admin'].includes(me.user.role);
  async function refresh() {
    const r = await HAJJ.authedCall('supplies_list', {});
    if (!r || !r.ok) { document.getElementById('spList').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    const c = r.counts;
    document.getElementById('spTiles').innerHTML =
      '<div class="sp-tile open"><div class="l">Open</div><div class="v">' + (c.open || 0) + '</div></div>' +
      '<div class="sp-tile progress"><div class="l">In progress</div><div class="v">' + (c.in_progress || 0) + '</div></div>' +
      '<div class="sp-tile done"><div class="l">Fulfilled (7d)</div><div class="v">' + (c.fulfilled || 0) + '</div></div>' +
      '<div class="sp-tile"><div class="l">Cancelled</div><div class="v" style="color:#9ca3af;">' + (c.cancelled || 0) + '</div></div>';
    if (!r.requests.length) {
      document.getElementById('spList').innerHTML = '<div style="color:#6b7d9e; padding:14px; text-align:center;">No active requests</div>';
    } else {
      document.getElementById('spList').innerHTML = r.requests.map(function(rq) {
        const actions = canManage && rq.status !== 'fulfilled' && rq.status !== 'cancelled' ? '<div class="actions">' +
          (rq.status === 'open' ? '<button class="progress" data-id="' + rq.id + '" data-st="in_progress">Mark in progress</button>' : '') +
          '<button class="fulfill" data-id="' + rq.id + '" data-st="fulfilled">Fulfill</button>' +
          '<button class="cancel" data-id="' + rq.id + '" data-st="cancelled">Cancel</button>' +
        '</div>' : '';
        return '<div class="sp-req ' + (rq.urgency === 'urgent' ? 'urgent' : 'normal') + '">' +
          '<div class="top"><div><div class="item">' + (rq.item || '--') + ' x' + (rq.quantity || '1') + '</div>' +
          '<div class="meta">' + (rq.station || '--') + ' · ' + (rq.urgency || 'normal') + ' · by ' + (rq.requested_by_name || '?') + ' at ' + new Date(rq.requested_at * 1000).toLocaleTimeString() + '</div></div>' +
          '<span class="status-pill ' + (rq.status || 'open') + '">' + (rq.status || 'open').replace('_', ' ') + '</span></div>' +
          (rq.reason ? '<div class="meta" style="margin-top:4px; color:#cbd5e1;">' + rq.reason + '</div>' : '') +
          (rq.notes ? '<div class="meta" style="margin-top:4px; color:#fcd34d; white-space:pre-wrap;">' + rq.notes + '</div>' : '') +
        actions + '</div>';
      }).join('');
      document.querySelectorAll('[data-id][data-st]').forEach(function(b) {
        b.addEventListener('click', async function() {
          const notes = b.dataset.st === 'fulfilled' ? '' : prompt('Add a note (optional):');
          const rr = await HAJJ.authedCall('supplies_set_status', { id: b.dataset.id, status: b.dataset.st, notes: notes || '' });
          if (rr && rr.ok) refresh();
          else alert('Failed: ' + ((rr && rr.error) || 'unknown'));
        });
      });
    }
  }
  document.getElementById('spSubmit').addEventListener('click', async function() {
    const data = {
      station: document.getElementById('spSt').value,
      item: document.getElementById('spItem').value,
      quantity: document.getElementById('spQty').value || '1',
      urgency: document.getElementById('spUrg').value,
      reason: document.getElementById('spReason').value
    };
    if (!data.station || !data.item) return alert('Station + item required');
    const r = await HAJJ.authedCall('supplies_request', data);
    if (r && r.ok) {
      alert('Request submitted: ' + r.id);
      document.getElementById('spItem').value = '';
      document.getElementById('spQty').value = '';
      document.getElementById('spReason').value = '';
      refresh();
    } else alert('Failed: ' + ((r && r.error) || 'unknown'));
  });
  refresh();
  setInterval(refresh, 15000);
})();
</script></body></html>
