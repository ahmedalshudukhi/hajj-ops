<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.47">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; }
.ms-shell { max-width:1280px; margin:0 auto; padding:20px; }
.ms-app { display:grid; grid-template-columns:300px 1fr; gap:14px; height:calc(100vh - 200px); min-height:560px; }
@media (max-width:800px) { .ms-app { grid-template-columns:1fr; height:auto; } .ms-thread { max-height:420px; } }
.ms-side { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:12px; overflow-y:auto; }
.ms-side h2 { margin:0 0 10px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }
.ms-thread-row { padding:9px 11px; border-radius:8px; cursor:pointer; transition:background 0.15s; margin-bottom:3px; }
.ms-thread-row:hover { background:rgba(99,179,237,0.08); }
.ms-thread-row.active { background:rgba(56,189,248,0.16); }
.ms-thread-row .who { font-weight:600; color:#e7ecf7; font-size:13px; display:flex; justify-content:space-between; }
.ms-thread-row .preview { font-size:11px; color:#93a4cd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.ms-thread-row .badge { background:rgba(239,68,68,0.25); color:#fca5a5; font-size:10px; padding:1px 7px; border-radius:999px; font-weight:700; }
.ms-thread { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
.ms-thread-head { padding:14px 18px; border-bottom:1px solid rgba(99,179,237,0.15); display:flex; justify-content:space-between; align-items:center; }
.ms-thread-head .title { font-size:15px; color:#cdf1ff; font-weight:600; }
.ms-thread-head .sub { font-size:11px; color:#93a4cd; }
.ms-thread-body { flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:8px; }
.ms-bubble { max-width:70%; padding:8px 12px; border-radius:14px; font-size:13px; line-height:1.45; }
.ms-bubble.me { align-self:flex-end; background:rgba(56,189,248,0.18); color:#cdf1ff; border:1px solid rgba(56,189,248,0.3); border-bottom-right-radius:4px; }
.ms-bubble.them { align-self:flex-start; background:rgba(99,179,237,0.10); color:#e7ecf7; border:1px solid rgba(99,179,237,0.2); border-bottom-left-radius:4px; }
.ms-bubble .name { font-size:10px; color:#93a4cd; font-weight:600; margin-bottom:2px; }
.ms-bubble .when { font-size:9px; color:#6b7d9e; margin-top:3px; text-align:right; }
.ms-input { display:flex; gap:8px; padding:12px; border-top:1px solid rgba(99,179,237,0.15); }
.ms-input input { flex:1; padding:11px 14px; border-radius:8px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }
.ms-input button { padding:0 18px; background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:8px; cursor:pointer; font-weight:600; }
.ms-newrow { background:rgba(99,179,237,0.08); padding:10px 12px; border-radius:8px; margin-bottom:8px; cursor:pointer; text-align:center; color:#cdf1ff; font-size:12px; font-weight:600; }
.ms-newrow:hover { background:rgba(99,179,237,0.15); }
.ms-empty { color:#6b7d9e; padding:60px 30px; text-align:center; font-style:italic; }
.ms-newmodal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center; padding:20px; }
.ms-newmodal.visible { display:flex; }
.ms-newmodal .box { background:linear-gradient(135deg,#0f1830,#06101e); border:1px solid rgba(99,179,237,0.25); border-radius:14px; padding:22px 26px; max-width:480px; width:100%; }
</style>
</head><body>
<div id="topbar"></div>
<div class="ms-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Messages</h1>
  <p style="color:#93a4cd; margin:0 0 14px;">Direct messages and channels.</p>

  <div class="ms-app">
    <div class="ms-side">
      <div class="ms-newrow" onclick="document.getElementById('msNewModal').classList.add('visible')">+ New conversation</div>
      <h2>Channels</h2>
      <div id="msChannels"></div>
      <h2 style="margin-top:14px;">Direct messages</h2>
      <div id="msDms"></div>
    </div>
    <div class="ms-thread" id="msThread">
      <div class="ms-thread-head">
        <div class="title" id="mtTitle">No thread selected</div>
        <div class="sub" id="mtSub"></div>
      </div>
      <div class="ms-thread-body" id="mtBody"><div class="ms-empty">Pick a conversation</div></div>
      <div class="ms-input"><input type="text" id="mtInput" placeholder="Type a message and press Enter..." disabled /><button id="mtSend" disabled>Send</button></div>
    </div>
  </div>
</div>

<div class="ms-newmodal" id="msNewModal">
  <div class="box">
    <h2 style="margin:0 0 10px;">New conversation</h2>
    <label style="font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase;">DM (recipient NID)</label>
    <input type="text" id="newDmNid" placeholder="recipient national ID" style="width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); margin-top:5px;" />
    <button onclick="window.cadMsgStartDM()" style="margin-top:10px; padding:10px 16px; background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:7px; cursor:pointer;">Start DM</button>
    <div style="border-top:1px solid rgba(99,179,237,0.15); margin:14px 0; padding-top:14px;">
      <label style="font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase;">Or join a channel</label>
      <div style="display:flex; gap:8px; margin-top:5px; flex-wrap:wrap;">
        <button onclick="window.cadMsgJoin('ops')" style="padding:8px 14px; background:rgba(99,179,237,0.13); border:1px solid rgba(99,179,237,0.3); color:#cdf1ff; border-radius:6px; cursor:pointer;">#ops</button>
        <button onclick="window.cadMsgJoin('clinical')" style="padding:8px 14px; background:rgba(99,179,237,0.13); border:1px solid rgba(99,179,237,0.3); color:#cdf1ff; border-radius:6px; cursor:pointer;">#clinical</button>
        <button onclick="window.cadMsgJoin('dispatch')" style="padding:8px 14px; background:rgba(99,179,237,0.13); border:1px solid rgba(99,179,237,0.3); color:#cdf1ff; border-radius:6px; cursor:pointer;">#dispatch</button>
        <button onclick="window.cadMsgJoin('arafat')" style="padding:8px 14px; background:rgba(99,179,237,0.13); border:1px solid rgba(99,179,237,0.3); color:#cdf1ff; border-radius:6px; cursor:pointer;">#arafat</button>
        <button onclick="window.cadMsgJoin('mina')" style="padding:8px 14px; background:rgba(99,179,237,0.13); border:1px solid rgba(99,179,237,0.3); color:#cdf1ff; border-radius:6px; cursor:pointer;">#mina</button>
        <button onclick="window.cadMsgJoin('muzdalifah')" style="padding:8px 14px; background:rgba(99,179,237,0.13); border:1px solid rgba(99,179,237,0.3); color:#cdf1ff; border-radius:6px; cursor:pointer;">#muzdalifah</button>
      </div>
    </div>
    <button onclick="document.getElementById('msNewModal').classList.remove('visible')" style="margin-top:12px; padding:8px; width:100%; background:transparent; border:1px solid rgba(99,179,237,0.2); color:#94a3b8; border-radius:7px; cursor:pointer;">Close</button>
  </div>
</div>

<script src="assets/auth.js?v=0.2.47"></script>
<script src="assets/shortcuts.js?v=0.2.47"></script>
<script src="assets/voice.js?v=0.2.47"></script>
<script src="assets/topbar.js?v=0.2.47"></script>
<script src="assets/version.js?v=0.2.47"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Messages" });
  const me = await HAJJ.whoami();
  const myNid = me && me.user && me.user.nid;

  let activeThread = null;

  async function refreshThreads() {
    const r = await HAJJ.authedCall('messages_threads', {});
    const channels = [];
    const dms = [];
    if (r && r.ok && r.threads) {
      r.threads.forEach(t => {
        if (t.thread_key.startsWith('ch:')) channels.push(t);
        else dms.push(t);
      });
    }
    document.getElementById('msChannels').innerHTML = channels.length ? channels.map(t => renderRow(t)).join('') : '<div style="color:#6b7d9e; font-size:12px; padding:6px 11px;">No channels yet</div>';
    document.getElementById('msDms').innerHTML = dms.length ? dms.map(t => renderRow(t)).join('') : '<div style="color:#6b7d9e; font-size:12px; padding:6px 11px;">No DMs yet</div>';
    document.querySelectorAll('.ms-thread-row').forEach(row => {
      row.addEventListener('click', () => openThread(row.dataset.tk, row.dataset.label));
      row.classList.toggle('active', row.dataset.tk === activeThread);
    });
  }

  function renderRow(t) {
    let label, who;
    if (t.thread_key.startsWith('ch:')) {
      label = '#' + t.thread_key.replace('ch:', '');
      who = t.from_name || 'someone';
    } else {
      // DM: show the OTHER party's name
      const otherName = (t.from_nid === myNid ? t.to_name : t.from_name) || (t.from_nid === myNid ? t.to_nid : t.from_nid) || 'unknown';
      label = otherName;
      who = '';
    }
    const time = t.ts ? new Date(t.ts * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    const unread = t.unread > 0 ? `<span class="badge">${t.unread}</span>` : '';
    return `<div class="ms-thread-row" data-tk="${t.thread_key}" data-label="${label.replace(/"/g, '&quot;')}">
      <div class="who"><span>${label}</span>${unread}</div>
      <div class="preview">${(who ? who + ': ' : '') + ((t.body || '').slice(0, 50))}</div>
      <div style="font-size:9px; color:#6b7d9e; margin-top:3px;">${time}</div>
    </div>`;
  }

  async function openThread(tk, label) {
    activeThread = tk;
    document.getElementById('mtTitle').textContent = label;
    document.getElementById('mtSub').textContent = tk;
    document.getElementById('mtInput').disabled = false;
    document.getElementById('mtSend').disabled = false;
    document.querySelectorAll('.ms-thread-row').forEach(r => r.classList.toggle('active', r.dataset.tk === tk));
    await refreshThread();
  }

  async function refreshThread() {
    if (!activeThread) return;
    const r = await HAJJ.authedCall('messages_list', { thread_key: activeThread });
    const body = document.getElementById('mtBody');
    if (!r || !r.ok) { body.innerHTML = '<div class="ms-empty">Error loading</div>'; return; }
    if (!r.messages.length) { body.innerHTML = '<div class="ms-empty">No messages — say hi!</div>'; return; }
    body.innerHTML = r.messages.map(m => {
      const isMe = m.from_nid === myNid;
      const time = new Date(m.ts * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      return `<div class="ms-bubble ${isMe ? 'me' : 'them'}">
        ${isMe ? '' : '<div class="name">' + (m.from_name || m.from_nid) + '</div>'}
        ${(m.body || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}
        <div class="when">${time}</div>
      </div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('mtInput');
    const body = input.value.trim();
    if (!body || !activeThread) return;
    input.value = '';
    let to_nid = '', channel = 'dm';
    if (activeThread.startsWith('dm:')) {
      const parts = activeThread.split(':');
      to_nid = parts[1] === myNid ? parts[2] : parts[1];
    } else if (activeThread.startsWith('ch:')) {
      channel = activeThread.replace('ch:', '');
    }
    await HAJJ.authedCall('messages_send', { to_nid, channel, body });
    await refreshThread();
    refreshThreads();
  }

  document.getElementById('mtInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
  document.getElementById('mtSend').addEventListener('click', sendMessage);

  window.cadMsgStartDM = async () => {
    const nid = document.getElementById('newDmNid').value.trim();
    if (!nid) return alert('Enter recipient NID');
    const a = [myNid, nid].sort();
    const tk = 'dm:' + a[0] + ':' + a[1];
    document.getElementById('msNewModal').classList.remove('visible');
    document.getElementById('newDmNid').value = '';
    openThread(tk, 'DM with ' + nid);
  };
  window.cadMsgJoin = (channel) => {
    document.getElementById('msNewModal').classList.remove('visible');
    openThread('ch:' + channel, '#' + channel);
  };

  refreshThreads();
  setInterval(() => { refreshThreads(); refreshThread(); }, 12000);
})();
</script>
</body></html>
