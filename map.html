<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map</title><link rel="stylesheet" href="assets/style.css?v=0.2.40"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.mp-shell { max-width:1280px; margin:0 auto; padding:20px; }.mp-grid { display:grid; grid-template-columns:1fr 340px; gap:14px; margin-top:14px; }@media (max-width:900px) { .mp-grid { grid-template-columns:1fr; } }.mp-canvas { background:linear-gradient(135deg,rgba(20,28,50,0.6),rgba(8,14,28,0.7)); border:1px solid rgba(99,179,237,0.18); border-radius:14px; padding:18px; }.mp-side { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:14px; padding:16px 18px; }.mp-side h3 { margin:0 0 8px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }.mp-detail-row { padding:8px 0; border-bottom:1px solid rgba(99,179,237,0.08); display:flex; justify-content:space-between; font-size:13px; }.mp-detail-row .lbl { color:#93a4cd; } .mp-detail-row .val { color:#e7ecf7; font-weight:600; text-align:right; }.mp-cluster-zone { opacity:0.13; }.mp-cluster-label { font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; }.mp-track { stroke:url(#trackGrad); stroke-width:4; fill:none; }.mp-station { cursor:pointer; transition:filter 0.2s; }.mp-station:hover { filter:brightness(1.4); }.mp-station-c { fill:#1e293b; stroke:#475569; stroke-width:2.5; }.mp-station.has-load .mp-station-c { stroke:#22c55e; }.mp-station.surge .mp-station-c { stroke:#f59e0b; }.mp-station.critical .mp-station-c { stroke:#ef4444; }.mp-station-lbl { fill:#cbd5e1; font-size:11px; font-weight:600; text-anchor:middle; pointer-events:none; }.mp-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:11px; color:#93a4cd; }.mp-legend .sw { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:middle; margin-right:5px; }</style></head><body><div id="topbar"></div><div class="mp-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Station Map</h1><p style="color:#93a4cd; margin:0 0 4px;">Geographic view of the Southern Line stations with live incident load.</p><div class="mp-grid"><div class="mp-canvas"><svg viewBox="0 0 900 480" style="width:100%; height:auto;"><defs><linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#67e8f9" /><stop offset="50%" stop-color="#c4b5fd" /><stop offset="100%" stop-color="#f9a8d4" /></linearGradient></defs><rect class="mp-cluster-zone" x="60" y="60" width="240" height="360" rx="20" fill="#67e8f9" /><rect class="mp-cluster-zone" x="320" y="60" width="240" height="360" rx="20" fill="#c4b5fd" /><rect class="mp-cluster-zone" x="580" y="60" width="260" height="360" rx="20" fill="#f9a8d4" /><text class="mp-cluster-label" x="180" y="50" fill="#67e8f9" text-anchor="middle">Arafat</text><text class="mp-cluster-label" x="440" y="50" fill="#c4b5fd" text-anchor="middle">Muzdalifah</text><text class="mp-cluster-label" x="710" y="50" fill="#f9a8d4" text-anchor="middle">Mina</text><path class="mp-track" d="M 80 240 Q 200 180, 280 240 T 540 240 T 820 240" /><g class="mp-station" data-station="ARF1" transform="translate(120,200)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">ARF1</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="ARF2" transform="translate(180,280)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">ARF2</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="ARF3" transform="translate(260,350)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">ARF3</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="MUZ1" transform="translate(370,220)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">MUZ1</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="MUZ2" transform="translate(440,280)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">MUZ2</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="MUZ3" transform="translate(520,340)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">MUZ3</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="MIN1" transform="translate(640,200)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">MIN1</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="MIN2" transform="translate(720,270)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">MIN2</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g><g class="mp-station" data-station="MIN3" transform="translate(800,350)"><circle class="mp-station-c" r="26"/><text class="mp-station-lbl" y="5">MIN3</text><circle class="mp-load-bg" cx="20" cy="-22" r="11" fill="#0a0e1a" style="display:none"/><text class="mp-load" x="20" y="-19" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" style="display:none"></text></g></svg><div class="mp-legend"><span><span class="sw" style="background:transparent; box-shadow:0 0 0 2px #475569;"></span>No incidents</span><span><span class="sw" style="background:transparent; box-shadow:0 0 0 2px #22c55e;"></span>Active 1-2</span><span><span class="sw" style="background:transparent; box-shadow:0 0 0 2px #f59e0b;"></span>Surge 3-4</span><span><span class="sw" style="background:transparent; box-shadow:0 0 0 2px #ef4444;"></span>Critical 5+</span></div></div><div class="mp-side"><h3>Selected Station</h3><div id="mpDetail"><div style="color:#6b7d9e; padding:10px;">Click a station on the map for details.</div></div></div></div></div><script src="assets/auth.js?v=0.2.40"></script><script src="assets/shortcuts.js?v=0.2.40"></script><script src="assets/topbar.js?v=0.2.40"></script><script src="assets/version.js?v=0.2.40"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Map" });
  let lastSummary = null, lastDirectory = null;

  async function refresh() {
    const [s, d] = await Promise.all([
      HAJJ.authedCall('command_summary', {}),
      HAJJ.authedCall('station_directory', {})
    ]);
    if (s && s.ok) lastSummary = s;
    if (d && d.ok) lastDirectory = d.stations;
    if (!lastSummary) return;
    const stByCode = {};
    (lastSummary.stations || []).forEach(function(st) { stByCode[st.code] = st; });
    document.querySelectorAll('.mp-station').forEach(function(node) {
      const code = node.dataset.station;
      const data = stByCode[code] || {};
      const load = data.live_open || 0;
      node.classList.toggle('has-load', load >= 1 && load < 3);
      node.classList.toggle('surge', load >= 3 && load < 5);
      node.classList.toggle('critical', load >= 5);
      const bg = node.querySelector('.mp-load-bg');
      const txt = node.querySelector('.mp-load');
      if (load > 0) { bg.style.display = ''; txt.style.display = ''; txt.textContent = load; }
      else { bg.style.display = 'none'; txt.style.display = 'none'; }
    });
  }

  document.querySelectorAll('.mp-station').forEach(function(node) {
    node.addEventListener('click', function() {
      const code = node.dataset.station;
      const info = (lastSummary && lastSummary.stations || []).find(function(s){return s.code === code;}) || {};
      const dirInfo = (lastDirectory || []).find(function(s){return s.code === code;}) || {};
      const load = info.live_open || 0;
      const loadColor = load >= 5 ? '#fca5a5' : load >= 3 ? '#fcd34d' : '#86efac';
      document.getElementById('mpDetail').innerHTML =
        '<div class="mp-detail-row"><span class="lbl">Code</span><span class="val">' + code + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Name</span><span class="val">' + (dirInfo.name || '') + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Arabic</span><span class="val" style="direction:rtl;">' + (dirInfo.name_ar || '') + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Cluster</span><span class="val">' + (dirInfo.cluster || '') + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Live open</span><span class="val" style="color:' + loadColor + '">' + load + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Status</span><span class="val">' + (info.status || '—') + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Radio</span><span class="val">' + (dirInfo.radio || '') + '</span></div>' +
        '<div class="mp-detail-row"><span class="lbl">Helipad</span><span class="val">' + (dirInfo.has_helipad ? 'Yes' : 'No') + '</span></div>' +
        '<div style="margin-top:14px; display:flex; gap:6px; flex-wrap:wrap;">' +
          '<a href="/dispatch?station=' + code + '" style="padding:6px 12px; background:rgba(56,189,248,0.18); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:6px; text-decoration:none; font-size:12px;">Dispatches</a>' +
          '<a href="/incidents?station=' + code + '" style="padding:6px 12px; background:rgba(99,179,237,0.13); color:#cdf1ff; border:1px solid rgba(99,179,237,0.3); border-radius:6px; text-decoration:none; font-size:12px;">History</a>' +
        '</div>';
    });
  });

  refresh();
  setInterval(refresh, 8000);
})();
</script></body></html>
