<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospitals · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.35">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; }
.hp-shell { max-width:1280px; margin:0 auto; padding:20px; }
.hp-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px; margin-top:14px; }
.hp-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:16px 18px; transition:transform 0.15s; }
.hp-card.normal { border-left:4px solid #22c55e; }
.hp-card.busy { border-left:4px solid #f59e0b; }
.hp-card.divert { border-left:4px solid #ef4444; }
.hp-card.closed { border-left:4px solid #6b7280; }
.hp-card h3 { margin:0 0 4px; font-size:16px; color:#cdf1ff; }
.hp-card .ar { font-size:13px; color:#93a4cd; direction:rtl; text-align:right; margin-bottom:6px; }
.hp-card .meta { font-size:11px; color:#93a4cd; margin-bottom:10px; }
.hp-card .status-row { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:8px; background:rgba(15,23,42,0.5); margin:8px 0; }
.hp-card .status-row .label { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }
.hp-card .status-row .badge { padding:3px 10px; border-radius:5px; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
.hp-card.normal .badge { background:rgba(34,197,94,0.18); color:#86efac; }
.hp-card.busy .badge { background:rgba(245,158,11,0.18); color:#fcd34d; }
.hp-card.divert .badge { background:rgba(239,68,68,0.22); color:#fca5a5; }
.hp-card.closed .badge { background:rgba(107,114,128,0.18); color:#9ca3af; }
.hp-card .caps { font-size:11px; color:#cbd5e1; padding:6px 0; }
.hp-card .caps span { display:inline-block; padding:1px 7px; background:rgba(99,179,237,0.13); border-radius:4px; margin:1px 3px 1px 0; color:#bfdbfe; font-size:10px; }
.hp-card .info { display:flex; gap:10px; flex-wrap:wrap; font-size:10px; color:#93a4cd; padding:4px 0; }
.hp-card .info strong { color:#cdf1ff; }
.hp-card button.set-status { background:rgba(99,179,237,0.13); color:#cdf1ff; border:1px solid rgba(99,179,237,0.3); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:11px; margin-top:6px; }
.hp-card button.set-status:hover { background:rgba(99,179,237,0.22); }
.hp-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center; padding:20px; }
.hp-modal.visible { display:flex; }
.hp-modal .box { background:linear-gradient(135deg,#0f1830,#06101e); border:1px solid rgba(99,179,237,0.25); border-radius:14px; padding:22px 26px; max-width:480px; width:100%; }
.hp-modal label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:12px 0 5px; }
.hp-modal select, .hp-modal input { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }
.hp-modal .btnrow { display:flex; gap:10px; margin-top:16px; }
.hp-modal .btnrow button { flex:1; padding:10px; border-radius:7px; cursor:pointer; font-weight:600; }
.hp-modal .save { background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); }
.hp-modal .cancel { background:transparent; color:#94a3b8; border:1px solid rgba(99,179,237,0.2); }
</style>
</head><body>
<div id="topbar"></div>
<div class="hp-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Hospital Directory</h1>
  <p style="color:#93a4cd; margin:0 0 4px;">Receiving facilities with live ED status. Updated by OCC dispatchers.</p>
  <div id="hpGrid" class="hp-grid"></div>
</div>

<div class="hp-modal" id="hpModal">
  <div class="box">
    <h2 id="hmTitle" style="margin:0 0 4px;">Set ED status</h2>
    <div id="hmSubtitle" style="color:#93a4cd; font-size:12px;"></div>
    <label>Status</label>
    <select id="hmStatus">
      <option value="normal">Normal</option>
      <option value="busy">Busy</option>
      <option value="divert">Divert (don't bring new)</option>
      <option value="closed">Closed</option>
    </select>
    <label>Capacity %</label>
    <input type="number" id="hmCap" min="0" max="100" placeholder="0-100" />
    <label>Note (optional)</label>
    <input type="text" id="hmNote" placeholder="e.g. trauma bay full, divert until 19:00" />
    <div class="btnrow">
      <button class="cancel" onclick="document.getElementById('hpModal').classList.remove('visible')">Cancel</button>
      <button class="save" id="hmSave">Update</button>
    </div>
  </div>
</div>

<script src="assets/auth.js?v=0.2.35"></script>
<script src="assets/shortcuts.js?v=0.2.35"></script>
<script src="assets/topbar.js?v=0.2.35"></script>
<script src="assets/version.js?v=0.2.35"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Hospitals" });

  // Permission to set status (subset of roles)
  const me = await HAJJ.whoami();
  const canSet = me && me.user && ['leadership','admin','dispatcher'].includes(me.user.role);

  async function refresh() {
    const r = await HAJJ.authedCall('hospitals_list', {});
    if (!r || !r.ok) { document.getElementById('hpGrid').innerHTML = '<div style="color:#6b7d9e; padding:30px;">Error</div>'; return; }
    document.getElementById('hpGrid').innerHTML = (r.hospitals || []).map(h => {
      const cap = h.ed_capacity_pct || 0;
      const updated = h.ed_status_ts ? new Date(h.ed_status_ts*1000).toLocaleString() : '—';
      return `<div class="hp-card ${h.ed_status||'normal'}">
        <h3>${h.name}</h3>
        ${h.name_ar ? '<div class="ar">' + h.name_ar + '</div>' : ''}
        <div class="meta">${h.city||''} · ${h.address||''}</div>
        <div class="status-row">
          <span class="label">ED Status</span>
          <span class="badge">${(h.ed_status||'normal')} · ${cap}%</span>
        </div>
        ${h.ed_note ? '<div style="font-size:11px; color:#fcd34d; padding:6px 12px; background:rgba(245,158,11,0.10); border-radius:6px; margin-bottom:6px;">📌 '+h.ed_note+'</div>' : ''}
        <div class="caps">${(h.capabilities||'').split(',').map(c => '<span>' + c.trim() + '</span>').join('')}</div>
        <div class="info">
          <span><strong>Phone:</strong> ${h.phone||'—'}</span>
          <span><strong>Radio:</strong> ${h.radio_channel||'—'}</span>
          ${h.helipad ? '<span><strong>🚁 Helipad</strong></span>' : ''}
          <span><strong>Updated:</strong> ${updated} ${h.ed_status_by ? 'by '+h.ed_status_by : ''}</span>
        </div>
        ${canSet ? `<button class="set-status" onclick="window.cadHpSetStatus('${h.id}','${h.name.replace(/'/g, "\\'")}')">Update ED status</button>` : ''}
      </div>`;
    }).join('');
  }

  window.cadHpSetStatus = (id, name) => {
    document.getElementById('hmTitle').textContent = 'Update — ' + name;
    document.getElementById('hmSubtitle').textContent = id;
    document.getElementById('hmSave').dataset.id = id;
    document.getElementById('hpModal').classList.add('visible');
  };

  document.getElementById('hmSave').addEventListener('click', async () => {
    const id = document.getElementById('hmSave').dataset.id;
    const status = document.getElementById('hmStatus').value;
    const ed_capacity_pct = document.getElementById('hmCap').value;
    const note = document.getElementById('hmNote').value;
    const r = await HAJJ.authedCall('hospital_set_status', { id, status, ed_capacity_pct, note });
    if (r && r.ok) { document.getElementById('hpModal').classList.remove('visible'); refresh(); }
    else alert('Update failed: ' + ((r && r.error)||'unknown'));
  });

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body></html>
