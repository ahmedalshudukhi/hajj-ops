<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heat Watch</title><link rel="stylesheet" href="assets/style.css?v=0.2.43"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.ht-shell { max-width:1280px; margin:0 auto; padding:20px; }.ht-banner { border-radius:14px; padding:24px 28px; margin:14px 0; }.ht-banner.low { background:linear-gradient(135deg,rgba(34,197,94,0.15),rgba(22,163,74,0.10)); border:1px solid rgba(34,197,94,0.4); }.ht-banner.moderate { background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(217,119,6,0.10)); border:1px solid rgba(245,158,11,0.4); }.ht-banner.high { background:linear-gradient(135deg,rgba(239,68,68,0.20),rgba(220,38,38,0.12)); border:2px solid rgba(239,68,68,0.45); }.ht-banner.extreme { background:linear-gradient(135deg,rgba(139,0,0,0.30),rgba(220,38,38,0.18)); border:2px solid rgba(220,38,38,0.6); animation:flash 2s infinite; }@keyframes flash { 0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,0.5); } 50% { box-shadow:0 0 0 14px rgba(220,38,38,0); } }.ht-banner h2 { margin:0; font-size:26px; }.ht-banner.low h2 { color:#86efac; } .ht-banner.moderate h2 { color:#fcd34d; } .ht-banner.high h2, .ht-banner.extreme h2 { color:#fca5a5; }.ht-banner .level { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; margin-bottom:6px; opacity:0.7; }.ht-banner .rec { font-size:14px; color:#e8f1ff; margin-top:10px; line-height:1.5; }.ht-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }@media (max-width:900px) { .ht-grid { grid-template-columns:1fr; } }.ht-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 22px; }.ht-card h3 { margin:0 0 12px; font-size:13px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.ht-stat { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(99,179,237,0.06); }.ht-stat .l { color:#93a4cd; font-size:13px; }.ht-stat .v { color:#e8f1ff; font-weight:700; font-variant-numeric:tabular-nums; }.ht-row { padding:10px 14px; background:rgba(15,23,42,0.5); border-radius:7px; margin-bottom:6px; display:grid; grid-template-columns:80px 70px 1fr 80px; gap:10px; align-items:center; font-size:12px; }.ht-row .t { color:#67e8f9; font-family:ui-monospace,Menlo,monospace; }.ht-row .badge { padding:2px 7px; border-radius:4px; font-size:10px; font-weight:700; text-align:center; text-transform:uppercase; }.ht-row .badge.red { background:rgba(239,68,68,0.20); color:#fca5a5; }.ht-row .badge.yellow { background:rgba(245,158,11,0.18); color:#fcd34d; }.ht-row .badge.green { background:rgba(34,197,94,0.18); color:#86efac; }.ht-row .complaint { color:#cbd5e1; }.ht-station-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }.ht-st-cell { padding:12px 10px; background:rgba(15,23,42,0.5); border-radius:8px; text-align:center; border:1px solid rgba(99,179,237,0.12); }.ht-st-cell.heat .num { color:#fcd34d; }.ht-st-cell .lbl { font-size:11px; color:#93a4cd; }.ht-st-cell .num { font-size:24px; font-weight:800; color:#e8f1ff; margin-top:3px; font-variant-numeric:tabular-nums; }</style></head><body><div id="topbar"></div><div class="ht-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Heat Watch</h1><p style="color:#93a4cd; margin:0 0 4px;">Real-time heat illness risk + active heat-related incidents. Auto-updates every 30s.</p><div id="htBanner" class="ht-banner low"><div class="level" id="htLevel">--</div><h2 id="htTitle">Loading weather...</h2><div class="rec" id="htRec"></div></div><div class="ht-grid"><div class="ht-card"><h3>Mecca Weather (live)</h3><div id="htWeather"><div style="color:#6b7d9e;">Loading...</div></div></div><div class="ht-card"><h3>Heat Incidents by Station (last 6h)</h3><div class="ht-station-grid" id="htStations"><div style="color:#6b7d9e; padding:14px;">Loading...</div></div></div></div><div class="ht-card" style="margin-top:14px;"><h3>Recent Heat-Related Incidents (last 6h)</h3><div id="htRecent"><div style="color:#6b7d9e; padding:14px;">Loading...</div></div></div></div><script src="assets/auth.js?v=0.2.43"></script><script src="assets/shortcuts.js?v=0.2.43"></script><script src="assets/topbar.js?v=0.2.43"></script><script src="assets/version.js?v=0.2.43"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Heat Watch" });
  async function refresh() {
    const r = await HAJJ.authedCall('heat_watch', {});
    if (!r || !r.ok) { document.getElementById('htBanner').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    const banner = document.getElementById('htBanner');
    banner.className = 'ht-banner ' + r.risk_level;
    document.getElementById('htLevel').textContent = 'Heat risk: ' + r.risk_level;
    const w = r.weather || {};
    const tempStr = w.temperature != null ? w.temperature.toFixed(1) + '°C' : 'no data';
    const hiStr = w.heat_index != null ? w.heat_index.toFixed(0) + '°C HI' : '';
    document.getElementById('htTitle').textContent = r.risk_level.toUpperCase() + ' · ' + tempStr + (hiStr ? ' · ' + hiStr : '');
    document.getElementById('htRec').textContent = r.recommendation;
    document.getElementById('htWeather').innerHTML =
      '<div class="ht-stat"><span class="l">Temperature</span><span class="v">' + (w.temperature != null ? w.temperature.toFixed(1) + '°C' : '--') + '</span></div>' +
      '<div class="ht-stat"><span class="l">Heat index</span><span class="v">' + (w.heat_index != null ? w.heat_index.toFixed(0) + '°C' : '--') + '</span></div>' +
      '<div class="ht-stat"><span class="l">Humidity</span><span class="v">' + (w.humidity != null ? w.humidity + '%' : '--') + '</span></div>' +
      '<div class="ht-stat"><span class="l">Wind</span><span class="v">' + (w.wind != null ? w.wind + ' km/h' : '--') + '</span></div>' +
      '<div class="ht-stat"><span class="l">Heat incidents (6h)</span><span class="v" style="color:#fcd34d;">' + r.heat_incidents_6h + '</span></div>';
    const stations = ['ARF1','ARF2','ARF3','MUZ1','MUZ2','MUZ3','MIN1','MIN2','MIN3'];
    document.getElementById('htStations').innerHTML = stations.map(function(s) {
      const n = r.by_station[s] || 0;
      return '<div class="ht-st-cell ' + (n > 0 ? 'heat' : '') + '"><div class="lbl">' + s + '</div><div class="num">' + n + '</div></div>';
    }).join('');
    if (!r.recent.length) {
      document.getElementById('htRecent').innerHTML = '<div style="color:#6b7d9e; padding:14px; text-align:center;">No heat-related incidents</div>';
    } else {
      document.getElementById('htRecent').innerHTML = r.recent.map(function(h) {
        return '<div class="ht-row">' +
          '<span class="t">' + new Date(h.ts * 1000).toLocaleTimeString() + '</span>' +
          '<span><span class="badge ' + (h.triage || 'green') + '">' + (h.triage || '--').toUpperCase() + '</span></span>' +
          '<span class="complaint">' + (h.complaint || '--').slice(0, 80) + '</span>' +
          '<span style="color:#93a4cd; text-align:right;">' + (h.station || '--') + '</span>' +
        '</div>';
      }).join('');
    }
  }
  refresh();
  setInterval(refresh, 30000);
})();
</script></body></html>
