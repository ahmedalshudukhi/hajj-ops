<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Translator</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.46">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }
.tr-shell { max-width:1100px; margin:0 auto; padding:20px; }
.tr-controls { background:rgba(20,28,50,0.6); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:14px 18px; display:flex; gap:14px; flex-wrap:wrap; align-items:end; margin:12px 0 18px; }
.tr-controls label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:5px; }
.tr-controls select, .tr-controls input { padding:10px 14px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }
.tr-cards { display:flex; flex-direction:column; gap:10px; }
.tr-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:16px 20px; }
.tr-en { font-size:16px; font-weight:600; color:#cdf1ff; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.tr-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
.tr-lang { background:rgba(15,23,42,0.5); padding:10px 12px; border-radius:7px; border:1px solid rgba(99,179,237,0.10); }
.tr-lang .code { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; margin-bottom:4px; }
.tr-lang .text { font-size:14px; line-height:1.5; min-height:42px; }
.tr-lang.rtl .text { direction:rtl; text-align:right; }
.tr-lang button { margin-top:6px; background:rgba(168,85,247,0.16); color:#d8b4fe; border:1px solid rgba(168,85,247,0.3); padding:3px 8px; border-radius:5px; font-size:10px; cursor:pointer; }
.tr-cat-pill { display:inline-block; padding:2px 8px; background:rgba(99,179,237,0.13); color:#cdf1ff; border-radius:4px; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; }
</style></head><body>
<div id="topbar"></div>
<div class="tr-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Pilgrim Translator</h1>
  <p style="color:#93a4cd; margin:0 0 4px;">Common medical phrases in 7 pilgrim languages. Speakers use browser text-to-speech.</p>
  <div class="tr-controls"><div><label>Category</label><select id="trCat"><option value="">All</option><option value="assessment">Assessment</option><option value="airway">Airway/Breathing</option><option value="history">History</option><option value="treatment">Treatment</option><option value="reassurance">Reassurance</option><option value="intro">Introduction</option><option value="ident">Identification</option><option value="guidance">Guidance</option><option value="comms">Communication</option><option value="social">Social/Family</option></select></div>
  <div style="flex:1; min-width:200px;"><label>Search</label><input type="text" id="trSearch" placeholder="e.g. pain, breathe, allergy" /></div></div>
  <div id="trCards" class="tr-cards"><div style="color:#6b7d9e; padding:30px;">Loading...</div></div>
</div>
<script src="assets/auth.js?v=0.2.46"></script>
<script src="assets/shortcuts.js?v=0.2.46"></script>
<script src="assets/topbar.js?v=0.2.46"></script>
<script src="assets/version.js?v=0.2.46"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Translator" });
  const LANGS = [
    { code:'ar', label:'Arabic', ttsLang:'ar-SA', rtl:true },
    { code:'id', label:'Indonesian', ttsLang:'id-ID', rtl:false },
    { code:'ur', label:'Urdu', ttsLang:'ur-PK', rtl:true },
    { code:'tr', label:'Turkish', ttsLang:'tr-TR', rtl:false },
    { code:'fa', label:'Persian', ttsLang:'fa-IR', rtl:true },
    { code:'fr', label:'French', ttsLang:'fr-FR', rtl:false }
  ];
  let allPhrases = [];
  window.cadTrSpeak = function(text, ttsLang) {
    if (!('speechSynthesis' in window)) { alert('Speech synthesis not supported'); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = ttsLang; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  function render() {
    const cat = document.getElementById('trCat').value;
    const q = (document.getElementById('trSearch').value || '').toLowerCase().trim();
    let filtered = allPhrases;
    if (cat) filtered = filtered.filter(function(p) { return p.category === cat; });
    if (q) filtered = filtered.filter(function(p) { return p.en.toLowerCase().includes(q); });
    if (!filtered.length) {
      document.getElementById('trCards').innerHTML = '<div style="color:#6b7d9e; padding:30px; text-align:center;">No matches</div>';
      return;
    }
    document.getElementById('trCards').innerHTML = filtered.map(function(p) {
      const enq = JSON.stringify(p.en).replace(/"/g, '&quot;');
      let html = '<div class="tr-card"><div class="tr-en"><span>' + p.en + ' <span class="tr-cat-pill">' + p.category + '</span></span>';
      html += '<button onclick="window.cadTrSpeak(' + enq + ', \'en-US\')" style="background:rgba(99,179,237,0.13); color:#cdf1ff; border:1px solid rgba(99,179,237,0.3); padding:3px 10px; border-radius:5px; font-size:11px; cursor:pointer;">🔊 EN</button></div>';
      html += '<div class="tr-grid">';
      LANGS.forEach(function(l) {
        const langText = p[l.code] || '';
        const langq = JSON.stringify(langText).replace(/"/g, '&quot;');
        html += '<div class="tr-lang ' + (l.rtl ? 'rtl' : '') + '"><div class="code">' + l.label + '</div><div class="text">' + (langText || '—') + '</div>';
        if (langText) html += '<button onclick="window.cadTrSpeak(' + langq + ', \'' + l.ttsLang + '\')">🔊 Speak</button>';
        html += '</div>';
      });
      html += '</div></div>';
      return html;
    }).join('');
  }
  const r = await HAJJ.authedCall('translator_phrases', {});
  if (!r || !r.ok) { document.getElementById('trCards').innerHTML = '<div style="color:#fca5a5; padding:30px;">Error: ' + (r && r.error || 'unknown') + '</div>'; return; }
  allPhrases = r.phrases;
  render();
  document.getElementById('trCat').addEventListener('change', render);
  document.getElementById('trSearch').addEventListener('input', render);
})();
</script></body></html>
