<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.41">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; }
.an-shell { max-width:1100px; margin:0 auto; padding:20px; }
.an-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
@media (max-width:800px) { .an-grid { grid-template-columns:1fr; } }
.an-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 20px; }
.an-card h2 { margin:0 0 10px; font-size:14px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }
.an-tmpl { background:rgba(15,23,42,0.5); border:1px solid rgba(99,179,237,0.13); border-radius:8px; padding:10px 14px; cursor:pointer; transition:background 0.12s; margin-bottom:6px; }
.an-tmpl:hover { background:rgba(99,179,237,0.08); }
.an-tmpl .lbl { display:flex; justify-content:space-between; align-items:center; }
.an-tmpl .lbl .name { font-weight:600; color:#e7ecf7; font-size:13px; }
.an-tmpl .lbl .badge { font-size:10px; padding:2px 8px; border-radius:4px; font-weight:700; }
.an-tmpl .badge.info { background:rgba(96,165,250,0.18); color:#bfdbfe; }
.an-tmpl .badge.warn { background:rgba(245,158,11,0.18); color:#fcd34d; }
.an-tmpl .badge.critical { background:rgba(239,68,68,0.22); color:#fca5a5; }
.an-tmpl .preview { font-size:12px; color:#93a4cd; margin-top:5px; }
.an-form label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:12px 0 5px; }
.an-form select, .an-form input, .an-form textarea { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; font-family:inherit; }
.an-form textarea { min-height:100px; resize:vertical; }
.an-form button { padding:11px 18px; background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:7px; cursor:pointer; font-weight:600; margin-top:14px; }
.an-recent { display:flex; flex-direction:column; gap:8px; max-height:400px; overflow-y:auto; }
.an-recent .row { background:rgba(15,23,42,0.5); border-left:3px solid #94a3b8; padding:9px 12px; border-radius:6px; }
.an-recent .row.info { border-left-color:#60a5fa; }
.an-recent .row.warn { border-left-color:#f59e0b; }
.an-recent .row.critical { border-left-color:#ef4444; }
.an-recent .row .text { color:#cbd5e1; font-size:12px; }
.an-recent .row .meta { font-size:10px; color:#93a4cd; margin-top:3px; }
</style>
</head><body>
<div id="topbar"></div>
<div class="an-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Announcements</h1>
  <p style="color:#93a4cd; margin:0 0 4px;">Compose system-wide broadcasts. Templates speed up common messages.</p>
  <div class="an-grid">
    <div class="an-card">
      <h2>Templates</h2>
      <div id="anTemplates"><div style="color:#6b7d9e;">Loading...</div></div>
    </div>
    <div class="an-card">
      <h2>Compose</h2>
      <div class="an-form">
        <label>Level</label>
        <select id="anLevel">
          <option value="info">Info</option>
          <option value="warn">Warning</option>
          <option value="critical">Critical</option>
        </select>
        <label>Audience</label>
        <select id="anAudience">
          <option value="all">All users</option>
          <option value="cluster">Specific cluster</option>
          <option value="role">Specific role</option>
          <option value="station">Specific station</option>
        </select>
        <label>Target (if not all)</label>
        <input type="text" id="anTarget" placeholder="e.g. Arafat, dispatcher, ARF1" />
        <label>Message <button type="button" data-voice-target="anText" style="margin-left:8px; background:rgba(168,85,247,0.16); color:#d8b4fe; border:1px solid rgba(168,85,247,0.35); padding:2px 8px; border-radius:5px; font-size:10px; cursor:pointer;">Dictate</button></label>
        <textarea id="anText" placeholder="Type your announcement..."></textarea>
        <button id="anSend">Send broadcast</button>
      </div>
    </div>
  </div>
  <div class="an-card" style="margin-top:14px;">
    <h2>Recent Broadcasts (24h)</h2>
    <div class="an-recent" id="anRecent"><div style="color:#6b7d9e;">Loading...</div></div>
  </div>
</div>
<script src="assets/auth.js?v=0.2.41"></script>
<script src="assets/shortcuts.js?v=0.2.41"></script>
<script src="assets/voice.js?v=0.2.41"></script>
<script src="assets/topbar.js?v=0.2.41"></script>
<script src="assets/version.js?v=0.2.41"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['leadership','admin','dispatcher','cluster_supervisor'])) return;
  CADTopbar.render({ title: "Announcements" });
  const me = await HAJJ.whoami();
  const canSend = me && me.user && ['leadership','admin'].includes(me.user.role);
  if (!canSend) {
    document.getElementById('anSend').disabled = true;
    document.getElementById('anSend').textContent = 'Sending requires leadership/admin';
  }
  async function loadTemplates() {
    const r = await HAJJ.authedCall('announcement_templates', {});
    const wrap = document.getElementById('anTemplates');
    if (!r || !r.ok) { wrap.innerHTML = '<div style="color:#fca5a5;">Failed</div>'; return; }
    wrap.innerHTML = (r.templates || []).map(t => `
      <div class="an-tmpl" onclick="window.cadAnUseTemplate('${t.id}')">
        <div class="lbl"><span class="name">${t.label}</span><span class="badge ${t.level}">${t.level}</span></div>
        <div class="preview">${t.text.slice(0, 100)}${t.text.length > 100 ? '...' : ''}</div>
      </div>`).join('');
    window._anTemplates = r.templates;
  }
  window.cadAnUseTemplate = (id) => {
    const t = (window._anTemplates || []).find(x => x.id === id);
    if (!t) return;
    document.getElementById('anLevel').value = t.level;
    document.getElementById('anText').value = t.text;
    document.getElementById('anText').focus();
  };
  document.getElementById('anSend').addEventListener('click', async () => {
    const text = document.getElementById('anText').value.trim();
    if (!text) return alert('Enter a message');
    const level = document.getElementById('anLevel').value;
    const audience = document.getElementById('anAudience').value;
    const target = document.getElementById('anTarget').value.trim();
    if (audience !== 'all' && !target) return alert('Specify target for ' + audience);
    if (!confirm('Broadcast: "' + text.slice(0,80) + (text.length>80?'...':'') + '" at ' + level.toUpperCase() + ' to ' + audience + '?')) return;
    const r = await HAJJ.authedCall('broadcast_send', { text, level, audience, target });
    if (r && r.ok) {
      alert('Sent (id: ' + r.id + ')');
      document.getElementById('anText').value = '';
      loadRecent();
    } else alert('Send failed: ' + ((r && r.error)||'unknown'));
  });
  async function loadRecent() {
    const r = await HAJJ.authedCall('broadcast_list', { since: Math.floor(Date.now()/1000) - 86400 });
    const wrap = document.getElementById('anRecent');
    if (!r || !r.ok) { wrap.innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    if (!r.broadcasts || !r.broadcasts.length) { wrap.innerHTML = '<div style="color:#6b7d9e;">No broadcasts in last 24h</div>'; return; }
    wrap.innerHTML = r.broadcasts.map(b => `
      <div class="row ${b.level||'info'}">
        <div class="text">${(b.text||'').replace(/</g, '&lt;')}</div>
        <div class="meta">${b.sender_name||'-'} - ${b.audience||'all'}${b.target?'/'+b.target:''} - ${new Date((b.ts||0)*1000).toLocaleString()}</div>
      </div>`).join('');
  }
  loadTemplates();
  loadRecent();
  setInterval(loadRecent, 30000);
})();
</script>
</body></html>
