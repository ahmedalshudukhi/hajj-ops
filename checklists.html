<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklists · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.42">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; }
.ck-shell { max-width:1100px; margin:0 auto; padding:20px; }
.ck-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-top:14px; }
.ck-tmpl { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:16px 18px; cursor:pointer; transition:transform 0.15s; }
.ck-tmpl:hover { transform:translateY(-2px); border-color:rgba(56,189,248,0.4); }
.ck-tmpl h3 { margin:0 0 4px; font-size:15px; color:#cdf1ff; }
.ck-tmpl .count { font-size:11px; color:#93a4cd; }
.ck-runner { display:none; background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:20px 24px; margin-top:18px; }
.ck-runner.visible { display:block; }
.ck-runner h2 { margin:0 0 10px; font-size:18px; }
.ck-progress { height:8px; background:rgba(99,179,237,0.13); border-radius:4px; overflow:hidden; margin:8px 0 18px; }
.ck-progress-fill { height:100%; background:linear-gradient(90deg,#22c55e,#06b6d4); transition:width 0.3s; }
.ck-item { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; background:rgba(15,23,42,0.5); border-radius:8px; margin-bottom:6px; cursor:pointer; transition:background 0.15s; }
.ck-item:hover { background:rgba(99,179,237,0.08); }
.ck-item.done { background:rgba(34,197,94,0.10); }
.ck-item.done .text { text-decoration:line-through; color:#6b7d9e; }
.ck-item .check { width:22px; height:22px; border:2px solid rgba(99,179,237,0.4); border-radius:6px; flex-shrink:0; display:grid; place-items:center; }
.ck-item.done .check { background:#22c55e; border-color:#22c55e; }
.ck-item.done .check::after { content:'OK'; color:#fff; font-weight:700; font-size:10px; }
.ck-item .text { flex:1; font-size:13px; color:#e7ecf7; line-height:1.45; }
.ck-actions { display:flex; gap:10px; margin-top:18px; }
.ck-actions button { padding:11px 18px; border-radius:7px; cursor:pointer; font-weight:600; font-size:13px; }
.ck-actions .complete { background:rgba(34,197,94,0.18); color:#86efac; border:1px solid rgba(34,197,94,0.4); }
.ck-actions .cancel { background:transparent; color:#94a3b8; border:1px solid rgba(99,179,237,0.2); }
</style>
</head><body>
<div id="topbar"></div>
<div class="ck-shell">
  <h1 style="font-size:28px; margin:16px 0 4px;">Checklists</h1>
  <p style="color:#93a4cd; margin:0 0 4px;">Run pre-shift, post-shift, MCI, and clinical checklists.</p>
  <div id="ckTemplates" class="ck-grid"><div style="color:#6b7d9e; padding:30px;">Loading...</div></div>
  <div id="ckRunner" class="ck-runner">
    <h2 id="ckTitle"></h2>
    <div class="ck-progress"><div class="ck-progress-fill" id="ckFill" style="width:0%;"></div></div>
    <div id="ckProgressText" style="font-size:11px; color:#93a4cd; margin-bottom:12px;"></div>
    <div id="ckItems"></div>
    <div class="ck-actions">
      <button class="cancel" id="ckCancel">Close</button>
      <button class="complete" id="ckComplete">Mark complete</button>
      <button onclick="window.print()" style="background:rgba(99,179,237,0.13); color:#cdf1ff; border:1px solid rgba(99,179,237,0.3); padding:11px 18px; border-radius:7px; cursor:pointer;">Print</button>
    </div>
  </div>
</div>
<script src="assets/auth.js?v=0.2.42"></script>
<script src="assets/shortcuts.js?v=0.2.42"></script>
<script src="assets/topbar.js?v=0.2.42"></script>
<script src="assets/version.js?v=0.2.42"></script>
<script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Checklists" });
  let templates = [], runId = null, activeTemplate = null, progress = {};
  async function loadTemplates() {
    const r = await HAJJ.authedCall('checklist_list', {});
    if (!r || !r.ok) { document.getElementById('ckTemplates').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    templates = r.templates;
    document.getElementById('ckTemplates').innerHTML = templates.map(t => `
      <div class="ck-tmpl" onclick="window.cadCkRun('${t.id}')">
        <h3>${t.name}</h3><div class="count">${t.items.length} items</div>
      </div>`).join('');
  }
  window.cadCkRun = async (id) => {
    activeTemplate = templates.find(t => t.id === id);
    if (!activeTemplate) return;
    progress = {};
    document.getElementById('ckTitle').textContent = activeTemplate.name;
    document.getElementById('ckRunner').classList.add('visible');
    renderItems();
    const r = await HAJJ.authedCall('checklist_run', { action: 'start', template_id: activeTemplate.id, template_name: activeTemplate.name });
    if (r && r.ok) runId = r.id;
    document.getElementById('ckRunner').scrollIntoView({ behavior: 'smooth' });
  };
  function renderItems() {
    document.getElementById('ckItems').innerHTML = activeTemplate.items.map((text, i) => {
      const done = progress[i];
      return `<div class="ck-item ${done ? 'done' : ''}" onclick="window.cadCkToggle(${i})"><div class="check"></div><div class="text">${text}</div></div>`;
    }).join('');
    const done = Object.values(progress).filter(Boolean).length;
    const total = activeTemplate.items.length;
    document.getElementById('ckFill').style.width = (total > 0 ? (done/total*100).toFixed(0) : 0) + '%';
    document.getElementById('ckProgressText').textContent = done + ' / ' + total + ' complete';
  }
  window.cadCkToggle = async (i) => {
    progress[i] = !progress[i]; renderItems();
    if (runId) await HAJJ.authedCall('checklist_run', { action: 'progress', id: runId, progress: JSON.stringify(progress) });
  };
  document.getElementById('ckCancel').addEventListener('click', () => {
    document.getElementById('ckRunner').classList.remove('visible'); runId = null; activeTemplate = null;
  });
  document.getElementById('ckComplete').addEventListener('click', async () => {
    const done = Object.values(progress).filter(Boolean).length;
    const total = activeTemplate ? activeTemplate.items.length : 0;
    if (done < total && !confirm('Mark complete with ' + (total - done) + ' items unchecked?')) return;
    if (runId) await HAJJ.authedCall('checklist_run', { action: 'complete', id: runId });
    alert('Checklist marked complete');
    document.getElementById('ckRunner').classList.remove('visible'); runId = null; activeTemplate = null;
  });
  loadTemplates();
})();
</script>
</body></html>
