<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby · Hajj CAD</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.23">
<script src="assets/config.js?v=0.2.23"></script>
<script src="assets/tempo.js?v=0.2.23"></script>
<script src="assets/auth.js?v=0.2.23"></script>
<script src="assets/topbar.js?v=0.2.23"></script>
<style>
  .lobby-hero {
    max-width: 1400px; margin: 0 auto; padding: 4px 16px 20px;
  }
  .lobby-hero h1 { margin: 0 0 4px; font-size: 22px; }
  .lobby-hero .sub { font-size: 13px; color: var(--text-muted, #9ca3af); }
  .lobby-section-title {
    max-width: 1400px; margin: 24px auto 12px; padding: 0 16px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted, #9ca3af); font-weight: 600;
  }
</style>
</head>
<body>
<div id="topbar"></div>

<div class="lobby-hero">
  <h1>Welcome to Hajj CAD</h1>
  <div class="sub" id="lobbySub">—</div>
</div>

<div class="lobby-section-title">Available pages for your role</div>
<div class="cad-tile-grid" id="tileGrid"></div>

<div class="lobby-section-title" style="margin-top:32px;">Operational status</div>
<div class="cad-tile-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px,1fr));">
  <div class="cad-tile" style="--tile-accent:#3b82f6;">
    <div class="cad-tile-icon">⏱️</div>
    <div class="cad-tile-title" id="tilePhase">—</div>
    <div class="cad-tile-desc">Current operational phase</div>
  </div>
  <div class="cad-tile" style="--tile-accent:#f59e0b;">
    <div class="cad-tile-icon">🔄</div>
    <div class="cad-tile-title" id="tileTempo">—</div>
    <div class="cad-tile-desc">Refresh tempo</div>
  </div>
  <div class="cad-tile" style="--tile-accent:#a855f7;">
    <div class="cad-tile-icon">📅</div>
    <div class="cad-tile-title" id="tileDH">—</div>
    <div class="cad-tile-desc">Days to DH 1</div>
  </div>
</div>

<script>
(function() {
  if (!HAJJ.requireAuth()) return;
  CADTopbar.render({ title: 'Lobby' });
  CADTopbar.renderTileGrid('tileGrid');

  const u = HAJJ.getUser() || {};
  document.getElementById('lobbySub').textContent =
    (u.full_name || 'User') + ' · role: ' + (u.role || '?') +
    (u.cluster ? ' · cluster: ' + u.cluster : '') +
    (u.station ? ' · station: ' + u.station : '');

  // Tempo info
  if (window.HAJJ_TEMPO) {
    document.getElementById('tilePhase').textContent = HAJJ_TEMPO.phase();
    const ms = HAJJ_TEMPO.intervalMs();
    document.getElementById('tileTempo').textContent = (ms / 1000) + 's';
  }
  // KSA day-aligned counter — operations begin DH 4 (30 May 2026, full ops). DH 1 (27 May) is drill window.
  function daysUntil(dateStr) {
    const target = new Date(dateStr + 'T00:00:00+03:00');
    const now = new Date();
    const ksaNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Riyadh' }));
    ksaNow.setHours(0,0,0,0);
    return Math.round((target - ksaNow) / 86400000);
  }
  const dDH1 = daysUntil('2026-05-27');   // 1 Dhul Hijjah — drills begin
  const dDH4 = daysUntil('2026-05-30');   // 4 Dhul Hijjah — full operations
  const tileDH = document.getElementById('tileDH');
  if (tileDH) {
    if (dDH4 > 0) {
      // Pre-Hajj: emphasize ops countdown
      tileDH.innerHTML = 'Pre-Hajj · T-' + dDH4 + ' to ops'
        + '<br><span style="font-size:11px; color:#9ca3af; font-weight:400;">DH 4 · 30 May (drills DH 1 in ' + dDH1 + 'd)</span>';
    } else if (dDH4 === 0) {
      tileDH.innerHTML = 'DH 4 — Operations begin today'
        + '<br><span style="font-size:11px; color:#9ca3af; font-weight:400;">First day of Hajj operations</span>';
    } else if (dDH1 >= 0) {
      // Drill window: between DH1 and DH4
      tileDH.innerHTML = 'DH ' + (1 + Math.abs(dDH1)) + ' · Drills'
        + '<br><span style="font-size:11px; color:#9ca3af; font-weight:400;">T-' + Math.max(0, dDH4) + ' to full ops (DH 4)</span>';
    } else {
      // Operational window
      const op = Math.abs(dDH4) + 4;
      tileDH.innerHTML = 'DH ' + op + ' · Operational'
        + '<br><span style="font-size:11px; color:#9ca3af; font-weight:400;">Day ' + (Math.abs(dDH4) + 1) + ' of Hajj operations</span>';
    }
  }
})();
</script>
<script src="assets/version.js?v=0.2.23"></script>
</body>
</html>
