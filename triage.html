<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triage Tags</title><link rel="stylesheet" href="assets/style.css?v=0.2.45"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.tg-shell { max-width:1280px; margin:0 auto; padding:20px; }.tg-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }@media (max-width:900px) { .tg-grid { grid-template-columns:1fr; } }.tg-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 20px; }.tg-card h2 { margin:0 0 12px; font-size:14px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }.tg-counts { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }.tg-count { padding:14px 10px; border-radius:10px; text-align:center; }.tg-count.red { background:rgba(239,68,68,0.18); }.tg-count.yellow { background:rgba(245,158,11,0.18); }.tg-count.green { background:rgba(34,197,94,0.18); }.tg-count.black { background:rgba(31,41,55,0.45); }.tg-count .lbl { font-size:11px; letter-spacing:0.06em; text-transform:uppercase; }.tg-count.red .lbl { color:#fca5a5; } .tg-count.yellow .lbl { color:#fcd34d; } .tg-count.green .lbl { color:#86efac; } .tg-count.black .lbl { color:#9ca3af; }.tg-count .num { font-size:32px; font-weight:800; line-height:1; margin-top:4px; color:#e8f1ff; font-variant-numeric:tabular-nums; }.tg-form label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin:10px 0 5px; }.tg-form input, .tg-form select, .tg-form textarea { width:100%; padding:10px 12px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; font-family:inherit; }.tg-form .color-row { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }.tg-form .color-btn { padding:18px 10px; border-radius:8px; cursor:pointer; font-weight:800; font-size:14px; text-align:center; letter-spacing:0.06em; text-transform:uppercase; border:2px solid transparent; transition:all 0.15s; }.tg-form .color-btn.red { background:rgba(239,68,68,0.20); color:#fca5a5; }.tg-form .color-btn.yellow { background:rgba(245,158,11,0.20); color:#fcd34d; }.tg-form .color-btn.green { background:rgba(34,197,94,0.20); color:#86efac; }.tg-form .color-btn.black { background:rgba(31,41,55,0.55); color:#cbd5e1; }.tg-form .color-btn.selected { border-color:#67e8f9; transform:scale(1.04); }.tg-form .submit { width:100%; padding:13px; margin-top:16px; background:rgba(56,189,248,0.25); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:8px; cursor:pointer; font-weight:700; font-size:14px; }.tg-list { max-height:480px; overflow-y:auto; }.tg-tag { padding:10px 14px; border-radius:8px; margin-bottom:6px; display:grid; grid-template-columns:50px 1fr 90px 80px; gap:10px; align-items:center; font-size:12px; }.tg-tag.red { background:rgba(239,68,68,0.10); border-left:3px solid #ef4444; }.tg-tag.yellow { background:rgba(245,158,11,0.10); border-left:3px solid #f59e0b; }.tg-tag.green { background:rgba(34,197,94,0.10); border-left:3px solid #22c55e; }.tg-tag.black { background:rgba(31,41,55,0.30); border-left:3px solid #6b7280; }.tg-tag .num { font-family:ui-monospace,Menlo,monospace; font-weight:700; color:#cdf1ff; }.tg-tag .pt { color:#cbd5e1; }.tg-tag .time { color:#93a4cd; font-size:10px; }</style></head><body><div id="topbar"></div><div class="tg-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Triage Tags</h1><p style="color:#93a4cd; margin:0 0 4px;">START triage tag assignment for MCI scenes. Tags are persisted and counted in /mci.</p><div class="tg-counts" id="tgCounts"></div><div class="tg-grid"><div class="tg-card"><h2>Assign New Tag</h2><div class="tg-form"><label>Color (START priority)</label><div class="color-row"><button class="color-btn red" data-color="red" type="button">RED<br><span style="font-size:10px;">Immediate</span></button><button class="color-btn yellow" data-color="yellow" type="button">YELLOW<br><span style="font-size:10px;">Delayed</span></button><button class="color-btn green" data-color="green" type="button">GREEN<br><span style="font-size:10px;">Minor</span></button><button class="color-btn black" data-color="black" type="button">BLACK<br><span style="font-size:10px;">Expectant</span></button></div><label>Tag number (printed on physical tag)</label><input type="text" id="tgNum" placeholder="e.g. 042" /><label>Incident ID (if linked)</label><input type="text" id="tgInc" placeholder="DSP-..." /><label>Station</label><select id="tgSt"><option value="">--</option><option>ARF1</option><option>ARF2</option><option>ARF3</option><option>MUZ1</option><option>MUZ2</option><option>MUZ3</option><option>MIN1</option><option>MIN2</option><option>MIN3</option></select><label>Patient age</label><input type="text" id="tgAge" placeholder="approx" /><label>Gender</label><select id="tgGen"><option value="">--</option><option value="male">Male</option><option value="female">Female</option></select><label>Chief complaint</label><input type="text" id="tgCom" placeholder="brief, e.g. trauma chest" /><label>Notes</label><textarea id="tgNotes" rows="2" placeholder="optional"></textarea><button class="submit" id="tgSubmit" disabled>Assign Tag</button></div></div><div class="tg-card"><h2>Recent Tags (24h)</h2><div class="tg-list" id="tgList"><div style="color:#6b7d9e; padding:14px;">Loading...</div></div></div></div></div><script src="assets/auth.js?v=0.2.45"></script><script src="assets/shortcuts.js?v=0.2.45"></script><script src="assets/topbar.js?v=0.2.45"></script><script src="assets/version.js?v=0.2.45"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin'])) return;
  CADTopbar.render({ title: "Triage Tags" });
  let selectedColor = null;
  document.querySelectorAll('.color-btn').forEach(function(b) {
    b.addEventListener('click', function() {
      document.querySelectorAll('.color-btn').forEach(function(x) { x.classList.remove('selected'); });
      b.classList.add('selected');
      selectedColor = b.dataset.color;
      document.getElementById('tgSubmit').disabled = false;
    });
  });
  document.getElementById('tgSubmit').addEventListener('click', async function() {
    if (!selectedColor) return alert('Pick a color first');
    const data = {
      tag_color: selectedColor,
      tag_number: document.getElementById('tgNum').value,
      incident_id: document.getElementById('tgInc').value,
      station: document.getElementById('tgSt').value,
      patient_age: document.getElementById('tgAge').value,
      patient_gender: document.getElementById('tgGen').value,
      chief_complaint: document.getElementById('tgCom').value,
      notes: document.getElementById('tgNotes').value
    };
    const r = await HAJJ.authedCall('triage_tags_assign', data);
    if (r && r.ok) {
      alert('Tag assigned: ' + r.id);
      document.getElementById('tgNum').value = '';
      document.getElementById('tgInc').value = '';
      document.getElementById('tgAge').value = '';
      document.getElementById('tgCom').value = '';
      document.getElementById('tgNotes').value = '';
      refresh();
    } else alert('Failed: ' + ((r && r.error) || 'unknown'));
  });
  async function refresh() {
    const r = await HAJJ.authedCall('triage_tags_list', {});
    if (!r || !r.ok) { document.getElementById('tgList').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    const c = r.counts;
    document.getElementById('tgCounts').innerHTML =
      '<div class="tg-count red"><div class="lbl">Red</div><div class="num">' + (c.red || 0) + '</div></div>' +
      '<div class="tg-count yellow"><div class="lbl">Yellow</div><div class="num">' + (c.yellow || 0) + '</div></div>' +
      '<div class="tg-count green"><div class="lbl">Green</div><div class="num">' + (c.green || 0) + '</div></div>' +
      '<div class="tg-count black"><div class="lbl">Black</div><div class="num">' + (c.black || 0) + '</div></div>';
    if (!r.tags.length) {
      document.getElementById('tgList').innerHTML = '<div style="color:#6b7d9e; padding:14px;">No tags in last 24h</div>';
    } else {
      document.getElementById('tgList').innerHTML = r.tags.map(function(t) {
        return '<div class="tg-tag ' + (t.tag_color || 'green') + '">' +
          '<div class="num">#' + (t.tag_number || '?') + '</div>' +
          '<div class="pt">' + (t.chief_complaint || '--') + ' · ' + (t.patient_age || '?') + '/' + (t.patient_gender || '?') + '</div>' +
          '<div style="color:#93a4cd; font-size:11px;">' + (t.station || '--') + '</div>' +
          '<div class="time">' + new Date(t.assigned_at * 1000).toLocaleTimeString() + '</div>' +
        '</div>';
      }).join('');
    }
  }
  refresh();
  setInterval(refresh, 10000);
})();
</script></body></html>
