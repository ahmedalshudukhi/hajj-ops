<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Intake</title><link rel="stylesheet" href="assets/style.css?v=0.2.53"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.in-shell { max-width:1100px; margin:0 auto; padding:20px; }.in-card { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:20px 24px; margin-bottom:14px; }.in-card h2 { margin:0 0 14px; font-size:14px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; padding-bottom:8px; border-bottom:1px solid rgba(99,179,237,0.12); }.in-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }.in-grid label { display:block; }.in-grid .l { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:5px; }.in-grid input, .in-grid select { width:100%; padding:9px 12px; border-radius:6px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; box-sizing:border-box; }.in-grid textarea { width:100%; padding:10px 12px; border-radius:6px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; font-family:inherit; min-height:60px; box-sizing:border-box; resize:vertical; }.in-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }.in-actions button { padding:13px 28px; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px; }.in-actions .save { background:rgba(56,189,248,0.25); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); }.in-actions .reset { background:rgba(107,114,128,0.18); color:#cbd5e1; border:1px solid rgba(107,114,128,0.4); }.in-recent { display:flex; flex-direction:column; gap:6px; max-height:400px; overflow-y:auto; }.in-row { padding:10px 14px; background:rgba(15,23,42,0.5); border-radius:7px; font-size:12px; border-left:3px solid #67e8f9; }.in-row .top { display:flex; justify-content:space-between; margin-bottom:4px; }.in-row .id { font-family:ui-monospace,Menlo,monospace; color:#cdf1ff; font-weight:600; font-size:11px; }.in-row .time { color:#93a4cd; font-size:10px; }.in-row .complaint { color:#e8f1ff; }.in-row .vitals { color:#fcd34d; font-family:ui-monospace,Menlo,monospace; font-size:10px; margin-top:4px; }.in-status { padding:8px 12px; background:rgba(34,197,94,0.10); border:1px solid rgba(34,197,94,0.25); border-radius:7px; font-size:12px; color:#86efac; margin-bottom:14px; display:none; }.in-status.error { background:rgba(239,68,68,0.10); border-color:rgba(239,68,68,0.35); color:#fca5a5; }.in-tabs { display:flex; gap:8px; margin-bottom:14px; }.in-tab { padding:8px 16px; background:rgba(15,23,42,0.5); color:#93a4cd; border:1px solid rgba(99,179,237,0.18); border-radius:7px; cursor:pointer; font-size:12px; font-weight:600; }.in-tab.active { background:rgba(67,232,249,0.18); color:#67e8f9; border-color:rgba(67,232,249,0.45); }</style></head><body><div id="topbar"></div><div class="in-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Patient Intake</h1><p style="color:#93a4cd; margin:0 0 4px;">Quick essentials capture — less than full PCR. Use when you need to record the patient now and write the full PCR later.</p><div id="inStatus" class="in-status"></div><div class="in-card"><h2>Demographics</h2><div class="in-grid"><label><span class="l">Incident ID (optional)</span><input type="text" id="inInc" placeholder="DSP-..." /></label><label><span class="l">Station</span><select id="inSt"><option value="">--</option><option>ARF1</option><option>ARF2</option><option>ARF3</option><option>MUZ1</option><option>MUZ2</option><option>MUZ3</option><option>MIN1</option><option>MIN2</option><option>MIN3</option></select></label><label><span class="l">Age</span><input type="text" id="inAge" placeholder="years" /></label><label><span class="l">Gender</span><select id="inGen"><option value="">--</option><option value="male">Male</option><option value="female">Female</option></select></label><label><span class="l">Nationality</span><input type="text" id="inNat" placeholder="optional" /></label><label><span class="l">MRN / ID</span><input type="text" id="inMRN" placeholder="optional" /></label></div></div><div class="in-card"><h2>Chief Complaint</h2><textarea id="inComplaint" placeholder="Primary reason for contact..."></textarea></div><div class="in-card"><h2>Initial Vitals</h2><div class="in-grid"><label><span class="l">BP (mmHg)</span><input type="text" id="inBP" placeholder="120/80" /></label><label><span class="l">HR (bpm)</span><input type="text" id="inHR" placeholder="80" /></label><label><span class="l">RR (rpm)</span><input type="text" id="inRR" placeholder="16" /></label><label><span class="l">SpO2 (%)</span><input type="text" id="inSpO2" placeholder="98" /></label><label><span class="l">Temp (°C)</span><input type="text" id="inTemp" placeholder="36.8" /></label><label><span class="l">GCS</span><input type="text" id="inGCS" placeholder="15" /></label><label><span class="l">Pain 0-10</span><input type="text" id="inPain" placeholder="3" /></label></div></div><div class="in-card"><h2>Allergies / Medications / Notes</h2><div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;"><label><span class="l">Allergies</span><textarea id="inAllergies" placeholder="NKDA or list..."></textarea></label><label><span class="l">Home medications</span><textarea id="inMeds" placeholder="list..."></textarea></label></div><div style="margin-top:14px;"><label><span class="l">Notes</span><textarea id="inNotes" placeholder="quick narrative..."></textarea></label></div></div><div class="in-actions"><button class="save" id="inSave">Save Intake</button><button class="reset" id="inReset">Reset Form</button><a href="/pcr" class="reset" style="background:rgba(168,85,247,0.18); color:#d8b4fe; border:1px solid rgba(168,85,247,0.4); padding:13px 28px; border-radius:8px; text-decoration:none; font-weight:700; font-size:13px;">Open full PCR →</a></div><div class="in-card" style="margin-top:18px;"><h2>Recent Intakes</h2><div class="in-tabs"><button class="in-tab active" data-scope="mine">Mine (24h)</button><button class="in-tab" data-scope="all">All (24h)</button></div><div id="inList" class="in-recent"><div style="color:#6b7d9e; padding:14px;">Loading...</div></div></div></div><script src="assets/auth.js?v=0.2.53"></script><script src="assets/shortcuts.js?v=0.2.53"></script><script src="assets/topbar.js?v=0.2.53"></script><script src="assets/version.js?v=0.2.53"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','dispatcher','cluster_supervisor','leadership','admin'])) return;
  CADTopbar.render({ title: "Intake" });
  function showStatus(msg, isError) {
    const el = document.getElementById('inStatus');
    el.textContent = msg;
    el.className = 'in-status' + (isError ? ' error' : '');
    el.style.display = 'block';
    setTimeout(function(){ el.style.display = 'none'; }, 4000);
  }
  document.getElementById('inSave').addEventListener('click', async function() {
    const data = {
      incident_id: document.getElementById('inInc').value,
      station: document.getElementById('inSt').value,
      patient_age: document.getElementById('inAge').value,
      patient_gender: document.getElementById('inGen').value,
      patient_nationality: document.getElementById('inNat').value,
      patient_mrn: document.getElementById('inMRN').value,
      chief_complaint: document.getElementById('inComplaint').value,
      bp: document.getElementById('inBP').value,
      hr: document.getElementById('inHR').value,
      rr: document.getElementById('inRR').value,
      spo2: document.getElementById('inSpO2').value,
      temp: document.getElementById('inTemp').value,
      gcs: document.getElementById('inGCS').value,
      pain_0_10: document.getElementById('inPain').value,
      allergies: document.getElementById('inAllergies').value,
      medications: document.getElementById('inMeds').value,
      notes: document.getElementById('inNotes').value
    };
    if (!data.chief_complaint) return showStatus('Chief complaint is required', true);
    const r = await HAJJ.authedCall('intake_save', data);
    if (r && r.ok) {
      showStatus('Intake saved: ' + r.id);
      document.getElementById('inReset').click();
      refresh();
    } else showStatus('Failed: ' + ((r && r.error) || 'unknown'), true);
  });
  document.getElementById('inReset').addEventListener('click', function() {
    ['inInc','inAge','inNat','inMRN','inComplaint','inBP','inHR','inRR','inSpO2','inTemp','inGCS','inPain','inAllergies','inMeds','inNotes'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.getElementById('inSt').value = '';
    document.getElementById('inGen').value = '';
  });
  let scope = 'mine';
  document.querySelectorAll('.in-tab').forEach(function(b) {
    b.addEventListener('click', function() {
      document.querySelectorAll('.in-tab').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      scope = b.dataset.scope;
      refresh();
    });
  });
  async function refresh() {
    const params = scope === 'mine' ? { mine: 1 } : {};
    const r = await HAJJ.authedCall('intake_list', params);
    if (!r || !r.ok) { document.getElementById('inList').innerHTML = '<div style="color:#fca5a5;">Error</div>'; return; }
    if (!r.intakes.length) {
      document.getElementById('inList').innerHTML = '<div style="color:#6b7d9e; padding:14px; text-align:center;">None in last 24h</div>';
    } else {
      document.getElementById('inList').innerHTML = r.intakes.map(function(i) {
        const vitals = [
          i.bp ? 'BP ' + i.bp : null,
          i.hr ? 'HR ' + i.hr : null,
          i.rr ? 'RR ' + i.rr : null,
          i.spo2 ? 'SpO2 ' + i.spo2 + '%' : null,
          i.temp ? 'T ' + i.temp + '°C' : null,
          i.gcs ? 'GCS ' + i.gcs : null,
          i.pain_0_10 ? 'Pain ' + i.pain_0_10 + '/10' : null
        ].filter(Boolean).join('  ·  ');
        return '<div class="in-row">' +
          '<div class="top"><span class="id">' + i.id + (i.incident_id ? ' · ' + i.incident_id : '') + '</span><span class="time">' + new Date(i.created_at * 1000).toLocaleString() + '</span></div>' +
          '<div class="complaint">' + (i.patient_age || '?') + 'y ' + (i.patient_gender || '?') + ' · ' + (i.chief_complaint || '--').slice(0, 100) + '</div>' +
          (vitals ? '<div class="vitals">' + vitals + '</div>' : '') +
        '</div>';
      }).join('');
    }
  }
  refresh();
  setInterval(refresh, 30000);
})();
</script></body></html>
