<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay</title><link rel="stylesheet" href="assets/style.css?v=0.2.37"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.rp-shell { max-width:1280px; margin:0 auto; padding:20px; }.rp-controls { background:rgba(20,28,50,0.6); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:14px 18px; display:flex; gap:14px; flex-wrap:wrap; align-items:end; margin:12px 0 18px; }.rp-controls label { display:block; font-size:11px; color:#93a4cd; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:5px; }.rp-controls input, .rp-controls select { padding:10px 14px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.25); font-size:14px; }.rp-btn { padding:10px 18px; background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:7px; cursor:pointer; font-weight:600; font-size:13px; }.rp-btn.play { background:rgba(34,197,94,0.2); color:#86efac; border-color:rgba(34,197,94,0.4); }.rp-btn:disabled { opacity:0.4; cursor:not-allowed; }.rp-stage { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:14px; padding:18px 20px; margin-bottom:14px; }.rp-stage h2 { margin:0 0 14px; font-size:14px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }.rp-time-display { font-family:ui-monospace,Menlo,monospace; font-size:24px; font-weight:700; color:#67e8f9; }.rp-station-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }.rp-station-cell { background:rgba(15,23,42,0.5); border:1px solid rgba(99,179,237,0.15); border-radius:8px; padding:10px 14px; text-align:center; transition:all 0.3s; }.rp-station-cell.active { background:rgba(34,197,94,0.18); border-color:rgba(34,197,94,0.5); transform:scale(1.04); }.rp-station-cell.surge { background:rgba(245,158,11,0.18); border-color:rgba(245,158,11,0.5); }.rp-station-cell.critical { background:rgba(239,68,68,0.18); border-color:rgba(239,68,68,0.5); animation:pulse 1s infinite; }@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow:0 0 0 8px rgba(239,68,68,0); } }.rp-station-cell .code { font-weight:700; color:#cdf1ff; }.rp-station-cell .count { font-size:24px; font-weight:800; color:#e8f1ff; margin-top:4px; font-variant-numeric:tabular-nums; }.rp-events { max-height:340px; overflow-y:auto; }.rp-event { padding:8px 14px; font-size:12px; border-bottom:1px solid rgba(99,179,237,0.06); display:grid; grid-template-columns:80px 100px 100px 1fr; gap:10px; align-items:center; }.rp-event .t { color:#67e8f9; font-family:ui-monospace,Menlo,monospace; }.rp-event .type.dispatch { color:#f59e0b; }.rp-event .type.en_route { color:#0ea5e9; }.rp-event .type.on_scene { color:#a855f7; }.rp-event .type.transporting { color:#22c55e; }.rp-event .type.close { color:#6b7d9e; }.rp-event .station { color:#cdf1ff; }.rp-event .detail { color:#cbd5e1; }.rp-scrubber { width:100%; margin-top:14px; }</style></head><body><div id="topbar"></div><div class="rp-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Historical Replay</h1><p style="color:#93a4cd; margin:0 0 4px;">Scrub through a past time window to see how operations unfolded.</p><div class="rp-controls"><div><label>From</label><input type="datetime-local" id="rpFrom" /></div><div><label>To</label><input type="datetime-local" id="rpTo" /></div><button class="rp-btn" id="rpLoad">Load window</button><button class="rp-btn play" id="rpPlay" disabled>Play</button><button class="rp-btn" id="rpReset" disabled>Reset</button><select id="rpSpeed"><option value="1">1x</option><option value="5">5x</option><option value="30" selected>30x</option><option value="60">60x</option><option value="300">300x</option></select></div><div class="rp-stage"><div style="display:flex; justify-content:space-between; align-items:center;"><h2>Stage</h2><div class="rp-time-display" id="rpTime">--:--:--</div></div><input type="range" class="rp-scrubber" id="rpScrub" min="0" max="100" value="0" disabled /><div style="display:flex; justify-content:space-between; font-size:10px; color:#6b7d9e; margin-top:4px;"><span id="rpStart">—</span><span id="rpProgress">0 / 0 events</span><span id="rpEnd">—</span></div><div class="rp-station-grid" id="rpStations"></div></div><div class="rp-stage"><h2>Event Stream</h2><div class="rp-events" id="rpEvents"><div style="color:#6b7d9e; padding:20px;">Load a window to begin.</div></div></div></div><script src="assets/auth.js?v=0.2.37"></script><script src="assets/shortcuts.js?v=0.2.37"></script><script src="assets/topbar.js?v=0.2.37"></script><script src="assets/version.js?v=0.2.37"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['cluster_supervisor','dispatcher','leadership','admin'])) return;
  CADTopbar.render({ title: "Replay" });
  const STATIONS = ['ARF1','ARF2','ARF3','MUZ1','MUZ2','MUZ3','MIN1','MIN2','MIN3'];
  document.getElementById('rpStations').innerHTML = STATIONS.map(function(s) {
    return '<div class="rp-station-cell" data-st="' + s + '"><div class="code">' + s + '</div><div class="count">0</div></div>';
  }).join('');

  const now = new Date();
  const y = new Date(now.getTime() - 86400 * 1000);
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  document.getElementById('rpFrom').value = ymd(y) + 'T08:00';
  document.getElementById('rpTo').value = ymd(y) + 'T20:00';

  let stream = [], idx = 0, fromTs = 0, toTs = 0, timer = null;

  document.getElementById('rpLoad').addEventListener('click', async function() {
    const f = new Date(document.getElementById('rpFrom').value);
    const t = new Date(document.getElementById('rpTo').value);
    if (!f || !t || t <= f) { alert('Invalid window'); return; }
    fromTs = Math.floor(f.getTime() / 1000);
    toTs = Math.floor(t.getTime() / 1000);
    const r = await HAJJ.authedCall('replay', { from_ts: fromTs, to_ts: toTs });
    if (!r || !r.ok) { alert('Error: ' + (r && r.error || 'unknown')); return; }
    stream = r.events;
    idx = 0;
    document.getElementById('rpStart').textContent = new Date(fromTs*1000).toLocaleString();
    document.getElementById('rpEnd').textContent = new Date(toTs*1000).toLocaleString();
    document.getElementById('rpProgress').textContent = '0 / ' + stream.length + ' events';
    document.getElementById('rpScrub').disabled = false;
    document.getElementById('rpScrub').max = stream.length;
    document.getElementById('rpScrub').value = 0;
    document.getElementById('rpPlay').disabled = false;
    document.getElementById('rpReset').disabled = false;
    renderAtIdx(0);
  });

  function renderAtIdx(i) {
    const counts = {};
    STATIONS.forEach(function(s) { counts[s] = 0; });
    for (let k = 0; k < i; k++) {
      const e = stream[k];
      if (e.station && counts[e.station] != null) {
        if (e.type === 'dispatch') counts[e.station]++;
        else if (e.type === 'close') counts[e.station]--;
      }
    }
    STATIONS.forEach(function(s) {
      const cell = document.querySelector('[data-st="' + s + '"]');
      if (!cell) return;
      const n = Math.max(0, counts[s]);
      cell.querySelector('.count').textContent = n;
      cell.classList.toggle('active', n >= 1 && n < 3);
      cell.classList.toggle('surge', n >= 3 && n < 5);
      cell.classList.toggle('critical', n >= 5);
    });
    const lastTs = i > 0 ? stream[i-1].ts : fromTs;
    document.getElementById('rpTime').textContent = new Date(lastTs * 1000).toLocaleTimeString();
    document.getElementById('rpProgress').textContent = i + ' / ' + stream.length + ' events';
    document.getElementById('rpScrub').value = i;
    const recent = stream.slice(Math.max(0, i - 50), i).reverse();
    document.getElementById('rpEvents').innerHTML = recent.map(function(e) {
      return '<div class="rp-event">' +
        '<span class="t">' + new Date(e.ts*1000).toLocaleTimeString() + '</span>' +
        '<span class="type ' + e.type + '">' + e.type.toUpperCase() + '</span>' +
        '<span class="station">' + (e.station || '—') + '</span>' +
        '<span class="detail">' + (e.incident_id || '') + (e.complaint ? ' · ' + (e.complaint || '').slice(0, 40) : '') + (e.cardiac ? ' ⚠' : '') + '</span>' +
      '</div>';
    }).join('');
  }

  document.getElementById('rpScrub').addEventListener('input', function(e) {
    idx = parseInt(e.target.value);
    renderAtIdx(idx);
  });

  document.getElementById('rpPlay').addEventListener('click', function() {
    if (timer) {
      clearInterval(timer); timer = null;
      document.getElementById('rpPlay').textContent = 'Play';
      return;
    }
    const speed = parseInt(document.getElementById('rpSpeed').value);
    document.getElementById('rpPlay').textContent = 'Pause';
    timer = setInterval(function() {
      if (idx >= stream.length) { clearInterval(timer); timer = null; document.getElementById('rpPlay').textContent = 'Play'; return; }
      idx++;
      renderAtIdx(idx);
    }, Math.max(50, 1000 / speed));
  });

  document.getElementById('rpReset').addEventListener('click', function() {
    if (timer) clearInterval(timer);
    timer = null;
    idx = 0;
    renderAtIdx(0);
    document.getElementById('rpPlay').textContent = 'Play';
  });
})();
</script></body></html>
