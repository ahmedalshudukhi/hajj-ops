name: Refresh dashboard data

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 min
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build data.json from Google Drive
        run: python build.py

      - name: Build tasks.json from Smartsheet (or fallback)
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
        run: python build_tasks.py

      - name: Commit if changed
        run: |
          git config user.name  "hajj-ops-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json tasks.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh data — $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes to commit"
          fi
