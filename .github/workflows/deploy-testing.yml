# Self-healing test deploy.
#
# Why this exists: Cloudflare Workers Builds is configured via the CF dashboard
# to watch the main branch. When the refresh cron pushes data.json to main, CF
# auto-deploys main's stale v0.2.18 code to BOTH `hajj-ops` (production) AND
# `hajj-ops-test` (test) Workers, clobbering our testing branch deploys.
#
# This workflow is a defensive auto-redeploy that:
#   1. Deploys testing -> hajj-ops-test on every push to testing
#   2. Deploys testing -> hajj-ops-test on every push to main (immediately
#      undoes any auto-revert triggered by main pushes)
#   3. Defensive cron every 15 min as belt-and-suspenders
#   4. Manual trigger from Actions tab
#
# REQUIRED SECRETS (set in GitHub repo Settings -> Secrets and variables -> Actions):
#   - CLOUDFLARE_API_TOKEN  (Workers Edit permission)
#   - CLOUDFLARE_ACCOUNT_ID (your Cloudflare account ID)

name: Deploy testing -> hajj-ops-test

on:
  push:
    branches:
      - testing
      - main         # if main gets pushed, re-assert testing immediately
  schedule:
    - cron: '*/15 * * * *'   # every 15 min defensive re-deploy
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: deploy-testing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 1

      - name: Verify wrangler.jsonc targets hajj-ops-test
        run: |
          NAME=$(python3 -c "import re; m=re.search(r'\"name\"\s*:\s*\"([^\"]+)\"', open('wrangler.jsonc').read()); print(m.group(1) if m else '')")
          if [ "$NAME" != "hajj-ops-test" ]; then
            echo "ABORT: wrangler.jsonc 'name' is '$NAME', expected 'hajj-ops-test'."
            exit 1
          fi
          echo "OK targets hajj-ops-test"

      - name: Show what we're deploying
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "HEAD:   $(git log --oneline -1)"
          echo "Version: $(cat VERSION)"
          if [ -f assets/version.js ]; then
            grep -E 'version|sha|built_at' assets/version.js | head -4
          fi

      - name: Deploy to Cloudflare Workers (hajj-ops-test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployment
        run: |
          sleep 8
          VER=$(curl -sH "Cache-Control: no-cache" --max-time 8 "https://hajj-ops-test.alshudukhi-a.workers.dev/assets/version.js?$(date +%s)" | grep -E 'version:' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Deployed version: $VER"
          if [ -z "$VER" ]; then
            echo "WARN: could not verify version"
          fi
