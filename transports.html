<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transports</title><link rel="stylesheet" href="assets/style.css?v=0.2.42"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; }.tp-shell { max-width:1280px; margin:0 auto; padding:20px; }.tp-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:14px 0; }.tp-tile { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:14px 18px; }.tp-tile .l { font-size:10px; color:#93a4cd; letter-spacing:0.13em; text-transform:uppercase; }.tp-tile .v { font-size:32px; font-weight:800; line-height:1; margin-top:5px; font-variant-numeric:tabular-nums; }.tp-tile.active .v { color:#fcd34d; }.tp-tile.done .v { color:#86efac; }.tp-tile.total .v { color:#67e8f9; }.tp-section { background:rgba(20,28,50,0.5); border:1px solid rgba(99,179,237,0.18); border-radius:12px; padding:18px 20px; margin-top:14px; }.tp-section h2 { margin:0 0 12px; font-size:14px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; }.tp-row { display:grid; grid-template-columns:120px 80px 90px 90px 110px 1fr 70px; gap:10px; padding:10px 14px; align-items:center; font-size:12px; border-bottom:1px solid rgba(99,179,237,0.06); }.tp-row.head { background:rgba(99,179,237,0.10); font-weight:700; color:#cdf1ff; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; }.tp-id { font-family:ui-monospace,Menlo,monospace; color:#cdf1ff; font-weight:600; }.tp-trg { font-weight:700; padding:2px 7px; border-radius:4px; font-size:10px; text-align:center; text-transform:uppercase; }.tp-trg.red { background:rgba(239,68,68,0.20); color:#fca5a5; }.tp-trg.yellow { background:rgba(245,158,11,0.18); color:#fcd34d; }.tp-trg.green { background:rgba(34,197,94,0.18); color:#86efac; }.tp-trg.black { background:rgba(107,114,128,0.18); color:#9ca3af; }.tp-elapsed { color:#fcd34d; font-variant-numeric:tabular-nums; font-family:ui-monospace,Menlo,monospace; font-weight:600; }.tp-unit { color:#67e8f9; font-weight:600; }.tp-complaint { color:#cbd5e1; }.tp-cardiac { color:#fca5a5; font-weight:700; }</style></head><body><div id="topbar"></div><div class="tp-shell"><h1 style="font-size:28px; margin:16px 0 4px;">Active Transports</h1><p style="color:#93a4cd; margin:0 0 4px;">Live view of in-progress transports to hospitals/receiving facilities. Updates every 8 seconds.</p><div class="tp-tiles" id="tpTiles"></div><div class="tp-section"><h2>In Progress</h2><div class="tp-row head"><div>Incident</div><div>Triage</div><div>Station</div><div>Unit</div><div>Elapsed</div><div>Complaint</div><div>Cardiac</div></div><div id="tpActive"><div style="color:#6b7d9e; padding:20px;">Loading...</div></div></div><div class="tp-section"><h2>Recently Arrived (last 50)</h2><div class="tp-row head"><div>Incident</div><div>Triage</div><div>Station</div><div>Unit</div><div>Time</div><div>Complaint</div><div>—</div></div><div id="tpCompleted"></div></div></div><script src="assets/auth.js?v=0.2.42"></script><script src="assets/shortcuts.js?v=0.2.42"></script><script src="assets/topbar.js?v=0.2.42"></script><script src="assets/version.js?v=0.2.42"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Transports" });
  function fmtElapsed(seconds) {
    if (!seconds || seconds < 0) return '--';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  function fmtTime(ts) {
    if (!ts) return '--';
    return new Date(ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  async function refresh() {
    const r = await HAJJ.authedCall('transports_list', { lookback_hours: 24 });
    if (!r || !r.ok) { document.getElementById('tpActive').innerHTML = '<div style="color:#fca5a5; padding:20px;">Error: ' + (r && r.error || 'unknown') + '</div>'; return; }
    document.getElementById('tpTiles').innerHTML =
      '<div class="tp-tile active"><div class="l">In progress</div><div class="v">' + r.active.length + '</div></div>' +
      '<div class="tp-tile done"><div class="l">Arrived (24h)</div><div class="v">' + r.completed.length + '</div></div>' +
      '<div class="tp-tile total"><div class="l">Total (24h)</div><div class="v">' + r.total_window + '</div></div>';
    const now = Math.floor(Date.now() / 1000);
    if (r.active.length === 0) {
      document.getElementById('tpActive').innerHTML = '<div style="color:#6b7d9e; padding:20px; text-align:center;">No active transports</div>';
    } else {
      document.getElementById('tpActive').innerHTML = r.active.map(function(t) {
        const startTs = t.transporting_at || t.transfer_start_at || t.on_scene_at || t.dispatched_at;
        const elapsed = startTs ? (now - startTs) : 0;
        return '<div class="tp-row">' +
          '<div class="tp-id">' + (t.incident_id || '') + '</div>' +
          '<div><span class="tp-trg ' + (t.triage || '') + '">' + (t.triage || '--').toUpperCase() + '</span></div>' +
          '<div>' + (t.station || '--') + '</div>' +
          '<div class="tp-unit">' + (t.unit_assigned || '--') + '</div>' +
          '<div class="tp-elapsed">' + fmtElapsed(elapsed) + '</div>' +
          '<div class="tp-complaint">' + (t.complaint || '--').slice(0, 60) + '</div>' +
          '<div class="tp-cardiac">' + (t.cardiac_arrest ? 'YES' : '') + '</div>' +
        '</div>';
      }).join('');
    }
    if (r.completed.length === 0) {
      document.getElementById('tpCompleted').innerHTML = '<div style="color:#6b7d9e; padding:20px; text-align:center;">None</div>';
    } else {
      document.getElementById('tpCompleted').innerHTML = r.completed.slice(0, 50).map(function(t) {
        return '<div class="tp-row">' +
          '<div class="tp-id">' + (t.incident_id || '') + '</div>' +
          '<div><span class="tp-trg ' + (t.triage || '') + '">' + (t.triage || '--').toUpperCase() + '</span></div>' +
          '<div>' + (t.station || '--') + '</div>' +
          '<div class="tp-unit">' + (t.unit_assigned || '--') + '</div>' +
          '<div style="color:#86efac;">' + fmtTime(t.arrived_at) + '</div>' +
          '<div class="tp-complaint">' + (t.complaint || '--').slice(0, 60) + '</div>' +
          '<div>--</div>' +
        '</div>';
      }).join('');
    }
  }
  refresh();
  setInterval(refresh, 8000);
})();
</script></body></html>
