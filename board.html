<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Board</title><link rel="stylesheet" href="assets/style.css?v=0.2.44"><style>body { background:#0a0e1a; color:#e7ecf7; font-family:Inter,system-ui,sans-serif; margin:0; }.bd-shell { padding:14px; }.bd-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }.bd-head h1 { margin:0; font-size:22px; color:#cdf1ff; }.bd-head .meta { color:#93a4cd; font-size:12px; }.bd-cols { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }@media (max-width:1100px) { .bd-cols { grid-template-columns:repeat(2,1fr); } }@media (max-width:600px) { .bd-cols { grid-template-columns:1fr; } }.bd-col { background:rgba(20,28,50,0.4); border:1px solid rgba(99,179,237,0.14); border-radius:12px; padding:14px 14px; min-height:60vh; }.bd-col-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:10px; border-bottom:2px solid; }.bd-col.new .bd-col-head { border-color:#f59e0b; }.bd-col.en_route .bd-col-head { border-color:#0ea5e9; }.bd-col.on_scene .bd-col-head { border-color:#a855f7; }.bd-col.transporting .bd-col-head { border-color:#22c55e; }.bd-col.closed .bd-col-head { border-color:#6b7280; }.bd-col h3 { margin:0; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; }.bd-col.new h3 { color:#fcd34d; }.bd-col.en_route h3 { color:#7dd3fc; }.bd-col.on_scene h3 { color:#d8b4fe; }.bd-col.transporting h3 { color:#86efac; }.bd-col.closed h3 { color:#cbd5e1; }.bd-col-head .count { font-size:24px; font-weight:800; color:#e8f1ff; font-variant-numeric:tabular-nums; }.bd-list { display:flex; flex-direction:column; gap:6px; max-height:75vh; overflow-y:auto; }.bd-inc { background:rgba(15,23,42,0.6); border-radius:7px; padding:8px 12px; font-size:12px; border-left:3px solid #475569; cursor:pointer; transition:transform 0.12s; }.bd-inc:hover { transform:translateX(2px); background:rgba(15,23,42,0.85); }.bd-inc.red { border-left-color:#ef4444; }.bd-inc.yellow { border-left-color:#f59e0b; }.bd-inc.green { border-left-color:#22c55e; }.bd-inc.cardiac { background:rgba(239,68,68,0.12); }.bd-inc .id { font-family:ui-monospace,Menlo,monospace; color:#cdf1ff; font-size:11px; font-weight:600; }.bd-inc .meta { color:#93a4cd; font-size:10px; margin-top:2px; }.bd-inc .complaint { color:#e8f1ff; margin-top:4px; line-height:1.3; }.bd-inc .cardiac-flag { color:#fca5a5; font-weight:700; font-size:10px; }.bd-inc .age { color:#67e8f9; font-family:ui-monospace,Menlo,monospace; font-size:10px; }</style></head><body><div id="topbar"></div><div class="bd-shell"><div class="bd-head"><h1>Operations Board</h1><div class="meta" id="bdMeta">Loading...</div></div><div class="bd-cols"><div class="bd-col new"><div class="bd-col-head"><h3>New / Pending</h3><span class="count" id="cntNew">--</span></div><div class="bd-list" id="colNew"></div></div><div class="bd-col en_route"><div class="bd-col-head"><h3>En Route</h3><span class="count" id="cntEnroute">--</span></div><div class="bd-list" id="colEnroute"></div></div><div class="bd-col on_scene"><div class="bd-col-head"><h3>On Scene</h3><span class="count" id="cntOnscene">--</span></div><div class="bd-list" id="colOnscene"></div></div><div class="bd-col transporting"><div class="bd-col-head"><h3>Transporting</h3><span class="count" id="cntTransp">--</span></div><div class="bd-list" id="colTransp"></div></div><div class="bd-col closed"><div class="bd-col-head"><h3>Closed (12h)</h3><span class="count" id="cntClosed">--</span></div><div class="bd-list" id="colClosed"></div></div></div></div><script src="assets/auth.js?v=0.2.44"></script><script src="assets/shortcuts.js?v=0.2.44"></script><script src="assets/topbar.js?v=0.2.44"></script><script src="assets/version.js?v=0.2.44"></script><script>
(async function() {
  if (!await HAJJ.requireRole(['paramedic','gp','cluster_supervisor','dispatcher','leadership','admin','sar'])) return;
  CADTopbar.render({ title: "Board" });
  function fmtAge(ts, now) {
    const sec = now - ts;
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.floor(sec/60) + 'm';
    return Math.floor(sec/3600) + 'h';
  }
  function card(inc, now) {
    const cls = (inc.triage || 'green') + (inc.cardiac_arrest ? ' cardiac' : '');
    return '<div class="bd-inc ' + cls + '" onclick="location.href=' + "'/dispatch?focus=" + inc.incident_id + "'" + '">' +
      '<div style="display:flex; justify-content:space-between; align-items:start;">' +
        '<span class="id">' + inc.incident_id + '</span>' +
        '<span class="age">' + fmtAge(inc.ts, now) + '</span>' +
      '</div>' +
      '<div class="meta">' + (inc.station || '') + (inc.sub_location ? ' / ' + inc.sub_location : '') + ' · ' + (inc.unit_assigned || 'no unit') + '</div>' +
      '<div class="complaint">' + ((inc.complaint || '').slice(0, 80) || '<i style="color:#6b7d9e;">--</i>') + '</div>' +
      (inc.cardiac_arrest ? '<div class="cardiac-flag">⚡ CARDIAC ARREST</div>' : '') +
    '</div>';
  }
  async function refresh() {
    const r = await HAJJ.authedCall('board_summary', { lookback_hours: 12 });
    if (!r || !r.ok) { document.getElementById('bdMeta').textContent = 'Error'; return; }
    const now = r.server_now;
    document.getElementById('bdMeta').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · ' + r.total + ' incidents (12h)';
    document.getElementById('cntNew').textContent = r.counts.new;
    document.getElementById('cntEnroute').textContent = r.counts.en_route;
    document.getElementById('cntOnscene').textContent = r.counts.on_scene;
    document.getElementById('cntTransp').textContent = r.counts.transporting;
    document.getElementById('cntClosed').textContent = r.counts.closed;
    document.getElementById('colNew').innerHTML = r.columns.new.map(function(i){return card(i, now);}).join('') || '<div style="color:#6b7d9e; padding:14px; text-align:center; font-size:11px;">empty</div>';
    document.getElementById('colEnroute').innerHTML = r.columns.en_route.map(function(i){return card(i, now);}).join('') || '<div style="color:#6b7d9e; padding:14px; text-align:center; font-size:11px;">empty</div>';
    document.getElementById('colOnscene').innerHTML = r.columns.on_scene.map(function(i){return card(i, now);}).join('') || '<div style="color:#6b7d9e; padding:14px; text-align:center; font-size:11px;">empty</div>';
    document.getElementById('colTransp').innerHTML = r.columns.transporting.map(function(i){return card(i, now);}).join('') || '<div style="color:#6b7d9e; padding:14px; text-align:center; font-size:11px;">empty</div>';
    document.getElementById('colClosed').innerHTML = r.columns.closed.slice(0, 30).map(function(i){return card(i, now);}).join('') || '<div style="color:#6b7d9e; padding:14px; text-align:center; font-size:11px;">empty</div>';
  }
  refresh();
  setInterval(refresh, 8000);
})();
</script></body></html>
