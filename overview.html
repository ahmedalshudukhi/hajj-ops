<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e1a"><title>Operational Overview · Hajj 2026</title>
<link rel="stylesheet" href="assets/style.css?v=0.2.48">
<style>
body { background:#0a0e1a; color:#e7ecf7; font-family:'Inter',system-ui,sans-serif; margin:0; }
.ov-shell { max-width:1500px; margin:0 auto; padding:18px; }
.ov-hero { background:linear-gradient(135deg, rgba(20,30,55,0.85), rgba(15,20,40,0.85)); border:1px solid rgba(99,179,237,0.18); border-radius:14px; padding:18px 22px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; }
.ov-hero h1 { margin:0; font-size:20px; color:#cdf1ff; }
.ov-hero .sub { color:#93a4cd; font-size:12px; margin-top:4px; }
.ov-zone-tabs { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
.ov-zone-tab { padding:9px 18px; background:rgba(15,23,42,0.7); color:#93a4cd; border:1px solid rgba(99,179,237,0.22); border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; }
.ov-zone-tab:hover { background:rgba(56,189,248,0.13); color:#cdf1ff; }
.ov-zone-tab.active { background:rgba(56,189,248,0.3); color:#cdf1ff; border-color:rgba(56,189,248,0.55); }
.ov-zone-tab .pill { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px; background:rgba(99,179,237,0.2); font-size:10px; }
.ov-zone-tab.active .pill { background:rgba(252,211,77,0.25); color:#fcd34d; }
.ov-type-tabs { display:flex; gap:6px; flex-wrap:wrap; margin:-4px 0 14px; align-items:center; }
.ov-type-tabs .lbl { font-size:10px; color:#6b7d9e; letter-spacing:0.08em; text-transform:uppercase; margin-right:6px; }
.ov-type-tab { padding:6px 13px; background:rgba(15,23,42,0.5); color:#93a4cd; border:1px solid rgba(99,179,237,0.15); border-radius:99px; cursor:pointer; font-size:12px; font-weight:600; }
.ov-type-tab:hover { background:rgba(56,189,248,0.10); color:#cdf1ff; }
.ov-type-tab.active { background:rgba(168,85,247,0.25); color:#e9d5ff; border-color:rgba(168,85,247,0.5); }
.ov-type-tab .pill { display:inline-block; margin-left:5px; padding:0 6px; border-radius:99px; background:rgba(99,179,237,0.18); font-size:9px; }
.ov-type-tab.active .pill { background:rgba(168,85,247,0.35); color:#e9d5ff; }
.ov-totals { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:18px; }
.ov-total { background:rgba(20,28,50,0.55); border:1px solid rgba(99,179,237,0.18); border-radius:10px; padding:13px 16px; }
.ov-total .v { font-size:26px; font-weight:800; color:#67e8f9; line-height:1.1; }
.ov-total .l { font-size:11px; color:#93a4cd; text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; }
.ov-total .sub { font-size:10px; color:#6b7d9e; margin-top:5px; }
.ov-section-title { font-size:14px; color:#cdf1ff; letter-spacing:0.06em; text-transform:uppercase; margin:18px 0 10px; font-weight:600; display:flex; align-items:center; gap:10px; }
.ov-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:11px; }
.ov-station { background:rgba(20,28,50,0.55); border:1px solid rgba(99,179,237,0.18); border-radius:11px; padding:15px 18px; }
.ov-station h3 { margin:0 0 6px; font-size:15px; color:#cdf1ff; display:flex; justify-content:space-between; align-items:baseline; }
.ov-station h3 .zone-tag { font-size:10px; color:#94a3b8; letter-spacing:0.08em; text-transform:uppercase; font-weight:500; }
.ov-station .row { display:flex; justify-content:space-between; font-size:12px; color:#93a4cd; padding:5px 0; border-bottom:1px dashed rgba(99,179,237,0.08); }
.ov-station .row:last-child { border-bottom:0; }
.ov-station .row .v { color:#e7ecf7; font-weight:600; }
.ov-station .row .v.warn { color:#fcd34d; }
.ov-station .row .v.bad { color:#fca5a5; }
.ov-station .row .v.good { color:#86efac; }
.ov-station .breakdown { font-size:10px; color:#6b7d9e; margin-top:4px; }
.ov-notes-section { background:rgba(245,158,11,0.06); border:1px dashed rgba(245,158,11,0.30); border-radius:11px; padding:14px 18px; margin-top:18px; }
.ov-notes-title { font-size:11px; color:#fcd34d; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.ov-notes-content { color:#cbd5e1; font-size:13px; line-height:1.6; min-height:30px; white-space:pre-wrap; }
.ov-notes-edit-btn { background:rgba(56,189,248,0.2); color:#cdf1ff; border:1px solid rgba(56,189,248,0.4); border-radius:6px; padding:4px 12px; font-size:11px; cursor:pointer; font-weight:600; }
.ov-modal { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9000; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.ov-modal.visible { display:flex; }
.ov-modal-inner { background:#0e1530; border:1px solid rgba(99,179,237,0.25); border-radius:12px; padding:0; max-width:700px; width:100%; display:flex; flex-direction:column; }
.ov-modal h2 { margin:0; padding:16px 22px; border-bottom:1px solid rgba(99,179,237,0.16); color:#cdf1ff; font-size:16px; }
.ov-modal-body { padding:18px 22px; }
.ov-modal-body textarea { width:100%; min-height:240px; padding:14px 16px; border-radius:7px; background:rgba(15,23,42,0.7); color:#e7ecf7; border:1px solid rgba(99,179,237,0.22); font-size:13px; font-family:'Inter',system-ui,sans-serif; line-height:1.55; resize:vertical; }
.ov-modal-actions { padding:12px 22px; border-top:1px solid rgba(99,179,237,0.16); display:flex; gap:8px; justify-content:flex-end; }
.ov-btn { padding:8px 16px; border-radius:7px; cursor:pointer; font-weight:600; font-size:13px; border:1px solid rgba(99,179,237,0.3); background:rgba(15,23,42,0.7); color:#cdf1ff; }
.ov-btn:hover { background:rgba(56,189,248,0.18); }
.ov-btn.primary { background:rgba(34,197,94,0.22); color:#86efac; border-color:rgba(34,197,94,0.4); }
.ov-toast { position:fixed; top:14px; right:14px; padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; opacity:0; transition:opacity 0.3s; z-index:9500; background:rgba(34,197,94,0.22); color:#86efac; border:1px solid rgba(34,197,94,0.4); }
.ov-toast.visible { opacity:1; }
.ov-toast.error { background:rgba(239,68,68,0.22); color:#fca5a5; border-color:rgba(239,68,68,0.4); }
.ov-empty { color:#6b7d9e; padding:40px; text-align:center; }
</style>
</head>
<body>
<div id="topbar"></div>

<script src="assets/version.js?v=0.2.48"></script>
<script src="assets/config.js?v=0.2.48"></script>
<script src="assets/auth.js?v=0.2.48"></script>
<script src="assets/topbar.js?v=0.2.48"></script>
<script>HAJJ.requireSession();</script>

<div class="ov-shell">
  <div class="ov-hero">
    <div>
      <h1>📊 Operational Overview</h1>
      <div class="sub">Cross-section view of units, ambulances, and locations · per zone or whole-system · editable area notes</div>
    </div>
    <button class="ov-btn" id="ovRefresh">↻ Refresh</button>
  </div>

  <div class="ov-zone-tabs" id="ovZoneTabs"></div>
  <div class="ov-type-tabs" id="ovTypeTabs"></div>

  <div class="ov-totals" id="ovTotals"></div>

  <div class="ov-section-title">By Station</div>
  <div class="ov-grid" id="ovStations"></div>

  <div class="ov-notes-section">
    <div class="ov-notes-title">
      <span>📌 <span id="ovNotesScope">All Zones</span> — Operational Notes</span>
      <button class="ov-notes-edit-btn" id="ovNotesEdit" style="display:none;">✏ Edit notes</button>
    </div>
    <div class="ov-notes-content" id="ovNotesContent">Loading…</div>
  </div>
</div>

<div class="ov-modal" id="ovModal">
  <div class="ov-modal-inner">
    <h2 id="ovModalTitle">Edit Notes</h2>
    <div class="ov-modal-body">
      <textarea id="ovModalText" placeholder="Operational notes for this area. Visible to all signed-in users. Use line breaks to structure."></textarea>
    </div>
    <div class="ov-modal-actions">
      <button class="ov-btn" id="ovModalCancel">Cancel</button>
      <button class="ov-btn primary" id="ovModalSave">Save</button>
    </div>
  </div>
</div>

<div id="ovToast" class="ov-toast"></div>

<script>
(async function() {
  if (!HAJJ.requireAuth()) return;
  if (typeof CADTopbar !== 'undefined') CADTopbar.render({ title:"Overview", subtitle:"cross-section · editable" });

  const user = HAJJ.getUser();
  const canEdit = user && ['cluster_supervisor','dispatcher','leadership','admin'].includes(user.role);

  let _zone = 'all';
  let _unitType = 'all';
  let _data = null;

  const ZONES = [
    { key: 'all', label: 'All Zones', stations: 10 },
    { key: 'arafat', label: 'Arafat', stations: 3 },
    { key: 'muzdalifah', label: 'Muzdalifah', stations: 3 },
    { key: 'mina', label: 'Mina', stations: 3 },
    { key: 'occ', label: 'OCC', stations: 1 }
  ];

  // Operational unit codes used across the dashboard. Backend "type" values:
  // Medical = Mike, Ambulance = Alpha, Foot-Runner = Romeo. Everything else
  // (Command, Logistics, Training, Depot, etc.) groups under "Support".
  const TYPE_FILTERS = [
    { key: 'all',        label: 'All',     match: null },
    { key: 'Medical',    label: 'Mike',    match: ['Medical'] },
    { key: 'Ambulance',  label: 'Alpha',   match: ['Ambulance'] },
    { key: 'Foot-Runner',label: 'Romeo',   match: ['Foot-Runner'] },
    { key: 'Support',    label: 'Support', match: null /* computed as fallback */ }
  ];

  function toast(msg, isErr) {
    const el = document.getElementById('ovToast');
    el.textContent = msg;
    el.classList.toggle('error', !!isErr);
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 2000);
  }

  function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderZoneTabs() {
    document.getElementById('ovZoneTabs').innerHTML = ZONES.map(z =>
      `<button class="ov-zone-tab ${z.key === _zone ? 'active' : ''}" data-zone="${z.key}">${esc(z.label)}<span class="pill">${z.stations}</span></button>`
    ).join('');
    document.getElementById('ovZoneTabs').querySelectorAll('.ov-zone-tab').forEach(t => {
      t.addEventListener('click', () => {
        _zone = t.dataset.zone;
        renderZoneTabs();
        refresh();
      });
    });
  }

  // Match a unit against the active type filter.
  // - 'all'    → everything
  // - 'Medical' / 'Ambulance' / 'Foot-Runner' → exact type match
  // - 'Support' → anything that isn't one of the three operational types
  function unitMatches(u) {
    if (_unitType === 'all') return true;
    const t = u.type || u.unit_type || '';
    if (_unitType === 'Support') return !['Medical','Ambulance','Foot-Runner'].includes(t);
    return t === _unitType;
  }

  // Build type-tab counts from current zone slice (so a Mina view shows Mina counts).
  function buildTypeCounts() {
    const counts = { 'all': 0, 'Medical': 0, 'Ambulance': 0, 'Foot-Runner': 0, 'Support': 0 };
    if (!_data || !_data.by_station) return counts;
    for (const st of _data.by_station) {
      for (const u of (st.units || [])) {
        counts.all += 1;
        const t = u.type || u.unit_type || '';
        if (t === 'Medical' || t === 'Ambulance' || t === 'Foot-Runner') counts[t] += 1;
        else counts.Support += 1;
      }
    }
    return counts;
  }

  function renderTypeTabs() {
    const counts = buildTypeCounts();
    const html = '<span class="lbl">Unit type</span>' + TYPE_FILTERS.map(t => {
      const n = counts[t.key] || 0;
      // Hide Support chip if there are no support units in current zone slice
      if (t.key === 'Support' && n === 0) return '';
      return `<button class="ov-type-tab ${t.key === _unitType ? 'active' : ''}" data-type="${esc(t.key)}">${esc(t.label)}<span class="pill">${n}</span></button>`;
    }).join('');
    const el = document.getElementById('ovTypeTabs');
    el.innerHTML = html;
    el.querySelectorAll('.ov-type-tab').forEach(t => {
      t.addEventListener('click', () => {
        _unitType = t.dataset.type;
        renderTypeTabs();
        rerender();   // client-side filter, no fetch needed
      });
    });
  }

  function renderTotals(t) {
    // If a type filter is active, recompute totals from filtered units;
    // otherwise use the server-supplied totals directly.
    let units, paramedics, ambulances, stations, unit_types, ambulance_types, ambulance_classes, showAmb;
    if (_unitType === 'all') {
      units = t.units; paramedics = t.paramedics; ambulances = t.ambulances; stations = t.stations;
      unit_types = t.unit_types || {}; ambulance_types = t.ambulance_types || {}; ambulance_classes = t.ambulance_classes || {};
      showAmb = true;
    } else {
      units = 0; paramedics = 0; ambulances = 0; stations = 0;
      unit_types = {}; ambulance_types = {}; ambulance_classes = {};
      // Ambulances are only relevant when looking at Alpha (Ambulance) units.
      showAmb = (_unitType === 'Ambulance' || _unitType === 'all');
      for (const st of (_data.by_station || [])) {
        const matched = (st.units || []).filter(unitMatches);
        if (!matched.length) continue;
        stations += 1;
        units += matched.length;
        for (const u of matched) {
          paramedics += (u.size || u.total || 0);
          const ty = u.type || 'Other';
          unit_types[ty] = (unit_types[ty] || 0) + 1;
        }
        if (showAmb) {
          for (const a of (st.ambulances || [])) {
            ambulances += 1;
            if (a.type) ambulance_types[a.type] = (ambulance_types[a.type] || 0) + 1;
            if (a.cls)  ambulance_classes[a.cls] = (ambulance_classes[a.cls] || 0) + 1;
          }
        }
      }
    }

    const items = [
      { v: units, l: 'Units' },
      { v: paramedics, l: 'Paramedics' },
    ];
    if (showAmb) items.push({ v: ambulances, l: 'Ambulances' });
    items.push({ v: stations, l: 'Stations' });

    const types = Object.entries(unit_types).sort((a,b) => b[1] - a[1]);
    const ambTypes = Object.entries(ambulance_types);
    const ambCls = Object.entries(ambulance_classes);

    let html = items.map(i =>
      `<div class="ov-total"><div class="v">${i.v}</div><div class="l">${i.l}</div></div>`
    ).join('');
    html += `<div class="ov-total"><div class="v">${types.length}</div><div class="l">Unit Types</div>
       <div class="sub">${types.slice(0,3).map(([k,v]) => k+': '+v).join(' · ')}</div>
     </div>`;
    if (showAmb && (ambTypes.length || ambCls.length)) {
      html += `<div class="ov-total"><div class="v">${ambTypes.length || 0}</div><div class="l">Amb. Mix</div>
         <div class="sub">${ambTypes.map(([k,v]) => k+': '+v).join(' · ')}${ambCls.length ? '<br>'+ambCls.map(([k,v]) => k+': '+v).join(' · ') : ''}</div>
       </div>`;
    }
    document.getElementById('ovTotals').innerHTML = html;
  }

  function ZONE_OF(st) {
    if (!st) return '';
    if (st.startsWith('ARF')) return 'Arafat';
    if (st.startsWith('MUZ')) return 'Muzdalifah';
    if (st.startsWith('MIN')) return 'Mina';
    if (st === 'OCC') return 'OCC';
    return st;
  }

  function renderStations(byStation) {
    const grid = document.getElementById('ovStations');
    if (!byStation || !byStation.length) { grid.innerHTML = '<div class="ov-empty">No stations in this zone.</div>'; return; }
    // Apply type filter: drop stations whose units don't match.
    const showAmb = (_unitType === 'all' || _unitType === 'Ambulance');
    const stations = byStation.map(s => {
      const matched = (s.units || []).filter(unitMatches);
      return { ...s, units: matched };
    }).filter(s => s.units.length > 0);

    if (!stations.length) {
      grid.innerHTML = '<div class="ov-empty">No units of this type in the selected zone.</div>';
      return;
    }

    grid.innerHTML = stations.map(s => {
      const filled = s.units.reduce((sum, u) => sum + (u.filled || 0), 0);
      const total = s.units.reduce((sum, u) => sum + (u.total || 0), 0);
      const paras = s.units.reduce((sum, u) => sum + (u.size || u.total || 0), 0);
      const fillPct = total ? Math.round(filled / total * 100) : 0;
      const fillCls = fillPct >= 90 ? 'good' : (fillPct >= 60 ? 'warn' : 'bad');
      // Type breakdown (filtered)
      const typeCounts = {};
      s.units.forEach(u => { const t = u.type || 'Other'; typeCounts[t] = (typeCounts[t] || 0) + 1; });
      const typesText = Object.entries(typeCounts).map(([k,v]) => k+': '+v).join(' · ');
      const ambs = showAmb ? (s.ambulances || []) : [];
      const ambReady = ambs.filter(a => a.status === 'Ready' || !a.status).length;
      const ambTypes = {};
      ambs.forEach(a => ambTypes[a.type] = (ambTypes[a.type] || 0) + 1);
      const ambBreak = Object.entries(ambTypes).map(([k,v]) => k+': '+v).join(' · ');
      const located = s.units.filter(u => u.location).length;
      return `
        <div class="ov-station">
          <h3>${esc(s.station)} <span class="zone-tag">${esc(ZONE_OF(s.station))}</span></h3>
          <div class="row"><span>Units</span><span class="v">${s.units.length}</span></div>
          <div class="row"><span>Paramedics on site</span><span class="v">${paras}</span></div>
          ${total ? '<div class="row"><span>Roster fill</span><span class="v '+fillCls+'">'+filled+' / '+total+' ('+fillPct+'%)</span></div>' : ''}
          ${typesText ? '<div class="breakdown">'+esc(typesText)+'</div>' : ''}
          ${showAmb ? '<div class="row" style="margin-top:6px;"><span>Ambulances</span><span class="v">'+ambs.length+' ('+ambReady+' ready)</span></div>' : ''}
          ${showAmb && ambBreak ? '<div class="breakdown">'+esc(ambBreak)+'</div>' : ''}
          ${located ? '<div class="row"><span>Units with exact location</span><span class="v good">'+located+'/'+s.units.length+'</span></div>' : ''}
        </div>`;
    }).join('');
  }

  // Client-side re-render (no server round-trip). Used when the user
  // switches the unit-type chip without changing zone.
  function rerender() {
    if (!_data) return;
    renderTotals(_data.totals || {});
    renderStations(_data.by_station || []);
  }

  async function loadNotes() {
    const scope = ZONES.find(z => z.key === _zone);
    document.getElementById('ovNotesScope').textContent = scope ? scope.label : 'Notes';
    const r = await HAJJ.authedCall('card_get', { slug: 'overview:notes:' + _zone });
    const content = (r && r.ok && r.content) || '';
    document.getElementById('ovNotesContent').textContent = content || '(no notes yet — leadership can add some)';
    if (canEdit) {
      const btn = document.getElementById('ovNotesEdit');
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        document.getElementById('ovModalTitle').textContent = 'Edit Notes — ' + (scope ? scope.label : '');
        document.getElementById('ovModalText').value = content;
        document.getElementById('ovModal').classList.add('visible');
        document.getElementById('ovModalText').focus();
      };
    }
  }

  async function refresh() {
    const r = await HAJJ.authedCall('overview_summary', { zone: _zone });
    if (!r || !r.ok) { toast('Failed to load: ' + ((r && r.error) || '?'), true); return; }
    _data = r;
    renderTypeTabs();
    renderTotals(r.totals);
    renderStations(r.by_station);
    await loadNotes();
  }

  document.getElementById('ovRefresh').addEventListener('click', refresh);
  document.getElementById('ovModalCancel').addEventListener('click', () => {
    document.getElementById('ovModal').classList.remove('visible');
  });
  document.getElementById('ovModalSave').addEventListener('click', async () => {
    const content = document.getElementById('ovModalText').value;
    const scope = ZONES.find(z => z.key === _zone);
    const r = await HAJJ.authedCall('docs_save', {
      slug: 'overview:notes:' + _zone,
      title: 'Overview Notes — ' + (scope ? scope.label : _zone),
      content
    });
    if (r && r.ok) { toast('Saved v' + r.version); document.getElementById('ovModal').classList.remove('visible'); loadNotes(); }
    else toast('Save failed: ' + ((r && r.error) || '?'), true);
  });
  document.getElementById('ovModal').addEventListener('click', e => {
    if (e.target.id === 'ovModal') document.getElementById('ovModal').classList.remove('visible');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('ovModal').classList.remove('visible');
  });

  renderZoneTabs();
  await refresh();
})();
</script>
</body></html>
